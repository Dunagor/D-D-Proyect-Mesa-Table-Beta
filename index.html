*{box-sizing:border-box}body{margin:0 auto;max-width:1200px;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:clamp(10px,2vw,26px)}h1{font-size:clamp(1.55rem,3vw,2.3rem);line-height:1.12;letter-spacing:-.035em;margin:0}h2{font-size:1.15rem;letter-spacing:-.02em;margin:0 0 12px}h4{margin:4px 0 8px;font-size:.94rem}p{margin:10px 0}a{color:var(--acc)}.mut{color:var(--mut);font-size:.88rem}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:clamp(14px,2vw,22px);margin-bottom:16px;box-shadow:var(--shadow);min-width:0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.compact{gap:5px}.top-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px}#topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#topbar>.subtitle{max-width:550px}.eyebrow{font-size:.72rem;font-weight:850;letter-spacing:.13em;color:var(--acc);text-transform:uppercase}button,input,select,textarea{font:inherit;color:inherit;max-width:100%}button{border:1px solid var(--bd);background:var(--card);border-radius:11px;padding:10px 13px;min-height:42px;cursor:pointer;touch-action:manipulation;font-weight:550}button:hover{border-color:var(--acc)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}button:disabled{opacity:.44;cursor:not-allowed}.primary,.tabs button.on{color:white;background:#58449c;border-color:#58449c}.primary:hover,.tabs button.on:hover{background:#6d57b5}.tabs{display:flex;align-items:center;gap:7px;overflow:auto;scrollbar-width:thin;margin:20px 0;padding-bottom:7px}.tabs button{flex:1 0 auto;white-space:nowrap}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:11px}.field{display:flex;flex-direction:column;gap:4px;font-size:.87rem;color:var(--mut);min-width:0}.field input,.field select,.field textarea{width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px 11px;min-height:43px;font-size:1rem}.field textarea{min-height:110px;resize:vertical}.field.compact{width:68px}.field.compact input{padding:6px;min-height:36px}.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,var(--card),var(--bg))}.hero h2{font-size:clamp(1.3rem,3vw,1.9rem);margin:4px 0}.hero p{max-width:640px}.hero-pill{display:flex;flex-direction:column;min-width:80px;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:13px;padding:12px;background:var(--card);color:var(--acc);font-weight:650;text-align:center}.hero-pill strong{font-size:2rem}.hero-pill small{font-size:.75rem}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.metric{display:flex;flex-direction:column;gap:8px}.metric>span:first-child{color:var(--mut);font-size:.9rem}.metric input{width:80px;min-height:40px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink)}.metric strong.big-num{font-size:1.65rem}.meter{height:7px;background:var(--bd);border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}.ability-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.ab{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:12px;padding:9px 4px;background:var(--bg)}.ab span{font-size:.8rem;font-weight:700;color:var(--mut)}.ab strong{font-size:1.65rem}.ab input{width:75px;text-align:center;border:1px solid var(--bd);border-radius:7px;padding:6px;background:var(--card);color:var(--ink)}.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px}.skill{display:flex;align-items:center;gap:6px;min-height:34px;border-bottom:1px solid var(--bd)}.skill span{flex:1}.skill b{font-variant-numeric:tabular-nums}.proficiency{min-width:30px;min-height:30px;padding:0;border-radius:50%;font-size:1.2rem;border:0}.proficiency.selected{color:var(--acc)}.pill-row{display:flex;flex-wrap:wrap;gap:7px}.tag{display:inline-flex;padding:3px 8px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;font-size:.78rem;white-space:nowrap}.slot-list{margin:16px 0}.slot-row{display:grid;grid-template-columns:minmax(115px,.7fr) minmax(150px,1.4fr) auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}.slot-row>div:first-child{display:flex;flex-direction:column}.slot-dots{display:flex;flex-wrap:wrap;gap:6px}.slot-dot{width:27px;height:27px;min-height:27px;border-radius:50%;padding:0;border:2px solid var(--acc2)}.slot-dot.available{background:var(--acc2)}.slot-dot.spent{background:transparent}.pick{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.92rem}.pick input{width:19px;height:19px;accent-color:var(--acc2)}.filters{margin:12px 0 18px}.filters input,.filters select,.cast-controls select,.card>select{border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:9px;min-height:43px;color:var(--ink)}.filters>input{flex:2 1 180px}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.sp{border:1px solid var(--bd);border-radius:12px;margin:10px 0;padding:13px;overflow-wrap:anywhere;background:var(--card)}.sp summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:7px;list-style-position:inside}.spell-name{font-weight:750}.sp[open]>summary{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}.spell-desc{font-size:.95rem;line-height:1.65}.spell-desc p{white-space:pre-line}.cast-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0}.limit-box{border-top:1px solid var(--bd);margin-top:12px;padding-top:10px}.limit-box ol{padding-left:23px}.limit-box li{padding:3px 0}.editor{border-top:1px solid var(--bd);margin-top:13px;padding-top:12px}.editor summary{font-weight:650;color:var(--acc);margin-bottom:12px}.editor .field{margin:9px 0}.concentration{border-left:4px solid var(--acc2);padding:8px 11px;background:var(--bg)}.concentration button{min-height:30px;padding:4px 8px}.grid{display:grid;gap:2px;background:var(--cell);padding:6px;border-radius:8px;width:max-content;max-width:100%;overflow:auto}.c{width:clamp(28px,5vw,34px);height:clamp(28px,5vw,34px);background:var(--cell2);border:1px solid #0003;font-size:9px;padding:0;color:var(--ink);overflow:hidden;min-height:0;border-radius:4px}.c.off{background:#0004;cursor:not-allowed}.c.it{color:white}.ok{color:var(--good)}.bad{color:#c33}#v{min-width:0}#v .row>*{max-width:100%}

@media(max-width:480px){body{padding:10px}.card{border-radius:13px;padding:13px}.metric-grid{grid-template-columns:1fr 1fr;gap:8px}.metric input{width:61px}.hero{align-items:flex-start}.hero-pill{padding:7px}.hero-pill strong{font-size:1.4rem}.ability-grid{grid-template-columns:repeat(3,1fr);gap:7px}.slot-dots{gap:5px}.slot-dot{width:26px;height:26px;min-height:26px}.cast-controls button,.cast-controls select{flex:1 1 100%}.grid{max-width:100%;overflow:auto}}

<script>
const CL={Bárbaro:[32,'',0],Guerrero:[30,'',0],Paladín:[30,'car','h'],Explorador:[28,'sab','h'],Artífice:[26,'int','h'],Monje:[24,'',0],Clérigo:[24,'sab','f'],Druida:[24,'sab','f'],Pícaro:[22,'',0],Bardo:[22,'car','f'],Brujo:[20,'car','p'],Hechicero:[18,'car','f'],Mago:[18,'int','f'],Pugilista:[26,'',0]};
const AB=['FUE','DES','CON','INT','SAB','CAR'],AK=['fue','des','con','int','sab','car'];
const FULL={1:[2],2:[3],3:[4,2],4:[4,3],5:[4,3,2],6:[4,3,3],7:[4,3,3,1],8:[4,3,3,2],9:[4,3,3,3,1],10:[4,3,3,3,2],11:[4,3,3,3,2,1],13:[4,3,3,3,2,1,1],15:[4,3,3,3,2,1,1,1],17:[4,3,3,3,2,1,1,1,1],18:[4,3,3,3,3,1,1,1,1],19:[4,3,3,3,3,2,1,1,1],20:[4,3,3,3,3,2,2,1,1]};
const HALF={1:[2],3:[3],5:[4,2],7:[4,3],9:[4,3,2],11:[4,3,3],13:[4,3,3,1],15:[4,3,3,2],17:[4,3,3,3,1],19:[4,3,3,3,2]};
const look=(t,l)=>{let k=Math.max(...Object.keys(t).filter(x=>x<=l));return t[k]||[]};
const SP=[{"n": "Abrir", "lv": 2, "esc": "Transmutación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Elige un objeto que puedas ver dentro del alcance. Puede ser una puerta, una caja, un cofre, unas espo- sas, un candado o cualquier otro objeto que posea alguna manera mágica o mundana de impedir el acceso. Un objetivo que esté cerrado mediante una cerradura normal o que esté atascado o atrancado se abre, desatasca o desatranca. Si el objeto tiene varios cerrojos, solo se desbloquea uno de ellos. Si el objetivo está cerrado mediante cerradura arcana, ese conjuro quedará anulado durante 10 minutos y, durante ese tiempo, el objeto se podrá abrir y cerrar. Cuando lanzas el conjuro, se escucha un fuerte golpe surgir del objetivo, que es audible a una dis- tancia de 90 m."}, {"n": "Acelerar", "lv": 3, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (un viruta de raíz de regaliz) Duración: Concentración, hasta 1 minuto¶Elige a una criatura voluntaria que puedas ver dentro del alcance. Hasta que el conjuro termine, la velocidad del objetivo se duplica, gana un boni- ficador de +2 a su clase de armadura, tiene ventaja en tiradas de salvación de Destreza y consigue una segunda acción en cada uno de sus turnos. Solo p  uede utilizar esta acción para llevar a cabo una acción de atacar (solo un ataque), correr, destrabarse, esconderse o utilizar. Cuando el conjuro termine, el objetivo tendrá el estado de incapacitado y una velocidad de 0 hasta el final de su siguiente turno, debido a una ola de somnolencia que lo afecta."}, {"n": "Adivinación", "lv": 4, "esc": "Adivinación", "cl": ["clérigo", "druida", "mago"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S, M (incienso que valga al menos 25 po, que se consume como parte del conjuro) Duración: Instantáneo¶Este conjuro te pone en contacto con un dios o sus sirvientes. Puedes hacer una pregunta sobre un objetivo, un suceso o una actividad específicos que ocurrirán en los próximos 7 días. Tu GM te dará¶una respuesta verdadera, que puede ser una frase corta o una rima críptica. El conjuro no tiene en cuenta ninguna circunstancia que pueda alterar la respuesta, como por ejemplo el lanzamiento de otros conjuros. Si lanzas el conjuro más de una vez antes de fina- lizar un descanso largo, hay una posibilidad acumu- lativa del 25 % por cada lanzamiento después del primero de que no recibas ninguna respuesta."}, {"n": "Agarre electrizante", "lv": 0, "esc": "evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Instantáneo¶Una descarga eléctrica surge de tu mano hacia una criatura que intentas tocar. Haz un ataque de conjuro cuerpo a cuerpo contra el objetivo. Si acierta, el objetivo recibirá 1d8 de daño de relám- pago y no podrá realizar ataques de oportunidad hasta el principio de su siguiente turno. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Agrandar/reducir", "lv": 2, "esc": "Transmutación", "cl": ["bardo", "druida", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una pizca hierro en polvo) Duración: Concentración, hasta 1 minuto¶Hasta que el conjuro termine, aumenta o reduce el tamaño de una criatura u objeto que puedas ver dentro del alcance (consulta el efecto elegido a con- tinuación). Si el objetivo es un objeto, no puede estar llevándolo ni vistiéndolo nadie. Si es una criatura no voluntaria, puede hacer una tirada de salvación de Constitución y, si la supera, el conjuro no tiene efecto. Todo lo que vista y lleve una criatura objetivo cambiará de tamaño con ella y cualquier objeto que suelte volverá a su tamaño normal de inmedia- to. Un arma arrojadiza o un proyectil recuperará su t amaño normal justo después de acertar a un objetivo o fallar. Agrandar. El tamaño del objetivo aumenta en una categoría; por ejemplo, de Mediano a Grande. El objetivo también tendrá ventaja en las pruebas de Fuerza y en las tiradas de salvación de Fuerza. Ade- más, sus ataques con armas agrandadas o sin armas causan 1d4 de daño adicional al acertar. Reducir. El tamaño del objetivo se reduce en una categoría; por ejemplo, de Mediano a Pequeño. El objetivo también tendrá desventaja en las pruebas de Fuerza y en las tiradas de salvación de¶ uerza. Los ataques que haga con armas reducidas F o sin armas causan 1d4 menos de daño al acertar (esto no puede reducir el daño a menos de 1)."}, {"n": "Alarma", "lv": 1, "esc": "Abjuración", "cl": ["explorador", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: 9 m Componentes: V, S, M (una campana e hilo de plata) Duración: 8 horas¶Preparas una alarma contra los intrusos. Elige una puerta, una ventana o una zona dentro del alcance que no sea mayor que un cubo de 6 m de lado. Hasta que el conjuro termine, una alarma te alertará siempre que una criatura toque la zona vigilada o entre en ella. Al lanzar el conjuro, puedes designar qué criaturas no activarán la alarma, que puede ser mental o sonora: Alarma mental. La alarma te avisará con un sonido dentro de tu mente si estás a 1,5 km o menos de la zona vigilada. Si estás durmiendo, te despertará. Alarma sonora. La alarma producirá el sonido de una campanilla durante 10 segundos, que será audible a 18 m o menos de la zona vigilada."}, {"n": "Aliado planar", "lv": 6, "esc": "Conjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Suplicas la ayuda de una entidad de otro mundo, la cual debe resultarte conocida: un dios, un príncipe demonio u otro ser con poder cósmico. Esa entidad enviará a un celestial, un elemental o un infernal que le sea leal para ayudarte, criatura que apare- cerá en un espacio sin ocupar dentro del alcance. Si sabes el nombre de una criatura específica, puedes pronunciarlo cuando lances el conjuro para solicitar a esa criatura, aunque igualmente podría aparecer otra (a elección de tu GM). Cuando la criatura aparece, no se siente forzada a comportarse de ningún modo concreto. Puedes pedirle que realice un servicio a cambio de un pago, pero no está obligada a hacerlo. La tarea solicitada podría ser muy sencilla (“ayúdanos a cruzar esta sima volando” o “échanos una mano en la batalla”) o algo más complicado (“espía a nuestros enemigos” o “protégenos mientras exploramos la mazmorra”). Para negociar por los servicios de la criatura, debes poder comunicarte con ella. El pago puede adoptar una gran variedad de formas. Un celestial podría solicitar una importante donación de oro u objetos mágicos a un templo aliado, mientras que un infernal podría exigir el sacrificio de un ser vivo o un regalo de un tesoro.¶Algunas criaturas podrían solicitar que lleves a cabo alguna misión a cambio de sus servicios. Una tarea que pueda medirse en minutos requiere un pago equivalente a 100 po por minuto. Una tarea que se mida en horas requiere 1000 po por hora, y una tarea que se mida en días (hasta 10 días) requiere 10 000 po por día. Tu GM puede adaptar los pagos en función de las circunstancias en las que lances el conjuro. Si la tarea está en sintonía con los valores de la criatura, el pago podría reducirse a la mitad o incluso no ser necesario. Las tareas que no implican peligro suelen exigir solo la mitad del pago sugerido, mientras que las que son e specialmente peligrosas podrían requerir una donación aún mayor. Raramente una criatura aceptará una tarea que parezca suicida. Una vez que la criatura complete su tarea o cuando finalice el tiempo de servicio acordado, volverá a su plano natal tras informarte de ello si es posible. Si no eres capaz de llegar a un acuerdo sobre el precio del servicio de la criatura, esta regresará a su plano natal de inmediato."}, {"n": "Aliento de dragón", "lv": 2, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Toque Componentes: V, S, M (una guindilla) Duración: Concentración, hasta 1 minuto¶Tocas a una criatura voluntaria y eliges ácido, frío, fuego, relámpago o veneno. Hasta que el conjuro termine, el objetivo puede usar una acción de magia para exhalar en un cono de 4,5 m. Todas las criaturas situadas en la zona hacen una tirada de salvación de Destreza; sufrirán 3d6 de daño del tipo elegido si la fallan o la mitad del daño si la superan. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Alterar el propio aspecto", "lv": 2, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 1 hora¶Modificas tu forma física. Elige una de las siguientes opciones. Los efectos duran hasta que el conjuro termine; entretanto, puedes usar una acción de ma- gia para sustituir la opción elegida por otra distinta. Adaptación acuática. Te salen branquias y te crecen membranas entre los dedos. Puedes respirar bajo el agua y obtienes una velocidad nadando igual a tu velocidad.¶Armas naturales. Te crecen cascos (contundente), colmillos (perforante), cuernos (perforante) o garras (cortante). Cuando hagas un ataque sin armas para causar daño con el nuevo apéndice, hará 1d6 de daño del tipo indicado entre paréntesis en vez del daño normal de tu ataque sin armas. Ade- más, usarás tu modificador por aptitud mágica para las tiradas de ataque y de daño en vez de tu Fuerza. Cambiar de aspecto. Alteras tu apariencia. Decide tu aspecto, especificando tu altura, peso, rasgos faciales, timbre de voz, longitud del pelo, tono de piel y cualquier otro rasgo distintivo. Puedes pre- sentarte como un miembro de otra especie, aunque esto no modificará tu perfil de juego. No puedes adoptar el aspecto de una criatura de un tamaño distinto y conservarás tu forma básica: si eres una criatura bípeda, no podrás usar este conjuro para ser un cuadrúpedo, por ejemplo. Hasta que termine el conjuro, puedes usar una acción de magia para volver a cambiar tu aspecto."}, {"n": "Alterar los recuerdos", "lv": 5, "esc": "Encantamiento", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Intentas modificar los recuerdos de otra criatura. Una criatura que puedas ver dentro del alcance realiza una tirada de salvación de Sabiduría. Si estás luchando contra ella, tendrá ventaja en la tirada. Si la falla, tendrá el estado de hechizada hasta que termine el conjuro. Mientras esté hechizado de esta manera, el objetivo también tiene el estado de inca- pacitado y no es consciente de su entorno, aunque puede oírte. Si recibe cualquier daño o es el objetivo de otro conjuro, este conjuro termina y no se modi- fica ninguno de sus recuerdos. Mientras dure este sortilegio, puedes afectar al recuerdo de un suceso que haya vivido el objetivo durante las últimas 24 horas y que no haya durado más de 10 minutos. Puedes eliminar permanente mente todo recuerdo del suceso, permitir que lo recuerde con claridad perfecta, cambiar cómo recuerda los detalles o crear un recuerdo de otro suceso. Debes hablarle al objetivo para describir cómo se ven afectados sus recuerdos y este debe poder com- prender tu idioma para que los recuerdos modificados se asienten. Su mente llenará cualquier hueco que falte en los detalles de tu descripción. Si el conjuro termina antes de que acabes de describir los recuerdos modi- ficados, la memoria de la criatura no se verá afectada. De lo contrario, los recuerdos modificados ocuparán el lugar de los reales en cuanto el conjuro termine. Un recuerdo modificado no tiene por qué afectar al comportamiento de una criatura, en especial si¶contradice sus inclinaciones naturales, su alinea- miento o sus creencias. Un recuerdo modificado que no sea lógico, como cuánto disfrutó bañándose en ácido, se difuminará y la criatura lo considerará un mal sueño. Tu GM podría considerar que un recuerdo modificado es demasiado ilógico como para afectar a una criatura. Un conjuro levantar maldición o restablecimiento mayor lanzado sobre el objetivo restaurará los recuerdos auténticos de la criatura. Con un espacio de conjuro de nivel superior. Puedes alterar recuerdos del objetivo de un suceso que ocurrió hace 7 días (espacio de nivel 6), 30 días (espacio de nivel 7), 365 días (espacio de nivel 8) o en cualquier momento del pasado de la criatura (espacio de nivel 9)."}, {"n": "Alzar a los muertos", "lv": 5, "esc": "Nigromancia", "cl": ["bardo", "clérigo", "paladín"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (un diamante que valga al menos 500 po y que se consume como parte del conjuro) Duración: Instantáneo¶Con un toque, revives a una criatura que no lleve más de 10 días muerta y que no fuera un muerto viviente cuando falleció. La criatura vuelve a la vida con 1 punto de golpe. El conjuro también neutraliza cualquier veneno que afectase a la criatura en el momento de su muerte. Este conjuro cierra todas las heridas mortales, pero no devuelve las partes del cuerpo que faltan. Si a la criatura le faltan partes del cuerpo u órganos fundamentales para que sobreviva (por ejemplo, la cabeza), el conjuro falla automáticamente. Regresar de entre los muertos es una experiencia complicada. El objetivo tendrá un penalizador de −4 a las pruebas con d20. Cada vez que finalice un des- canso largo, el penalizador se reduce en 1 hasta desaparecer."}, {"n": "Animar a los muertos", "lv": 3, "esc": "Nigromancia", "cl": ["clérigo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 3 m Componentes: V, S, M (una gota de sangre, un pedazo de carne y una pizca de polvo de hueso) Duración: Instantáneo¶Elige un montón de huesos o un cadáver de un humanoide Mediano o Pequeño dentro del alcance. El objetivo se convierte en una criatura muerta v iviente: un esqueleto si eliges un montón de huesos o un zombi si eliges un cadáver (consulta los perfiles de las criaturas en el capítulo “Monstruos”). En cada uno de tus turnos, puedes usar una acción adicional para dar órdenes mentalmente a cada¶criatura que hayas creado con el conjuro que esté a 18 m o menos de ti (si controlas a varias criaturas, puedes dar órdenes a cualesquiera de ellas a la vez transmitiéndole la misma orden a cada una). Tú de- cides qué acción llevará a cabo la criatura y adónde se moverá en su siguiente turno, o puedes dar una orden general, como proteger una cámara o un pasadizo. Si no das ninguna orden, la criatura hace la acción de esquivar y solo se mueve para evitar peligros. En cuanto se le dé una orden, la criatura la cumplirá hasta completar su tarea. La criatura estará bajo tu control durante 24 horas, tras las cuales dejará de obedecer cual- quier orden que le hayas dado. Para mantener el control sobre ella otras 24 horas, deberás volver a lanzarle este conjuro antes de que acabe el periodo actual de 24 horas. Este uso del conjuro refuerza tu control sobre hasta cuatro criaturas que hayas animado con él y no anima una nueva criatura. Con un espacio de conjuro de nivel superior. Animas o refuerzas el control sobre dos criaturas muertas vivientes adicionales por cada nivel de conjuro por encima de 3 que tenga el espacio. Cada una de las criaturas debe proceder de un cadáver o un montón de huesos distinto."}, {"n": "Animar objetos", "lv": 5, "esc": "Transmutación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tus órdenes hacen que los objetos cobren vida. Elige una cantidad de objetos no mágicos dentro del alcance que no vista ni lleve nadie, que no estén fijos en una superficie y que no sean Gargantuescos. La cantidad máxima de objetos es igual a tu modifi- cador por aptitud mágica. A estos efectos, un objeti- vo Mediano o más pequeño cuenta como un objeto, un objetivo Grande cuenta como dos y un objetivo Enorme cuenta como tres. Cada objetivo se animará, le crecerán patas, se convertirá en un autómata que emplea el perfil de un objeto animado y permanecerá bajo tu control hasta que el conjuro termine o hasta que sus puntos de golpe se reduzcan a 0. Cada criatura que crees con este conjuro se considera una aliada para tus aliados y para ti. En combate, comparte tu orden de iniciativa y su turno va justo después del tuyo. Hasta que el conjuro termine, puedes usar una ac- ción adicional para dar órdenes mentalmente a cada criatura que hayas creado con el conjuro que esté a 150 m o menos de ti (si controlas a varias criatu- ras, puedes dar órdenes a cualesquiera de ellas a la vez transmitiéndole la misma orden a cada una). Si no das ninguna orden, la criatura hace la acción de esquivar y solo se mueve para evitar peligros.¶Cuando los puntos de golpe de la criatura se reduz- can a 0, recuperará su forma de objeto y cualquier daño sobrante se aplicará a esa forma. Con un espacio de conjuro de nivel superior. El daño del golpe de la criatura aumenta en 1d4 (Mediana o más pequeña), 1d6 (Grande) o 1d12 (Enorme) por cada nivel por encima de 5 que tenga el espacio.¶Objeto animado¶Autómata Enorme o más pequeño, sin alineamiento CA: 15 PG: 10 (Mediano o más pequeño), 20 (Grande), 40 (Enorme) Velocidad: 9 m MOD. SALV.¶MOD. SALV.¶MOD. SALV.¶Fue 16 +3 +3 Int 3 −4 −4¶Des 10 +0 +0 Sab 3 −4 −4¶Con 10 +0 +0 Car 1 −5 −5¶Inmunidades: psíquico, veneno; asustado, cansancio, envenenado, hechizado, paralizado Sentidos: visión ciega 9 m; Percepción pasiva 6 Idiomas: entiende los idiomas que conozcas VD: ninguno (0 PX; BC igual a tu bonificador por competencia)¶Acciones Golpe. Tirada de ataque cuerpo a cuerpo: bonificador igual a tu modificador de ataque de conjuros, alcance 1,5 m. Acierto: daño de fuerza igual a 1d4 + 3 (Mediano o más pequeño), 2d6 + 3 + tu modificador por aptitud mágica (Grande) o 2d12 + 3 + tu modificador por aptitud mágica (Enorme)."}, {"n": "Antipatía/simpatía", "lv": 8, "esc": "Encantamiento", "cl": ["bardo", "druida", "mago"], "t": "Tiempo de lanzamiento: 1 hora Alcance: 18 m Componentes: V, S, M (una mezcla de vinagre y miel) Duración: 10 días¶Mientras lanzas el conjuro, elige si crea antipatía o simpatía y haz objetivo a una criatura u objeto de tamaño Enorme o más pequeño. A continuación, selecciona un tipo de criatura, como dragones rojos, goblins o vampiros. Las criaturas del tipo elegido harán una tirada de salvación de Sabiduría cuando se acerquen a 36 m o menos del objetivo. La elección de antipatía o simpatía determina lo que le sucede a una criatura si falla la salvación: Antipatía. La criatura tiene el estado de asustada y deberá utilizar su movimiento en sus turnos para alejarse lo máximo posible del objetivo por la ruta más segura. Simpatía. La criatura tiene el estado de hechizada y deberá utilizar su movimiento en sus turnos para acercarse lo máximo posible al objetivo por¶la ruta más segura. Si la criatura se encuentra a 1,5 m o menos del objetivo, no podrá alejarse de él voluntariamente. Si el objetivo daña a la criatura hechizada, esta podrá hacer una tirada de salvación de Sabiduría para poner fin al efecto, como se describe a continuación.¶Poner fin al efecto. Si la criatura asustada o hechizada termina su turno a más de 36 m del objetivo, deberá hacer una tirada de salvación de Sabiduría. Si la supera, dejará de verse afectada por el objetivo. Las criaturas que superen la tirada de salvación contra este efecto serán inmunes a él durante 1 minuto y después podrán verse afectadas otra vez."}, {"n": "Apariencia", "lv": 5, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: 8 horas¶Le das una apariencia ilusoria a cada criatura de tu elección que puedas ver dentro del alcance. Un ob- jetivo no voluntario puede hacer una tirada de salvación de Carisma y, si la supera, el conjuro no le afectará. Puedes dar la misma apariencia o una distinta a cada objetivo, así como cambiar el aspecto de sus cuerpos y equipo. Puedes hacer que cada criatura parezca 30 cm más alta o más baja y de complexión más pesada o ligera. Un nuevo aspecto debe tener la misma configuración básica de miembros que el objetivo, aunque en el resto de aspectos, la ilusión queda a tu elección y permanecerá hasta que el conjuro termine. Los cambios realizados por este conjuro pueden descubrirse mediante una inspección física. Por ejemplo, si usas este conjuro para añadir un som- brero a la vestimenta de una criatura, los objetos atravesarán el sombrero. Si una criatura emplea la acción de estudiar para examinar a un objetivo, podrá hacer una prueba de Inteligencia (Investigación) contra tu CD de salva- ción de conjuros. Si la supera, sabrá que el objetivo está disfrazado."}, {"n": "Arma espiritual", "lv": 2, "esc": "Evocación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Creas una fuerza espectral flotante con el aspecto de un arma de tu elección que permanece hasta que termine el conjuro. La fuerza aparece dentro del¶alcance en un espacio de tu elección y puedes hacer inmediatamente un ataque de conjuro cuerpo a cuerpo contra una criatura que esté a 1,5 m o menos de ella. Si acierta, el objetivo recibe una cantidad de daño de fuerza igual a 1d8 más tu modificador por aptitud mágica. Como acción adicional en tus siguientes turnos, podrás mover la fuerza hasta 6 m y repetir el ataque contra una criatura que esté a 1,5 m o menos de ella. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Arma mágica", "lv": 2, "esc": "Transmutación", "cl": ["explorador", "hechicero", "mago", "paladín"], "t": "mago, paladín) Tiempo de lanzamiento: Acción adicional Alcance: Toque Componentes: V, S Duración: 1 hora¶Tocas un arma no mágica. Hasta que el conjuro termine, esa arma se convierte en un arma mágica con un bonificador de +1 a las tiradas de ataque y de daño. El conjuro termina antes si lo vuelves a lanzar. Con un espacio de conjuro de nivel superior. El bonificador aumenta a +2 si utilizas un espacio de niveles 3 a 5. El bonificador aumenta a +3 si utili- zas un espacio de nivel 6 o superior."}, {"n": "Armadura de mago", "lv": 1, "esc": "Abjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un trozo de piel curtida) Duración: 8 horas¶Tocas a una criatura voluntaria que no lleve arma- dura. Hasta que el conjuro termine, la CA base del objetivo pasa a ser de 13 más su modificador por Destreza. El conjuro termina antes si el objetivo se pone una armadura."}, {"n": "Asesino fantasmal", "lv": 4, "esc": "Ilusionismo", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Accedes a las pesadillas de una criatura a la que puedas ver dentro del alcance y creas una ilusión de sus miedos más profundos que solo ella puede ver. El objetivo hace una tirada de salvación de Sabiduría. Si la falla, sufrirá 4d10 de daño psíquico y tendrá desventaja en las pruebas de característica y en las tiradas de ataque hasta que termine el con- juro. Si la supera, sufrirá la mitad de ese daño y el conjuro terminará.¶Además, hasta que termine el conjuro, el objetivo hará una tirada de salvación de Sabiduría al final de cada uno de sus turnos. Si la falla, volverá a sufrir el daño psíquico. Si la supera, el conjuro terminará. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Aspectos animales", "lv": 8, "esc": "Transmutación", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: 24 horas¶Elige cualquier cantidad de criaturas voluntarias que puedas ver dentro del alcance. Todos los obje- tivos cambian de forma y adoptan la de una bestia Grande o más pequeña con un valor de desafío de 4 o menos. Puedes elegir una forma distinta para cada objetivo. En los siguientes turnos, puedes usar una acción de magia para transformar de nuevo a los objetivos. El perfil de un objetivo se sustituye por el de la bestia elegida, pero conserva su tipo de criatura, sus puntos de golpe, sus dados de puntos de golpe, su alineamiento, su capacidad para comunicarse y sus puntuaciones de Inteligencia, Sabiduría y Carisma. Las acciones del objetivo se ven limita- das por la anatomía de la forma de bestia y no puede lanzar conjuros. El equipo del objetivo se funde con su nueva forma y no podrá usarlo mientras esté en dicha forma. El objetivo obtiene una cantidad de puntos de golpe temporales igual a los puntos de golpe de la primera forma que adopte. Estos puntos de golpe temporales se desvanecerán si conserva alguno cuando el conjuro termine. La transformación dura hasta que el conjuro termine o hasta que el objetivo le ponga fin como acción adicional."}, {"n": "Atadura planar", "lv": 5, "esc": "Abjuración", "cl": ["bardo", "brujo", "clérigo", "druida", "mago"], "t": "mago)¶Tiempo de lanzamiento: 1 hora Alcance: 18 m Componentes: V, S, M (una joya que valga al menos 1000 po y que se consume como parte del conjuro) Duración: 24 horas¶Intentas obligar a un celestial, un elemental, un feérico o un infernal a servirte. La criatura debe estar dentro del alcance durante todo el tiempo de lanzamiento del conjuro (por lo general, primero se invoca a la criatura en el centro de un conjuro círculo mágico invertido para atraparla mientras se lanza el conjuro). Al finalizar el lanzamiento, el¶objetivo deberá superar una tirada de salvación de Carisma o se verá obligado a servirte hasta que termine el conjuro. Si la criatura se ha invocado o creado mediante otro conjuro, la duración de dicho conjuro se amplía hasta ser igual que la de este. Una criatura obligada deberá seguir tus órdenes lo mejor que pueda. Puedes ordenarle que te acom- pañe en una aventura, que proteja un lugar o que entregue un mensaje. Si la criatura es hostil, hará lo posible para retorcer el significado de tus órde- nes y así lograr sus propios objetivos. Si la criatura lleva a cabo tus órdenes en su totalidad antes de que termine el conjuro, viajará hasta ti para comu- nicártelo si estáis en el mismo plano de existencia. Si estás en un plano distinto, regresará al lugar en el que la ataste y permanecerá allí hasta que el con- juro termine. Con un espacio de conjuro de nivel superior. La duración aumenta con un espacio de nivel 6 (10 días), 7 (30 días), 8 (180 días) y 9 (366 días)."}, {"n": "Augurio", "lv": 2, "esc": "Adivinación", "cl": ["clérigo", "druida", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Lanzador Componentes: V, S, M (palitos, huesos, cartas u otros abalorios marcados de forma especial que valgan al menos 25 po) Duración: Instantáneo¶Obtienes un presagio de una entidad de otro mundo sobre los resultados de un curso de acción que planees llevar a cabo en los próximos 30 minutos. Tu GM elige el presagio de la siguiente tabla.¶Presagios Presagio¶Para los resultados que sean...¶Fortuna¶Buenos¶Desdicha¶Malos¶Fortuna y desdicha¶Buenos y malos¶Indiferencia¶Ni buenos ni malos¶El conjuro no tiene en cuenta las circunstancias que puedan alterar los resultados, como lanzar otros conjuros. Si lanzas el conjuro más de una vez antes de fina- lizar un descanso largo, hay una posibilidad acumu- lativa del 25 % por cada lanzamiento después del primero de que no recibas ninguna respuesta."}, {"n": "Aura de vida", "lv": 4, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V Duración: Concentración, hasta 10 minutos¶Un aura surge de ti en una emanación de 9 m hasta que el conjuro termine. Mientras permanezcáis dentro, tus aliados y tú tenéis resistencia al daño necrótico y no se podrán reducir vuestros puntos de golpe máximos. Si un aliado con 0 puntos de gol- pe comienza su turno en el aura, recupera 1 punto de golpe."}, {"n": "Aura mágica de arcanista", "lv": 2, "esc": "Ilusionismo", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un pequeño cuadrado de seda) Duración: 24 horas¶Con un toque, aplicas una ilusión a una criatura voluntaria o un objeto que no lleve ni vista nadie. Las criaturas obtienen el efecto de enmascarar y los objetos, el efecto de aura falsa, ambos descritos a continuación. El efecto durará hasta que termine el conjuro. Si lanzas el conjuro a diario sobre el mis- mo objetivo durante 30 días, la ilusión permanece hasta que sea disipada. Enmascarar (criaturas). Elige un tipo de criatura que no sea el auténtico del objetivo. Los conjuros y otros efectos mágicos tratan al objetivo como si fuese una criatura del tipo elegido. Aura falsa (objetos). Cambias la forma en la que el objetivo se revela ante conjuros y efectos mágicos que detectan las auras mágicas, como el de detectar magia. Puedes hacer que un objeto no mágico parez- ca mágico, que un objeto mágico parezca no mágico o cambiar el aura de un objeto para que parezca pertenecer a una escuela mágica de tu elección."}, {"n": "Aura sagrada", "lv": 8, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (un relicario que valga al menos 1000 po) Duración: Concentración, hasta 1 minuto¶Hasta que termine el conjuro, emites un aura en una emanación de 9 m. Mientras permanezcan dentro, las criaturas de tu elección tienen ventaja en todas las tiradas de salvación y otras criaturas tienen desventaja en las tiradas de ataque contra ellas. Además, cuando un infernal o un muerto viviente acierte a una criatura afectada con una tirada de ataque cuerpo a cuerpo, el atacante deberá superar una tirada de salvación de Constitución o tendrá el estado de cegado hasta el final de su siguiente turno."}, {"n": "Auxilio", "lv": 2, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida", "explorador", "paladín"], "t": "explorador, paladín) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una tira de tela blanca) Duración: 8 horas¶Elige hasta tres criaturas dentro del alcance. Los puntos de golpe máximos y actuales de cada ob- jetivo aumentan en 5 hasta que termine el conjuro. Con un espacio de conjuro de nivel superior. Los puntos de golpe de cada objetivo aumentan en 5 adicionales por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Baile irresistible", "lv": 6, "esc": "Encantamiento", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V Duración: Concentración, hasta 1 minuto¶Una criatura que puedas ver dentro del alcance debe hacer una tirada de salvación de Sabiduría. Si la supera, el objetivo bailará de forma cómica hasta el final de su siguiente turno y utilizará todo su movimiento para bailar en el sitio. Si la falla, tendrá el estado de hechizado hasta que termine el conjuro. Mientras esté hechizado, el obje- tivo bailará de forma cómica, empleará todo su mo- vimiento para bailar en el sitio y tendrá desventaja en las tiradas de ataque y de salvación de Destreza, y otras criaturas tendrán ventaja en las tiradas de ataque contra él. En cada uno de sus turnos, el obje- tivo puede usar una acción para recuperar el con- trol y repetir la tirada de salvación. Si la supera, el conjuro termina."}, {"n": "Barrera de cuchillas", "lv": 6, "esc": "Evocación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Creas un muro de cuchillas giratorias hechas de energía mágica, que aparecerá dentro del alcance y durará hasta que termine el conjuro. Creas un muro recto de hasta 30 m de longitud, 6 m de altura y 1,5 m de grosor o un muro circular de hasta 18 m de diámetro, 6 m de altura y 1,5 m de grosor. El muro proporciona cobertura tres cuartos y su espacio es terreno difícil. Cualquier criatura situada en el espacio del muro deberá hacer una tirada de salvación de Destreza; sufrirá 6d10 de daño de fuerza si la falla o la mitad del daño si la supera. Una criatura también deberá hacer la tirada si entra en el espacio del muro o ter-¶mina su turno en él. Cada criatura solo hace esta tirada una vez por turno."}, {"n": "Bendición", "lv": 1, "esc": "Encantamiento", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (un símbolo sagrado que valga al menos 5 po) Duración: Concentración, hasta 1 minuto¶Bendices hasta tres criaturas dentro del alcance. Siempre que un objetivo haga una tirada de ataque o de salvación antes de que termine el conjuro, sumará 1d4 al resultado de dicha tirada. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Boca mágica", "lv": 2, "esc": "Ilusionismo", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: 9 m Componentes: V, S, M (polvo de jade que valga al menos 10 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado¶Implantas un mensaje en un objeto dentro del alcance que se pronunciará en voz alta cuando se cumpla la condición de activación. Elige un objeto que puedas ver y que no lleve ni vista nadie. Luego, di el mensaje, que debe tener 25 palabras o menos, aunque puede transmitirse en un intervalo de hasta 10 minutos. Por último, determina la circunstancia que activará el conjuro para que transmita tu men- saje. Cuando se produzca esa circunstancia, en el objeto aparecerá una boca mágica que recitará el mensaje con tu voz y al mismo volumen en el que lo dijiste tú. Si el objeto elegido tiene boca o algo que se le parezca (por ejemplo, la boca de una estatua), la boca mágica se formará allí, de modo que las palabras parecerán salir de ella. Cuando lanzas este conjuro, puedes hacer que el efecto termine después de que transmita el mensaje o que permanezca y repita dicho mensaje siempre que se produzca la condición de activación. La condición puede ser tan genérica o detallada como quieras, aunque debe basarse en fenómenos visuales o audibles que se produzcan a 9 m o menos del objeto. Por ejemplo, podrías indicar que la boca hable cuando cualquier criatura se acerque a 9 m o menos del objeto o cuando una campana de plata suene a 9 m o menos de él."}, {"n": "Bola de fuego", "lv": 3, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (una pelota de guano de murciélago y azufre) Duración: Instantáneo¶Una ráfaga brillante surge de ti hacia un punto de tu elección dentro del alcance y luego estalla con un rugido sordo en una explosión ardiente. Todas las criaturas situadas en una esfera de 6 m de radio centrada en ese punto harán una tirada de salva- ción de Destreza; sufrirán 8d6 de daño de fuego si la fallan o la mitad del daño si la superan. Los objetos inflamables dentro del área que no lleve o vista nadie empezarán a arder. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Bola de fuego de explosión retardada", "lv": 7, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (una pelota de guano de murciélago y azufre) Duración: Concentración, hasta 1 minuto¶Un rayo de luz amarilla surge de ti y se condensa en un punto elegido dentro del alcance en forma de una cuenta brillante hasta que termine el conjuro. Cuando el conjuro termina, la cuenta explota y todas las criaturas en una esfera de 6 m de radio centrada en ese punto hacen una tirada de salvación de Destreza. Sufrirán una cantidad de daño de fuego igual al daño total acumulado si fallan la tirada o la mitad del daño si la superan. El daño base del conjuro es 12d6 y aumenta en 1d6 siempre que termine tu turno si el conjuro aún no ha terminado. Si una criatura toca la cuenta brillante antes de que el conjuro termine, esa criatura hará una tirada de salvación de Destreza. Si la falla, el conjuro terminará y la cuenta explotará. Si la supera, podrá lanzar la cuenta a una distancia de 12 m o menos. Si la cuenta lanzada entra en el espacio de una cria- tura o choca con un objeto sólido, el conjuro termina y la cuenta explota. Cuando estalle, todos los objetos inflamables dentro de la explosión que no lleve o vista nadie empezarán a arder. Con un espacio de conjuro de nivel superior. El daño base aumenta en 1d6 por cada nivel por encima de 7 que tenga el espacio."}, {"n": "Buenas bayas", "lv": 1, "esc": "Conjuración", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una rama de muérdago) Duración: 24 horas¶En tu mano aparecen diez bayas, que estarán impregnadas de magia hasta que termine el con- juro. Una criatura puede usar una acción adicional para comerse una, lo que le permite recuperar 1 punto de golpe. Además, la baya proporciona ali- mento suficiente como para mantener a una criatu- ra durante 1 día. Las bayas que no se consuman desaparecerán cuando el conjuro termine."}, {"n": "Burla dañina", "lv": 0, "esc": "encantamiento", "cl": ["bardo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Profieres una sarta de improperios mezclados con encantamientos sutiles hacia una criatura que puedas ver u oír dentro del alcance. El objetivo deberá superar una tirada de salvación de Sabiduría o recibirá 1d6 de daño psíquico y tendrá desventaja en la próxima tirada de ataque que realice antes de que acabe su siguiente turno. Mejora de truco. El daño aumenta en 1d6 cuando alcanzas los niveles 5 (2d6), 11 (3d6) y 17 (4d6)."}, {"n": "Caída de pluma", "lv": 1, "esc": "Transmutación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Reacción, que llevas a cabo cuando tú o una criatura que puedas ver a 18 m o menos de ti caigáis Alcance: 18 m Componentes: V, M (una pluma pequeña o un poco de plumón) Duración: 1 minuto¶Elige hasta cinco criaturas dentro del alcance que estén cayendo. La velocidad de descenso de cada objetivo se reduce a 18 m por asalto hasta que el conjuro termine. Si una criatura aterriza antes de que el conjuro termine, no sufrirá daño de la caída y el conjuro terminará para esa criatura."}, {"n": "Calentar metal", "lv": 2, "esc": "Transmutación", "cl": ["bardo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un trozo de hierro y una llama) Duración: Concentración, hasta 1 minuto¶Elige un objeto metálico fabricado que puedas ver dentro del alcance, como un arma de metal o una armadura metálica media o pesada. Haces que el objeto se ponga al rojo vivo. Cualquier criatura que esté en contacto físico con el objeto recibirá 2d8 de daño de fuego cuando lances el conjuro. Hasta que el conjuro termine, puedes usar una acción adi- cional en cada uno de tus turnos posteriores para volver a causar este daño si el objeto está dentro del alcance. Si una criatura sostiene o lleva puesto el objeto y recibe el daño de este, deberá superar una tirada de salvación de Constitución o dejará caer el objeto si puede. Si no lo deja caer, tendrá desventaja en las tiradas de ataque y las pruebas de característica hasta el principio de tu siguiente turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Calmar emociones", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Cada humanoide en una esfera de 6 m de radio centrada en un punto que elijas dentro del alcance deberá superar una tirada de salvación de Carisma o se verá afectado por uno de los siguientes efectos (elige uno por cada criatura):¶• La criatura tiene inmunidad a los estados de asustada y hechizada hasta que el conjuro termi- ne. Si la criatura ya estaba asustada o hechizada, se suprimen esos estados hasta que el conjuro termine. • La criatura se vuelve indiferente hacia las cria- turas de tu elección hacia las que sea hostil. Esta indiferencia termina si el objetivo recibe daño o si observa cómo alguno de sus aliados resulta dañado. Cuando el conjuro termine, la actitud de la criatura volverá a la normalidad."}, {"n": "Cambiar de forma", "lv": 9, "esc": "Transmutación", "cl": ["druida", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una diadema de jade que valga al menos 1500 po) Duración: Concentración, hasta 1 hora¶Asumes la forma de otra criatura hasta que t ermine el conjuro o hasta que uses una acción de magia para adoptar otra forma para la que cumplas los requisitos. La nueva forma debe ser la de una cria- tura con un valor de desafío igual o menor a tu nivel o valor de desafío. Tienes que haber visto alguna¶criatura de ese tipo y no puede ser un autómata ni un muerto viviente. Cuando lanzas el conjuro, obtienes una cantidad de puntos de golpe temporales igual a los puntos de golpe de la primera forma que adoptes. Estos puntos de golpe temporales se desvanecerán si conservas alguno cuando el conjuro termine. Tu perfil se sustituye por el de la forma elegida, pero conservarás tu tipo de criatura, alineamiento, personalidad, puntuaciones de Inteligencia, Sabidu- ría y Carisma, puntos de golpe, dados de puntos de golpe, competencias y capacidad para comunicarte. También conservas el rasgo Lanzamiento de conju- ros si lo tienes. Al cambiar de forma, eliges si tu equipo cae al suelo o cambia de tamaño y forma para adaptarse a tu nuevo aspecto mientras lo adoptes."}, {"n": "Caminar sobre el agua", "lv": 3, "esc": "Transmutación", "cl": ["clérigo", "druida", "explorador", "hechicero"], "t": "hechicero) Tiempo de lanzamiento: Acción o ritual Alcance: 9 m Componentes: V, S, M (un trozo de corcho) Duración: 1 hora¶Este conjuro concede la capacidad de moverse por encima de cualquier superficie líquida, como agua, ácido, barro, nieve, arenas movedizas o lava, como si se tratara de un suelo sólido inofensivo (aunque las criaturas que crucen lava derretida pueden seguir sufriendo daño por el calor). Hasta diez criaturas voluntarias que elijas dentro del alcance obtienen esta capacidad hasta que termine el conjuro. Los objetivos afectados deben emplear una acción adicional para pasar de la superficie del líquido al propio líquido y viceversa, pero si caen en él, pasarán a través de la superficie al líquido que hay debajo."}, {"n": "Campo antimagia", "lv": 8, "esc": "Abjuración", "cl": ["clérigo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (virutas de hierro) Duración: Concentración, hasta 1 hora¶Un aura de antimagia te envuelve en una emanación de 3 m. Dentro de ella nadie puede lanzar conjuros, emplear acciones de magia o crear otros efectos mágicos, y estos efectos no pueden hacer objetivo o afectar a nada de su interior. Las propiedades mágicas de los objetos mágicos no funcionan dentro del aura ni afectan a nada que esté en su interior. Las áreas de efecto que crean los conjuros u otro tipo de magia no pueden penetrar en el aura y nadie puede teletransportarse ni usar el viaje interplanar¶para entrar o salir de ella. Los portales se cierran de forma temporal mientras estén dentro del aura. Los conjuros activos se suprimen en la zona, salvo los que lancen un artefacto o deidad. Mientras un efecto está suprimido, no funciona, pero el tiempo que pasa suprimido cuenta para su duración. Disipar magia no tiene efecto en el aura, y las auras que creadas por distintos conjuros campo antimagia no se anulan entre sí."}, {"n": "Caparazón antivida", "lv": 5, "esc": "Abjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 1 hora¶Un aura se extiende alrededor de ti en una emana- ción de 3 m hasta que el conjuro termine. El aura impide que las criaturas que no sean autómatas o muertos vivientes penetren total o parcialmente en ella, pero sí que pueden lanzar conjuros o reali- zar ataques con armas a distancia o de gran alcance a través de la barrera. Si tu movimiento obliga a que una criatura afectada atraviese la barrera, el conjuro termina."}, {"n": "Castigo abrasador", "lv": 1, "esc": "Evocación", "cl": ["paladín"], "t": "Tiempo de lanzamiento: Acción adicional, que realizas de inmediato tras acertar a un objetivo con un arma cuerpo a cuerpo o un ataque sin armas Alcance: Lanzador Componentes: V Duración: 1 minuto¶Al golpear al objetivo, sufre 1d6 de daño de fuego adicional del ataque. Al principio de cada uno de sus turnos hasta que el conjuro termine, el objetivo sufrirá 1d6 de daño de fuego y luego hará una tirada de salvación de Constitución. Si la falla, el conjuro seguirá activo. Si la supera, el conjuro terminará. Con un espacio de conjuro de nivel superior. Todo el daño aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Castigo brillante", "lv": 2, "esc": "Transmutación", "cl": ["paladín"], "t": "Tiempo de lanzamiento: Acción adicional, que realizas de inmediato tras acertar a una criatura con un arma cuerpo a cuerpo o un ataque sin armas Alcance: Lanzador Componentes: V Duración: Concentración, hasta 1 minuto¶El objetivo del golpe recibe 2d6 de daño radiante adicional del ataque. Hasta que el conjuro termine, el objetivo emitirá luz brillante en un radio de 1,5 m,¶las tiradas de ataque contra él tendrán ventaja y no podrá beneficiarse del estado de invisible. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Círculo de muerte", "lv": 6, "esc": "Nigromancia", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (una perla negra pulverizada que valga al menos 500 po) Duración: Instantáneo¶Una energía negativa se propaga en un radio de 18 m desde un punto que elijas dentro del alcance. Todas las criaturas situadas en la zona realizan una tirada de salvación de Constitución; sufrirán 8d8 de daño necrótico si la fallan o la mitad del daño si la superan. Con un espacio de conjuro de nivel superior. El daño aumenta en 2d8 por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Círculo de teletransportación", "lv": 5, "esc": "Conjuración", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 3 m Componentes: V, M (tintas inusuales que valgan al menos 50 po, que se consumen como parte del conjuro) Duración: 1 asalto¶Mientras lanzas el conjuro, trazas en el suelo un cír- culo de 1,5 m de radio en el cual inscribes sellos que vinculan tu ubicación con un círculo de teletrans- portación permanente de tu elección cuya secuencia de sellos conozcas y que esté en el mismo plano de existencia que tú. En el círculo dibujado aparecerá un portal brillante que permanecerá abierto hasta el final de tu siguiente turno. Cualquier criatura que entre en el portal aparecerá instantáneamente a 1,5 m o menos del círculo de destino o en el espa- cio sin ocupar más cercano si ese está ocupado. Muchos grandes templos y casas gremiales, así como otros lugares importantes, cuentan con cír- culos de teletransportación permanentes. Cada uno incluye una secuencia de sellos única, una serie de runas dispuestas con un patrón concreto. La primera vez que obtienes la capacidad de lan- zar este conjuro, aprendes las secuencias de sellos de dos destinos en el Plano Material a elección de tu GM. Durante tus aventuras, es posible que apren- das más secuencias de sellos. Puedes memorizar una nueva secuencia de sellos si la estudias durante 1 minuto. Si lanzas este conjuro a diario en el mismo lugar durante 365 días, puedes crear un círculo de tele- transportación permanente."}, {"n": "Círculo mágico", "lv": 3, "esc": "Abjuración", "cl": ["brujo", "clérigo", "mago", "paladín"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 3 m Componentes: V, S, M (sal y plata en polvo que valga al menos 100 po, que se consumen como parte del conjuro) Duración: 1 hora¶Creas un cilindro de energía mágica de 3 m de radio y 6 m de altura centrado en un punto del suelo que puedas ver dentro del alcance. En los puntos de intersección entre el cilindro y el suelo o cualquier otra superficie aparecerán unas runas brillantes. Elige uno o más de los siguientes tipos de cria- turas: celestiales, elementales, feéricos, infernales o muertos vivientes. El círculo afecta a una criatura del tipo elegido de las siguientes formas: • La criatura no puede entrar voluntariamente en el cilindro por medios no mágicos. Si la criatura intenta usar el teletransporte o el viaje interpla-¶nar para hacerlo, antes deberá superar una tirada de salvación de Carisma. • La criatura tiene desventaja en las tiradas de ataque contra objetivos que estén dentro del cilindro. • Los objetivos dentro del cilindro no pueden ser poseídos por la criatura ni obtener los estados de asustados o hechizados a causa de ella. Cada vez que lances este conjuro, puedes hacer que su magia funcione en sentido inverso para impedir que una criatura del tipo especificado salga del cilindro y proteger así a los objetivos que estén fuera de él. Con un espacio de conjuro de nivel superior. La duración aumenta en 1 hora por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Clarividencia", "lv": 3, "esc": "Adivinación", "cl": ["bardo", "clérigo", "hechicero", "mago"], "t": "mago)¶Tiempo de lanzamiento: 10 minutos Alcance: 1,5 km Componentes: V, S, M (un canalizador que valga al menos 100 po; puede ser una trompetilla enjoyada o un ojo de cristal) Duración: Concentración, hasta 10 minutos¶Creas un sensor invisible dentro del alcance en un lugar que conozcas (que hayas visitado o visto antes) o en un lugar obvio, aunque no lo conozcas (por ejemplo, tras una puerta, al girar una esquina o en una arboleda). Este sensor intangible e invulne- rable permanecerá allí hasta que el conjuro termine. Cuando lances el conjuro, elige la vista o el oído. Podrás usar el sentido elegido como si estuvieras en el espacio del sensor. Como acción adicional, puedes cambiar entre la vista y el oído. Cualquier criatura que pueda percibir el sensor (por ejemplo, que se esté beneficiando del conjuro ver invisibilidad o que tenga visión verdadera) verá un orbe luminoso del tamaño aproximado de tu puño."}, {"n": "Clavo mental", "lv": 2, "esc": "Adivinación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: S Duración: Concentración, hasta 1 hora¶Introduces una púa de energía psiónica en la mente de una criatura que puedas ver dentro del alcance. El objetivo hace una tirada de salvación de Sabidu- ría; sufrirá 3d8 de daño psíquico si la falla o la mi- tad del daño si la supera. Además, si falla la tirada, conocerás en todo momento la ubicación del objeti- vo hasta que el conjuro termine, pero solo mientras los dos estéis en el mismo plano de existencia. Mien-¶tras tengas este conocimiento, la criatura no podrá ocultarse de ti y, si tiene el estado de invisible, no se beneficiará de dicho estado contra ti. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Clon", "lv": 8, "esc": "Nigromancia", "cl": ["mago"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (un diamante que valga al menos 1000 po, que se consume como parte del conjuro, y un recipiente sellable que valga al menos 2000 po y sea lo bastante grande como para alojar a la criatura que se clone) Duración: Instantáneo¶Tocas a una criatura o al menos un cubo de su carne de 2,5 cm. Dentro del recipiente e mpleado para lanzar el conjuro se crea un duplicado inerte de la criatura que alcanza la madurez en 120 días; tú decides si el clon terminado tiene la misma edad que la criatura o si es más joven. El clon permanecerá inerte y durará indefinidamente, siempre que su recipiente se mantenga intacto. Si la criatura original muere después de que el clon haya madurado, su alma se transferirá al clon si el alma es libre y desea regresar. El clon es física- mente idéntico al original, al igual que su personali- dad, sus recuerdos y sus capacidades, pero no posee nada de su equipo original. Los restos mortales de la criatura original, si existen, se volverán inertes y no podrán ser devueltos a la vida, ya que el alma de la criatura está en otra parte."}, {"n": "Cofre oculto", "lv": 4, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un cofre con unas dimensiones de 90 cm por 60 cm por 60 cm, construido de materiales raros que valgan al menos 5000 po, así como una réplica Diminuta hecha de los mismos materiales y que valga al menos 50 po) Duración: Hasta que sea disipado¶Ocultas un cofre y todo su contenido en el Plano Eté- reo. Debes tocar el cofre y la réplica en miniatura que sirve como componente material del conjuro. El cofre puede contener hasta 0,34 m3 de material inerte (90 cm por 60 cm por 60 cm). Mientras el cofre permanezca en el Plano Etéreo, puedes usar una acción de magia y tocar la réplica para recuperar dicho cofre, que aparecerá en un espacio sin ocupar en el suelo a 1,5 m de ti. Puedes enviar el cofre de regreso al Plano Etéreo usando una acción de magia para tocar el cofre y la réplica.¶Después de 60 días, hay una posibilidad acumu- lativa del 5 % al final de cada día de que el efecto del conjuro termine. El conjuro también termina si vuelves a lanzarlo o si se destruye la réplica Dimi- nuta del cofre. Si el conjuro termina y el cofre gran- de está en el Plano Etéreo, permanecerá allí hasta que otra persona o tú lo encontréis."}, {"n": "Compulsión", "lv": 4, "esc": "Encantamiento", "cl": ["bardo"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Todas las criaturas de tu elección que puedas ver dentro del alcance deberán superar una tirada de salvación de Sabiduría o tendrán el estado de hechi- zadas hasta que el conjuro termine. Mientras dure, puedes usar una acción adicional para designar una dirección horizontal respecto a ti. Cada criatura hechizada deberá usar todo el movimiento que pueda para avanzar en esa direc- ción por la ruta más segura durante su próximo t urno. Tras moverse de este modo, un objetivo repite la tirada de salvación y, si tiene éxito, se librará del conjuro."}, {"n": "Comunión", "lv": 5, "esc": "Adivinación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Lanzador Componentes: V, S, M (incienso) Duración: 1 minuto¶Te pones en contacto con una deidad o con un repre- sentante divino y le haces hasta tres preguntas que se puedan responder con sí o no. Tienes que realizar las preguntas antes de que el conjuro termine y recibirás una respuesta correcta a cada una de ellas. Los seres divinos no tienen por qué ser omnis- cientes, por lo que si la deidad no tiene i nformación sobre lo que le preguntas, puede responderte “ambiguo”. En caso de que una respuesta de una sola palabra pudiera inducir a error o ser contraria a los intereses de la deidad, tu GM podría ofrecer en su lugar una frase corta. Si lanzas el conjuro más de una vez antes de fina- lizar un descanso largo, hay una posibilidad acumu- lativa del 25 % por cada lanzamiento después del primero de que no recibas ninguna respuesta."}, {"n": "Comunión con la naturaleza", "lv": 5, "esc": "Adivinación", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Lanzador Componentes: V, S Duración: Instantáneo¶Comulgas con espíritus de la naturaleza y obtienes información sobre la zona circundante. En exte- riores, el conjuro te proporciona información de la zona a 4,5 km a tu alrededor. En cavernas y otros entornos naturales subterráneos, el radio se ve limitado a 90 m. El conjuro no funciona en lugares en los que la naturaleza ha sido sustituida por cons- trucciones, como castillos y asentamientos. Elige tres de los siguientes hechos, que aprende- rás según corresponda a la zona del conjuro: • Ubicaciones de asentamientos. • Ubicaciones de portales a otros planos de exis- tencia. • La ubicación de una criatura con un valor de desafío de 10 o más (a elección de tu GM) que sea celestial, elemental, feérico, infernal o muerto viviente. • El tipo de planta, mineral o bestia más frecuente (tú decides cuál). • Ubicaciones de masas de agua.¶Por ejemplo, podrías determinar el paradero de un monstruo poderoso en la zona y la ubicación de ma- sas de agua y de cualquier pueblo cercano."}, {"n": "Confusión", "lv": 4, "esc": "Encantamiento", "cl": ["bardo", "druida", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (tres cáscaras de nuez) Duración: Concentración, hasta 1 minuto¶Todas las criaturas situadas en una esfera de 3 m de radio centrada en un punto que elijas dentro del alcance deberán superar una tirada de salvación de Sabiduría o no podrán usar acciones adicionales ni reacciones y deberán tirar 1d10 al principio de cada uno de sus turnos para determinar su compor- tamiento ese turno. Para ello, consulta la tabla que se muestra a continuación. 1d10 Comportamiento del turno¶El objetivo no usa ninguna acción y emplea todo su movimiento para desplazarse. Para determinar la dirección, tira 1d4: con un 1, se moverá al norte; con un 2, al este; con un 3, al sur; con un 4, al oeste.¶2–6¶El objetivo no se mueve ni realiza acciones.¶7–8¶El objetivo no se mueve y emplea la acción de atacar para hacer un ataque cuerpo a cuerpo contra una criatura aleatoria dentro de su alcance. Si no hay ninguna dentro de su alcance, el objetivo no hace ninguna acción.¶9–10 El objetivo elige su comportamiento.¶Al final de cada uno de sus turnos, un objetivo afectado repite la tirada de salvación y, si tiene éxito, se librará del conjuro. Con un espacio de conjuro de nivel superior. El radio de la esfera aumenta en 1,5 m por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Conjurar animales", "lv": 3, "esc": "Conjuración", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Conjuras espíritus de la naturaleza que aparecen como una manada Grande de animales espectrales e intangibles en un espacio sin ocupar que puedas ver dentro del alcance. La manada permanecerá hasta que el conjuro termine y puedes elegir la for- ma animal de los espíritus, como lobos, serpientes o aves. Tienes ventaja en las tiradas de salvación de Fuerza mientras estés a 1,5 m o menos de la manada. Además, cuando te muevas en tu turno, también podrás mover a la manada hasta 9 m a un espacio sin ocupar que puedas ver. Siempre que la manada se mueva a 3 m o menos de una criatura que puedas ver y siempre que una criatura que puedas ver entre en un espacio a 3 m o menos de la manada o termine su turno allí, puedes obligar a la criatura a hacer una tirada de salvación de Destreza. Si la falla, recibirá 3d10 de daño cortante. Una criatura solo hace esta tirada una vez por turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Conjurar celestial", "lv": 7, "esc": "Conjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Conjuras un espíritu de los Planos Superiores, que se manifiesta como un pilar de luz de 3 m de radio y 12 m de alto centrado en un punto dentro del alcance. Por cada criatura que puedas ver en el cilin- dro, elige qué tipo de luz brilla sobre ella: Luz abrasadora. El objetivo hace una tirada de sal- vación de Destreza; sufrirá 6d12 de daño radiante si la falla o la mitad del daño si la supera. Luz sanadora. El objetivo recupera una cantidad de puntos de golpe igual a 4d12 más tu modificador por aptitud mágica.¶Hasta que el conjuro termine, una luz brillante llena el cilindro y, cuando te muevas en tu turno, también puedes mover el cilindro hasta 9 m. Siempre que el cilindro entre en el espacio de una criatura que puedas ver y siempre que una criatura que puedas ver entre en el cilindro o termine su tur- no en él, puedes bañar a la criatura con una de las luces. Una criatura puede verse afectada por este conjuro solo una vez por turno. Con un espacio de conjuro de nivel superior. El daño y la curación aumentan en 1d12 por cada nivel por encima de 7 que tenga el espacio."}, {"n": "Conjurar elemental", "lv": 5, "esc": "Conjuración", "cl": ["druida", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Invocas un espíritu Grande e intangible de los Planos Elementales, que aparece en un espacio sin ocupar dentro del alcance. Elige el elemento del espíritu, que determina su tipo de daño: agua (frío), aire (relámpago), fuego (fuego) o tierra (trueno). El espíritu permanece hasta que el conjuro termine. Siempre que una criatura que puedas ver entre en el espacio del espíritu o empiece su turno a 1,5 m o menos de él, puedes obligarla a hacer una tirada de salvación de Destreza si el espíritu no tiene nin- guna criatura apresada. Si la falla, el objetivo sufrirá 8d8 de daño del tipo del espíritu y tendrá el estado de apresado hasta que el conjuro termine. Al princi- pio de cada uno de sus turnos, el objetivo apresado repite la tirada de salvación. Si la falla, sufrirá 4d8 de daño del tipo del espíritu. Si la supera, dejará de estar apresado por él. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Conjurar elementales menores", "lv": 4, "esc": "Conjuración", "cl": ["druida", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 10 minutos¶Conjuras espíritus de los Planos Elementales que revolotean a tu alrededor en una emanación de 4,5 m mientras dure el conjuro. Hasta que el conjuro termine, cualquier ataque que hagas causará 2d8 de daño adicional cuando aciertes a una criatura dentro de la emanación. Ese daño será de ácido, frío, fuego o relámpago (a tu elección cuando ataques). Además, el suelo incluido en la emanación se con- siderará terreno difícil para tus enemigos.¶Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Conjurar feérico", "lv": 6, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Conjuras un espíritu Mediano de los Parajes Feéri- cos en un espacio sin ocupar que puedas ver dentro del alcance. El espíritu dura hasta que termine el conjuro y toma la forma de una criatura feérica de tu elección. Cuando aparezca, puedes hacer un ata- que de conjuro cuerpo a cuerpo contra una criatura a 1,5 m o menos de él. Si acierta, el objetivo sufrirá una cantidad de daño psíquico igual a 3d12 más tu modificador por aptitud mágica y tendrá el estado de asustado hasta el principio de tu siguiente turno, y tanto el espíritu como tú seréis el origen de su miedo. Como acción adicional en tus siguientes turnos, puedes teletransportar el espíritu a un espacio sin ocupar que puedas ver a 9 m o menos del espacio que ocupaba antes y hacer el ataque contra una criatura a 1,5 m o menos de él. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d12 por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Conjurar seres del bosque", "lv": 4, "esc": "Conjuración", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 10 minutos¶Conjuras espíritus de la naturaleza que revolotean a tu alrededor en una emanación de 3 m hasta que el conjuro termine. Siempre que la emanación entre en el espacio de una criatura que puedas ver y siempre que una criatura que puedas ver entre en la emanación o termine su turno allí, puedes obligar a la criatura a hacer una tirada de salvación de Sabiduría. Sufrirá 5d8 de daño de fuerza si la falla o la mitad del daño si la supera. Una criatura solo hace esta tirada una vez por turno. Además, hasta que termine el conjuro, puedes llevar a cabo la acción de destrabarse como acción adicional. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Cono de frío", "lv": 5, "esc": "Evocación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (un cono pequeño de cristal o vidrio) Duración: Instantáneo¶Emites una ráfaga de aire helado. Todas las criatu- ras situadas en un cono de 18 m que se origina en ti hacen una tirada de salvación de Constitución; sufrirán 8d8 de daño de frío si la fallan o la mitad de daño si la superan. Si una criatura muere a causa de este conjuro, se convertirá en una estatua conge- lada hasta que se descongele. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Conocer las leyendas", "lv": 5, "esc": "Adivinación", "cl": ["bardo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: Lanzador Componentes: V, S, M (incienso que valga al menos 250 po, que se consume como parte del conjuro, y cuatro tiras de marfil que valgan al menos 50 po) Duración: Instantáneo¶Nombra o describe a una persona, un lugar o un ob- jeto famosos. El conjuro traerá a tu mente un breve resumen de la información relevante sobre lo nom- brado, que describe tu GM. Esta información pueden ser detalles importan- tes, revelaciones simpáticas o incluso conocimiento secreto que no es de dominio público. Cuanta más información tengas ya sobre esa cosa, más precisa y detallada será la que consigas. La información será cierta, pero puede estar disimulada bajo un lenguaje metafórico o poético, a discreción de tu GM. Si lo que has nombrado no es famoso, en su lugar escucharás una musiquilla triste tocada con un trombón y el conjuro fallará."}, {"n": "Consagrar", "lv": 5, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: 24 horas Alcance: Toque Componentes: V, S, M (incienso que valga al menos 1000 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado¶Tocas un punto e impregnas una zona a su alrede- dor con poder sagrado o impío. El área puede tener un radio de hasta 18 m y el conjuro falla si el radio incluye cualquier zona que ya esté bajo el efecto de consagrar. La zona afectada tiene los siguientes efectos.¶Protección sagrada. Elige cualquiera de los siguientes tipos de criatura: aberración, celestial, elemental, feérico, infernal o muerto viviente. Las criaturas de los tipos elegidos no podrán entrar en la zona voluntariamente, y cualquier criatura poseída o con los estados de asustada o hechizada a causa de ellas dejarán de estarlo mientras perma- nezcan en la zona. Efecto adicional. Vinculas un efecto adicional de la siguiente lista:¶Coraje. Las criaturas de cualesquiera tipos que elijas no podrán obtener el estado de asustadas dentro de la zona. Descanso plácido. Los cadáveres enterrados en la zona no se pueden convertir en muertos vivientes. Don de lenguas. Las criaturas de c ualesquiera t ipos que elijas se pueden comunicar con cualquier otra criatura en la zona, aunque no compartan ningún idioma común. Intromisión extradimensional. Las criaturas de cualesquiera tipos que elijas no pueden entrar en la zona ni salir de ella usando el teletransporte o el viaje interplanar. Luz del día. La zona se llena de luz brillante. La oscuridad mágica creada por conjuros de niveles menores que el de este conjuro no puede extinguir la luz. Oscuridad. La zona se llena de oscuridad. La luz normal y la luz mágica creada por conjuros de niveles menores que el de este conjuro no pueden iluminar la zona. Resistencia. Las criaturas de cualesquiera tipos que elijas tienen resistencia a un tipo de daño de tu elección dentro de la zona. Silencio. Ningún sonido puede salir de la zona ni penetrar en ella. Terror. Las criaturas de cualesquiera tipos que elijas tienen el estado de asustadas dentro de la zona. Vulnerabilidad. Las criaturas de cualesquiera tipos que elijas tienen vulnerabilidad a un tipo de daño de tu elección dentro de la zona."}, {"n": "Contactar con otro plano", "lv": 5, "esc": "Adivinación", "cl": ["brujo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Lanzador Componentes: V Duración: 1 minuto¶Contactas mentalmente con un semidiós, el espíritu de un erudito muerto hace tiempo o cualquier otra entidad ilustrada de otro plano. Contactar con esta inteligencia sobrenatural puede hacer añicos tu mente. Cuando lances este conjuro, haz una tirada de salvación de Inteligencia con CD 15. Si superas la tirada, puedes hacerle a la entidad hasta cin-¶co preguntas, que debes realizar antes de que el conjuro termine. Tu GM responderá a cada pregun- ta con una sola palabra, como “sí”, “no”, “puede”, “nunca”, “irrelevante” o “ambiguo” (si la entidad no conoce la respuesta a la pregunta). Si una respuesta de una sola palabra pudiera inducir a error, tu GM podría ofrecer en su lugar una frase corta. Si fallas la tirada, sufrirás 6d6 de daño p  síquico y tendrás el estado de incapacitado hasta que fina- lices un descanso largo. Si te lanzan un conjuro restablecimiento mayor, el efecto acabará."}, {"n": "Contagio", "lv": 5, "esc": "Nigroma
