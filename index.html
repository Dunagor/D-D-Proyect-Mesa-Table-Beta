ncia", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: 7 días¶Tu toque causa un contagio mágico. El objetivo debe superar una tirada de salvación de Constitución o sufrirá 11d8 de daño necrótico y tendrá el estado de envenenado. Además, elige una característica cuando lances el conjuro. Mientras esté envenenado, el objetivo tendrá desventaja en las tiradas de salva- ción que haga con la característica elegida. El objetivo deberá repetir la tirada de salvación al final de cada uno de sus turnos hasta que la supere o la falle tres veces. Si supera tres de estas tiradas, el conjuro terminará para el objetivo, pero si falla tres tiradas, el conjuro le durará 7 días. Cuando el objetivo envenenado reciba un efecto que fuera a poner fin al estado de envenenado, deberá superar una tirada de salvación de Constitu- ción o el estado de envenenado no terminará."}, {"n": "Contingencia", "lv": 6, "esc": "Abjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: Lanzador Componentes: V, S, M (una estatuilla de ti tallada y decorada con gemas que valga al menos 1500 po) Duración: 10 días¶Elige un conjuro de nivel 5 o inferior que puedas lanzar, que tenga un tiempo de lanzamiento de una acción y que te permita elegirte como objetivo. Lanzas el conjuro (llamado “conjuro c ontingente”) como parte del lanzamiento de contingencia y gastas los espacios de conjuro de ambos, pero el conjuro contingente no tiene efecto en ese momento, sino que se activa cuando se produce una condición determinada. Describes esa condi- ción cuando lanzas los dos conjuros. Por ejemplo, si lanzas contingencia junto a respirar bajo el agua, podrías decir que respirar bajo el agua tenga efecto cuando te sumerjas en agua o en un líquido similar. El conjuro contingente tiene efecto inmediata- mente después de que se produzca la condición por¶primera vez, tanto si quieres como si no, y después termina el conjuro contingencia. El conjuro contingente solo tiene efecto sobre ti, aunque normalmente pudieras elegir como objetivo a otros. Solo puedes tener un conjuro c ontingencia activo al mismo tiempo. Si vuelves a lanzarlo, terminará el efecto de cualquier otro conjuro contingencia que tengas. Asimismo, contingencia termina si dejas de tener contigo su componente material."}, {"n": "Contorno borroso", "lv": 2, "esc": "Ilusionismo", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V Duración: Concentración, hasta 1 minuto¶Tu cuerpo se vuelve borroso. Hasta que termine el conjuro, todas las criaturas tendrán desventaja en las tiradas de ataque contra ti. Un atacante es inmune a este efecto si te percibe mediante visión ciega o visión verdadera."}, {"n": "Contrahechizo", "lv": 3, "esc": "Abjuración", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Reacción, que llevas a cabo cuando una criatura que puedas ver a 18 m o menos de ti lance un conjuro usando componentes verbales, somáticos o materiales Alcance: 18 m Componentes: S Duración: Instantáneo¶Intentas interrumpir a una criatura que esté lan- zando un conjuro. La criatura hace una tirada de salvación de Constitución. Si la falla, el conjuro se disipa sin causar efecto alguno y la acción, acción adicional o reacción empleada para lanzarlo se des- perdiciará. Si ese conjuro se lanzó con un espacio de conjuro, dicho espacio no se gastará."}, {"n": "Controlar agua", "lv": 4, "esc": "Transmutación", "cl": ["clérigo", "druida", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 90 m Componentes: V, S, M (una mezcla de agua y polvo) Duración: Concentración, hasta 10 minutos¶Hasta que el conjuro termine, controlas cualquier masa de agua que esté en un área de tu elección y con forma de cubo de hasta 30 m de lado, y usas uno de los siguientes efectos. Como acción de magia en tus siguientes turnos, puedes repetir el mismo efecto o elegir uno distinto. Abrir las aguas. Haces que las aguas de la zona se separen y creen un canal, que se extiende a lo largo de toda el área del conjuro, con las aguas separadas formando un muro a ambos lados. El canal se man- tendrá hasta que el conjuro termine o hasta que¶elijas un efecto distinto. Posteriormente, el agua irá llenando el canal lentamente durante el siguiente asalto hasta recuperar su nivel normal. El nivel del agua permanecerá elevado hasta que el conjuro termine o hasta que elijas un efecto distinto. Si este efecto ha producido una ola, esta se repetirá al principio de tu siguiente turno mientras dure el efecto de la inundación. Inundación. Haces que el nivel del agua estancada de la zona aumente hasta 6 m. Si eliges una zona en una masa de agua grande, en vez de eso, creas una ola de 6 m de altura que se desplaza de un lado de esa zona a la otra y luego rompe. Cualquier vehículo Enorme o más pequeño que esté en el recorrido de la ola será transportado hasta el otro lado y t ambién tendrá un 25 % de probabilidades de volcar. Redirigir caudal. Haces que un caudal de agua en la zona se mueva en la dirección que elijas, incluso si tiene que fluir por encima de obstáculos, subir muros o tomar otros rumbos extraños. El agua de la zona se moverá según tus instrucciones, pero una vez salga del área del conjuro, volverá a fluir de forma normal en función del terreno. El agua seguirá moviéndose en la dirección que hayas elegido hasta que el conjuro termine o hasta que elijas un efecto distinto. Remolino. Provocas que se forme un remolino en el centro del área, que debe ser un cuadrado de al menos 15 m de lado y 7,5 m de profundidad. El remolino permanece hasta que elijas un efecto distinto o termine el conjuro. El remolino tiene 1,5 m de ancho en su base y hasta 15 m en la parte superior, con una altura de 7,5 m. Cualquier criatura que esté en el agua a 7,5 m o menos del remolino será atraída 3 m hacia él. Cuando una criatura entre en el remolino por primera vez en un turno o termine su turno allí, hará una tirada de salvación de Fuerza. Si la falla, la criatura recibirá 2d8 de daño contundente. Si la supera, recibirá la mitad de daño. Una criatura solo puede alejarse nadando del remolino si usa primero una acción para apartarse y supera una prueba de Fuerza (Atletismo) contra tu CD de salvación de conjuros."}, {"n": "Controlar el clima", "lv": 8, "esc": "Transmutación", "cl": ["clérigo", "druida", "mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: Lanzador Componentes: V, S, M (incienso para quemar) Duración: Concentración, hasta 8 horas¶Hasta que termine el conjuro, asumes el control del clima a 7,5 km o menos de ti. Debes estar al aire libre para lanzar este conjuro y terminará antes de tiempo si entras en una zona cubierta. Cuando lanzas el conjuro, cambias las condiciones climatológicas actuales, que determinará tu GM. Puedes cambiar las precipitaciones, la temperatura¶y el viento. Se tardan 1d4 × 10 minutos en que las nuevas condiciones surtan efecto. En cuanto lo ha- gan, puedes volver a cambiarlas. Cuando el conjuro termine, el clima volverá poco a poco a su estado normal. Cuando cambies las condiciones meteorológicas, busca un estado en las tablas siguientes y modifica su nivel en uno, arriba o abajo. Si cambias el viento, también puedes alterar su dirección.¶Precipitaciones Nivel¶Estado¶Despejado¶Nubes escasas¶Cielo cubierto o niebla de superficie¶Lluvia, granizo o nieve¶Lluvia torrencial, tormenta de granizo o ventisca¶Temperatura¶Viento¶Nivel¶Nivel¶Estado¶Estado¶Ola de calor¶Calmo¶Caliente¶Viento moderado¶Templado¶Viento fuerte¶Fresco¶Galerna¶Frío¶Tempestad¶Frío extremo"}, {"n": "Corcel fantasma", "lv": 3, "esc": "Ilusionismo", "cl": ["mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: 9 m Componentes: V, S Duración: 1 hora¶Una criatura equina cuasi real de tamaño Grande aparece en un espacio sin ocupar de tu elección dentro del alcance. Tú decides su aspecto y estará equipada con una silla, bocado y bridas. Cualquier equipo creado por el conjuro se desvanecerá en una bocanada de humo si se lleva a más de 3 m de la montura. Hasta que termine el conjuro, tú o una criatura de tu elección podéis montar el corcel. El corcel utiliza el perfil del caballo de monta (consulta el capítulo “Monstruos”), excepto que tiene una velocidad de 30 m y puede desplazarse a 20 km/h. Cuando el con- juro termina, el corcel se desvanece gradualmente, lo que da al jinete 1 minuto para desmontar. El con- juro termina antes si el corcel recibe daño."}, {"n": "Creación", "lv": 5, "esc": "Ilusionismo", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 9 m Componentes: V, S, M (un pincel) Duración: Especial¶Tomas hebras de sombra del Páramo Sombrío para crear un objeto dentro del alcance. Puede ser un objeto de materia vegetal (tela, cuerda, madera o algo similar) o mineral (piedra, cristal, metal o algo similar). El objeto no puede ser mayor que un cubo de 1,5 m de lado y debe tener una forma y un material que hayas visto. La duración del conjuro depende del material del objeto, como se muestra en la tabla “Materiales”. Si el objeto está compuesto de varios materiales, su duración será la menor. Si se usa cualquier objeto creado con este conjuro como componente material de otro conjuro, este último fallará.¶Materiales Material¶Duración¶Materia vegetal¶24 horas¶Piedra o cristal¶12 horas¶Metales preciosos¶1 hora¶Gemas¶10 minutos¶Adamantina o mithral¶1 minuto¶Con un espacio de conjuro de nivel superior. El tamaño del cubo aumenta en 1,5 m por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Crear comida y agua", "lv": 3, "esc": "Conjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Creas 22,5 kg de comida y 120 l de agua potable en el suelo o en recipientes dentro del alcance, ideales para evitar los peligros de la desnutrición y la des- hidratación. La comida es sosa pero nutritiva y tiene el aspecto de una comida de tu elección, mientras que el agua está limpia. La comida se estropea si no se consume en 24 horas."}, {"n": "Crear llama", "lv": 0, "esc": "conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V, S Duración: 10 minutos¶En tu mano aparece una llama titilante, que per- manece hasta que termine el conjuro. En tu mano,¶la llama no genera calor, no puede quemar nada y emite una luz brillante en un radio de 6 m y luz tenue 6 m más allá. El conjuro termina si lo vuelves a lanzar. Hasta que el conjuro termine, puedes usar una acción de magia para arrojar la llama a una criatura u objeto a 18 m o menos de ti. Haz un ataque de conjuro a distancia. Si acierta, el objetivo recibe 1d8 de daño de fuego. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Crear muerto viviente", "lv": 6, "esc": "Nigromancia", "cl": ["brujo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 3 m Componentes: V, S, M (un ónice negro que valga al menos 150 po por cada cadáver) Duración: Instantáneo¶Solo puedes lanzar este conjuro por la noche. Elige hasta tres cadáveres de humanoides de tamaño Mediano o Pequeño dentro del alcance. Cada uno se convierte en un gul bajo tu control (consulta el capí- tulo “Monstruos” para ver su perfil). Como acción adicional en cada uno de tus turnos, puedes dar órdenes mentalmente a cada criatura que hayas animado con el conjuro que esté a 36 m o menos de ti (si controlas a varias criaturas, puedes dar órdenes a cualesquiera de ellas a la vez transmitiéndole la misma orden a cada una). Tú decides qué acción llevará a cabo la criatura y adónde se moverá en su siguiente turno, o puedes dar una orden general, como proteger un lugar en concreto. Si no das ninguna orden, la criatura hace la acción de esquivar y solo se mueve para evitar peligros. En cuanto se le dé una orden, la criatura la cumplirá hasta completar su tarea. La criatura estará bajo tu control durante 24 horas, tras las cuales dejará de obedecer cual- quier orden que le hayas dado. Para mantener el control sobre ella otras 24 horas, deberás volver a lanzarle este conjuro antes de que acabe el periodo actual de 24 horas. Este uso del conjuro refuerza tu control sobre hasta tres criaturas que hayas animado con él y no anima nuevas criaturas. Con un espacio de conjuro de nivel superior. Si usas un espacio de conjuro de nivel 7, puedes animar o reforzar el control sobre cuatro gules. Si usas un espacio de conjuro de nivel 8, puedes animar o reforzar el control sobre cinco gules o dos ghasts o tumularios. Si usas un espacio de conjuro de nivel 9, puedes animar o reforzar el control sobre seis gules, tres ghasts o tumularios o dos momias. Consulta el capítulo “Monstruos” para ver estos perfiles."}, {"n": "Crear o destruir agua", "lv": 1, "esc": "Transmutación", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una mezcla de agua y arena) Duración: Instantáneo¶Produces uno de estos efectos:¶Crear agua. Creas hasta 40 l de agua limpia dentro del alcance en un recipiente abierto. Como alter- nativa, el agua cae en forma de lluvia en un cubo de 9 m de lado dentro del alcance y apaga las lla- mas desprotegidas de la zona. Destruir agua. Destruyes hasta 40 l de agua dentro del alcance en un recipiente abierto. Como alter- nativa, puedes destruir niebla en un cubo de 9 m de lado dentro del alcance. Con un espacio de conjuro de nivel superior. Creas o destruyes 40 l más de agua o el tamaño del cubo aumenta en 1,5 m por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Crecimiento espinoso", "lv": 2, "esc": "Transmutación", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (siete espinas) Duración: Concentración, hasta 10 minutos¶Del suelo en una esfera de 6 m de radio centrada en un punto dentro del alcance brotan espinas y pin- chos. La zona se vuelve terreno difícil hasta que termine el conjuro. Cuando una criatura entra en la zona o se desplaza por ella, recibe 2d4 de daño perforante por cada 1,5 m que avanza. La transformación del suelo se camufla, de forma que parece natural. Cualquier criatura que no pueda ver la zona cuando se lanza el conjuro deberá emplear una acción de buscar y superar una prueba de Sabiduría (Percepción o Supervivencia) contra tu CD de salvación de conjuros para reconocer que el terreno es peligroso antes de adentrarse en él."}, {"n": "Crecimiento vegetal", "lv": 3, "esc": "Transmutación", "cl": ["bardo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción (sobrecrecimiento) u 8 horas (fertilización) Alcance: 45 m Componentes: V, S Duración: Instantáneo¶Este conjuro infunde vitalidad en las plantas. El tiempo de lanzamiento que uses determina si el conjuro tiene un efecto de sobrecrecimiento o de enriquecimiento, descritos a continuación. Sobrecrecimiento. Elige un punto dentro del alcance. Todas las plantas en una esfera de 30 m de radio centrada en ese punto se volverán gruesas¶y frondosas. Una criatura que atraviese esa área deberá gastar 4 m de movimiento por cada metro que se mueva. Puedes excluir una o más zonas de cualquier tamaño dentro del área del conjuro para que no se vean afectadas. Fertilización. Todas las plantas en un radio de 750 m centrado en un punto dentro del alcance estarán fertilizadas durante 365 días y producirán el doble de comida al recolectarlas. Solo podrán beneficiarse de un crecimiento vegetal cada año."}, {"n": "Cuchillo de hielo", "lv": 1, "esc": "Conjuración", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: S, M (una gota de agua o un trozo de hielo) Duración: Instantáneo¶Creas una esquirla de hielo y se la lanzas a una cria- tura dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 1d10 de daño perforante. Acierte o falle, el fragmento explotará. El objetivo y todas las criatu- ras a 1,5 m menos de él deberán superar una tirada de salvación de Destreza o recibirán 2d6 de daño de frío. Con un espacio de conjuro de nivel superior. El daño de frío aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Curar", "lv": 6, "esc": "Abjuración", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Elige a una criatura que puedas ver dentro del alcance. Una energía positiva la recorre y hace que recupere 70 puntos de golpe. El conjuro también elimina los estados de cegado, ensordecido y enve- nenado del objetivo. Con un espacio de conjuro de nivel superior. La curación aumenta en 10 por cada nivel por enci- ma de 6 que tenga el espacio."}, {"n": "Curar en masa", "lv": 9, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶De ti brota una oleada de energía curativa que envuelve a las criaturas que te rodean. Haces recu- perar hasta 700 puntos de golpe, repartidos como tú escojas entre cualquier cantidad de criaturas que puedas ver dentro del alcance. Las criaturas¶sanadas con este conjuro también se libran de los estados de cegadas, ensordecidas y envenenadas."}, {"n": "Curar heridas", "lv": 1, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida", "explorador", "paladín"], "t": "explorador, paladín) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Instantáneo¶Una criatura a la que toques recupera una cantidad de puntos de golpe igual a 2d8 más tu modificador por aptitud mágica. Con un espacio de conjuro de nivel superior. La curación aumenta en 2d8 por cada nivel por enci- ma de 1 que tenga el espacio."}, {"n": "Curar heridas en masa", "lv": 5, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Una ola de energía curativa brota de un punto que puedas ver dentro del alcance. Elige a hasta seis criaturas en una esfera de 9 m de radio centrada en ese punto. Cada objetivo recupera una cantidad de puntos de golpe igual a 5d8 más tu modificador por aptitud mágica. Con un espacio de conjuro de nivel superior. La curación aumenta en 1d8 por cada nivel por enci- ma de 5 que tenga el espacio."}, {"n": "Dañar", "lv": 6, "esc": "Nigromancia", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Desatas una magia virulenta sobre una criatura que puedas ver dentro del alcance. El objetivo hace una tirada de salvación de Constitución. Si la falla, sufre 14d6 de daño necrótico y sus puntos de golpe máximos se reducen en una cantidad igual al daño necrótico recibido. Si la supera, recibirá solo la mitad de daño. Este conjuro no puede reducir los puntos de golpe máximos del objetivo a menos de 1."}, {"n": "Dedo de la muerte", "lv": 7, "esc": "Nigromancia", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Desatas una energía negativa hacia una criatura que puedas ver dentro del alcance. El objetivo hace una tirada de salvación de Constitución; sufrirá 7d8 + 30 de daño necrótico si la falla o la mitad del daño si la supera. Si un humanoide muere a causa de este conjuro, se alzará al principio de tu siguiente turno como un zombi (consulta el capítulo “Monstruos”) y seguirá tus órdenes verbales."}, {"n": "De la carne a la piedra", "lv": 6, "esc": "Transmutación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (una pluma de cocatriz) Duración: Concentración, hasta 1 minuto¶Intentas convertir en piedra a una criatura que puedas ver dentro del alcance. El objetivo hace una t irada de salvación de Constitución. Si la falla, tendrá el estado de apresado hasta que el conjuro termine. Si la supera, su velocidad será 0 hasta el principio de tu siguiente turno. Los autómatas supe- ran automáticamente la tirada de salvación. Un objetivo apresado realiza otra tirada de salva- ción de Constitución al final de cada uno de sus tur- nos. Si la supera tres veces, el conjuro termina. Si la falla tres veces, se convierte en piedra y sufre el estado de petrificada hasta que termine el conjuro. Los éxitos y los fallos no tienen por qué ser consecu- tivos: lleva la cuenta de ambos hasta que el objetivo tenga tres de un mismo tipo. Si mantienes la concentración en este conjuro durante toda su duración posible, el objetivo ten- drá el estado de petrificado hasta que un conjuro restablecimiento mayor u otro efecto mágico similar le ponga fin."}, {"n": "Descarga de fuego", "lv": 0, "esc": "evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Arrojas una mota de fuego a una criatura u objeto dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 1d10 de daño de fuego. Los objetos inflama- bles a los que acierte el conjuro empezarán a arder si nadie los lleva o viste. Mejora de truco. El daño aumenta en 1d10 cuando alcanzas los niveles 5 (2d10), 11 (3d10) y 17 (4d10)."}, {"n": "Descarga sobrenatural", "lv": 0, "esc": "evocación", "cl": ["brujo"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Lanzas un rayo de energía chisporroteante. Haz un ataque de conjuro a distancia contra una criatu- ra u objeto dentro del alcance. Si acierta, el objetivo recibe 1d10 de daño de fuerza. Mejora de truco. El conjuro crea dos rayos a nivel 5, tres rayos a nivel 11 y cuatro rayos a nivel 17. Puedes dirigir los rayos al mismo objetivo o a objetivos distintos. Realiza una tirada de ataque por separado para cada rayo."}, {"n": "Deseo", "lv": 9, "esc": "Conjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V Duración: Instantáneo¶Deseo es el conjuro más poderoso que puede lanzar un mortal. Solo con decirlo en voz alta, puedes alte- rar la propia realidad. El uso básico de este conjuro es duplicar cualquier otro conjuro de nivel 8 o inferior. Si lo usas de esta forma, no necesitas cumplir ningún requisito de di- cho conjuro, incluido cualquier componente costoso. El conjuro simplemente surte efecto. Como alternativa, puedes crear uno de los siguien- tes efectos a tu elección: Creación de objetos. Creas un objeto con un valor de hasta 25 000 po que no sea un objeto mágico. El objeto no puede medir más de 90 m en cual- quier dimensión y aparecerá en un espacio sin ocupar que puedas ver sobre el suelo. Curación instantánea. Permites que hasta veinte criaturas que puedas ver y tú recuperéis todos los puntos de golpe y pones fin a todos los efectos que sufráis descritos en el conjuro restablecimiento mayor. Resistencia. Concedes resistencia a un tipo de daño de tu elección a hasta diez criaturas que puedas ver. La resistencia es permanente. Inmunidad a conjuros. Concedes inmunidad a un único conjuro u otro efecto mágico durante 8 horas a hasta diez criaturas que puedas ver. Aprendizaje repentino. Sustituyes una de tus dotes por otra para la que cumplas los requisitos. Pierdes todos los beneficios de la dote anterior y obtienes los de la nueva. No puedes sustituir una dote que funcione como requisito para cualquiera de tus otras dotes o rasgos.¶Rehacer tiradas. Deshaces un solo suceso recien- te obligando a repetir cualquier tirada hecha durante el último asalto (incluido tu último turno). La realidad se reconforma para amoldarse al nuevo resultado. Por ejemplo, un conjuro deseo podría deshacer una tirada de salvación que falle un aliado o un crítico de un enemigo. Puedes obligar a que la tirada se repita con ventaja o desventaja y elegir si usar el nuevo resultado o el resultado original. Remodelar la realidad. Puedes desear algo que no se incluya entre los efectos anteriores. Para ello, explícale tu deseo de la forma más precisa posible a tu GM, quien tiene una amplia capacidad para decidir lo que ocurre en estos casos: cuanto ma- yor sea el deseo, más posible es que algo vaya mal. El conjuro simplemente podría fallar, el efecto que deseas podría conseguirse solo parcialmente o podrías sufrir una consecuencia imprevisible de- bido a cómo has expresado tu deseo. Por ejemplo, desear que un villano estuviera muerto podría propulsarte hacia delante en el tiempo hasta un periodo en el que dicho villano ya no esté vivo, lo que te excluiría del juego. De forma similar, desear un objeto mágico legendario o un artefacto podría transportarte de inmediato ante el actual pro- pietario de dicho objeto. Si se te concede el deseo y sus efectos tienen consecuencias para toda una comunidad, región o mundo, es probable que te ganes enemigos poderosos. Si el deseo afectase a un dios, sus sirvientes divinos podrían intervenir al momento para impedirlo o para animarte a que formules el deseo de una forma concreta. Si tu deseo fuese a deshacer el propio multiverso, dicho deseo fallará. La tensión de lanzar deseo para producir cualquier efecto que no sea duplicar otro conjuro te debilita. Tras soportar dicha tensión, cada vez que lances un conjuro hasta que finalices un descanso largo, reci- birás 1d10 de daño necrótico por cada nivel de ese conjuro. Este daño no se puede reducir ni prevenir de ningún modo. Además, tu puntuación de Fuerza se convierte en 3 durante 2d4 días. Por cada uno de esos días que pases descansando y haciendo única- mente actividades ligeras, tu tiempo de recupera- ción restante se reduce en 2 días. Por último, hay un 33 % de probabilidad de que no puedas volver a lanzar nunca deseo si sufres esta tensión."}, {"n": "Desintegrar", "lv": 6, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un imán natural y polvo) Duración: Instantáneo¶Lanzas un rayo verde hacia un objetivo que puedas ver dentro del alcance. El objetivo puede ser una criatura, un objeto no mágico o una creación de fuerza mágica, como una pared creada por muro de fuerza. Una criatura que sea objetivo de este conjuro deberá hacer una tirada de salvación de Destreza. Si la falla, recibirá 10d6 + 40 de daño de fuerza. Si este daño reduce sus puntos de golpe a 0, la cria- tura y todos los objetos no mágicos que vista o lleve quedarán reducidos a un polvo gris. La criatura solo puede ser devuelta a la vida mediante un conjuro deseo o resurrección verdadera. Este conjuro desintegra automáticamente cual- quier objeto no mágico de tamaño Grande o más pequeño o cualquier creación de fuerza mágica. Si el objetivo es Enorme o mayor, el conjuro desin- tegrará una parte de él con forma de cubo de 3 m de lado. Con un espacio de conjuro de nivel superior. El daño aumenta en 3d6 por cada nivel por encima de 6 que tenga el espacio.¶Tira 1d6 al final de cada uno de tus turnos hasta que el conjuro termine. Si el resultado es 4–6, desa- pareces de tu plano de existencia actual y apareces en el Plano Etéreo (el conjuro termina al instante si ya estabas en ese plano). Mientras estás en el Plano Etéreo, puedes percibir lo que sucede en el plano del que procedes, que se muestra en distintos tonos de gris, pero no puedes ver nada que esté a más de 18 m. Solo puedes afectar a criaturas que estén en el Plano Etéreo y solo estas criaturas te pueden afectar a ti. Las criaturas que estén en el otro plano no pueden percibirte en el Plano Etéreo a menos que tengan una capacidad especial que les permita percibir cosas en el Plano Etéreo. Al principio de tu siguiente turno, y si el conjuro acaba mientras estás en el Plano Etéreo, volverás al otro plano y aparecerás en un espacio sin ocupar de tu elección que puedas ver a 3 m o menos del espacio que hayas abandonado. Si no hay ningún espacio sin ocupar en ese alcance, aparecerás en el espacio sin ocupar más cercano.¶Tiempo de lanzamiento: 8 horas Alcance: Toque Componentes: V, S, M (un ágata que valga al menos 1000 po y que se consume como parte del conjuro) Duración: Instantáneo¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una vara de metal con forma de horquilla que valga al menos 250 po y esté sintonizada con un plano de existencia) Duración: Instantáneo"}, {"n": "Desplazamiento", "lv": 3, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: 1 minuto"}, {"n": "Destierro", "lv": 4, "esc": "Abjuración", "cl": ["brujo", "clérigo", "hechicero", "mago", "paladín"], "t": "paladín) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (un pentáculo) Duración: Concentración, hasta 1 minuto¶Una criatura que puedas ver dentro del alcance deberá superar una tirada de salvación de Carisma¶o se teletransportará a un semiplano inofensivo hasta que termine el conjuro. Mientras permanezca allí, tendrá el estado de incapacitada. Cuando el conjuro termine, el objetivo reaparecerá en el espacio que abandonó o en el espacio sin ocupar más c ercano si dicho espacio está ocupado. Si el conjuro dura 1 minuto y el objetivo es una aberración, un celestial, un elemental, un feérico o un infernal, no regresará. En vez de ello, se teletransportará a un lugar aleatorio de un plano (a elección de tu GM) relacionado con su tipo de criatura. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Detectar el bien y el mal", "lv": 1, "esc": "Adivinación", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 10 minutos¶Hasta que el conjuro termine, percibes la ubica- ción de cualquier aberración, celestial, elemental, feérico, infernal o muerto viviente a 9 m o menos de ti. También percibes si hay un conjuro consagrar activo en el espacio y su ubicación. El conjuro no puede atravesar 30 cm de piedra, tierra o madera, 2,5 cm de metal o una lámina fina de plomo."}, {"n": "Detectar trampas", "lv": 2, "esc": "Adivinación", "cl": ["clérigo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 10 minutos¶Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Hasta que el conjuro termine, podrás percibir la presencia de efectos mágicos a 9 m o menos de ti. Si percibes alguno, puedes usar una acción de magia para ver una débil aura alrededor de cual- quier o  bjeto o criatura visible dentro de la zona que esté afectada por la magia y, si el efecto lo creó un conjuro, distingues a qué escuela mágica pertenece. El conjuro no puede atravesar 30 cm de piedra, tierra o madera, 2,5 cm de metal o una lámina fina de plomo.¶Detectas cualquier trampa dentro del alcance que esté en tu línea de visión. En lo que a este conjuro respecta, una trampa incluye cualquier objeto o mecanismo que fuese creado para causar un daño u otro peligro. Por tanto, el conjuro detectaría los conjuros alarma y glifo custodio o una trampa de pozo mecánica, pero no revelaría una debilidad natural del suelo, un techo inestable o un socavón oculto. Este conjuro alerta de la existencia de una trampa, pero no te indica su ubicación. Aun así, descubres la naturaleza general del peligro que supone una trampa que detectas."}, {"n": "Detectar pensamientos", "lv": 2, "esc": "Adivinación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (1 pieza de cobre) Duración: Concentración, hasta 1 minuto¶Activas uno de los siguientes efectos. Hasta que el conjuro termine, puedes activar cualquiera de ellos como acción de magia en tus siguientes turnos. Sentir pensamientos. Percibes la presencia de pensamientos que pertenecen a criaturas que conozcan idiomas o sean telepáticas a 9 m o menos de ti. No lees sus pensamientos, pero sabes que hay una criatura pensante cerca. El conjuro no puede atravesar 30 cm de piedra, tierra o madera, 2,5 cm de metal o una lámina fina de plomo. Leer pensamientos. Haces objetivo a una criatura que puedas ver a 9 m o menos de ti o a una criatura a 9 m o menos de ti que hayas detectado con la op- ción de sentir pensamientos y averiguas lo principal que ocupa su mente en ese momento. Si el objetivo no conoce ningún idioma o no es telepático, no des- cubres nada. Como acción de magia en tu próximo turno, puedes intentar sondear en profundidad su mente. Si lo haces, el objetivo hará una tirada de s alvación de Sabiduría. Si la falla, descubrirás su forma de razonar, sus emociones y algo que sea de gran importancia en su mente (una preocupación o algo que ame u odie). Si la supera, el conjuro terminará. De cualquier forma, el objetivo sabrá que estás son- deando su mente y, a menos que desplaces tu aten- ción, podrá usar una acción en su turno para hacer una prueba de Inteligencia (Conocimiento arcano) contra tu CD de salvación de conjuros; si la supera, el conjuro terminará."}, {"n": "Detectar venenos y enfermedades", "lv": 1, "esc": "Adivinación", "cl": ["clérigo", "druida", "explorador", "paladín"], "t": "paladín) Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S, M (una hoja de tejo) Duración: Concentración, hasta 10 minutos¶Hasta que el conjuro termine, percibes la ubicación de venenos, criaturas venenosas y enfermedades mágicas a 9 m o menos de ti, e identificas el tipo de veneno, criatura o enfermedad en cada caso. El conjuro no puede atravesar 30 cm de piedra, tierra o madera, 2,5 cm de metal o una lámina fina de plomo."}, {"n": "Disco flotante", "lv": 1, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 9 m Componentes: V, S, M (una gota de mercurio) Duración: 1 hora¶Este conjuro crea un plano de fuerza horizontal de 90 cm de diámetro y 2,5 cm de grosor que flota 90 cm por encima del suelo en un espacio sin ocupar de tu elección que puedas ver dentro del alcance. El disco dura hasta que termina el conjuro y puede soportar un peso de hasta 250 kg. Si se pone más peso sobre él, el conjuro termina y todo lo que hay en el disco cae al suelo. El disco permanecerá inmóvil mientras estés a 6 m o menos de él. Si te alejas a más de 6 m de él, te seguirá para mantenerse a 6 m de ti. Se puede mover por terreno irregular y subir y bajar escale- ras, pendientes y similares, pero no puede superar un cambio de elevación de 3 m o más. Por ejemplo, el disco no puede cruzar un pozo de 3 m de profun- didad ni salir de él si se crea en el fondo de este. Si te alejas más de 30 m del disco (normalmente, porque no pueda superar un obstáculo para seguirte), el conjuro termina."}, {"n": "Disfrazarse", "lv": 1, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: 1 hora¶Haces que tu aspecto (incluyendo tu vestimenta, armadura, armas y otras posesiones que lleves contigo) parezca diferente hasta que el conjuro termine. Puedes aparentar tener una altura 30 cm mayor o menor y una complexión más pesada o ligera. Debes adoptar una forma que tenga la misma configuración de miembros que tú. Por lo demás, la ilusión puede modificar todo lo que quieras de tu aspecto.¶Los cambios realizados por este conjuro pueden descubrirse mediante una inspección física. Por ejemplo, si usas este conjuro para añadir un som- brero a tu vestimenta, los objetos atravesarán el sombrero y cualquiera que lo toque no sentirá nada. Para darse cuenta de que te has disfrazado, una criatura debe emplear la acción de estudiar para inspeccionar tu apariencia y superar una prueba de Inteligencia (Investigación) contra tu CD de sal- vación de conjuros."}, {"n": "Disipar el bien y el mal", "lv": 5, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (plata y hierro en polvo) Duración: Concentración, hasta 1 minuto¶Hasta que termine el conjuro, celestiales, elementa- les, feéricos, infernales y muertos vivientes tendrán desventaja en las tiradas de ataque contra ti. Puedes poner fin al conjuro anticipadamente si usas cual- quiera de las siguientes funciones especiales. Despido. Como acción de magia, haces objetivo a una criatura que puedas ver a 1,5 m o menos de ti que tenga uno de los tipos de criatura anteriores. El objetivo deberá superar una tirada de salvación de Carisma o será devuelto a su plano natal si no está allí ya. Si no están en su plano natal, los muer- tos vivientes son enviados al Páramo Sombrío, y los feéricos, a los Parajes Feéricos. Romper encantamiento. Como acción de m  agia, tocas a una criatura que tenga los estados de asustada o hechizada o esté poseída por una o más criaturas de los tipos anteriores. La criatura objetivo deja de estar poseída, asustada o hechizada por dichas criaturas."}, {"n": "Disipar magia", "lv": 3, "esc": "Abjuración", "cl": ["bardo", "brujo", "clérigo", "druida", "explorador", "hechicero", "mago", "paladín"], "t": "explorador, hechicero, mago, paladín) Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Elige una criatura, un objeto o un efecto mágico dentro del alcance. Cualquier conjuro activo de nivel 3 o inferior presente en el objetivo termina. Para cada conjuro activo de nivel 4 o superior, haz una prueba de característica usando tu aptitud mágica (CD 10 más el nivel de ese conjuro). Si supe- ras la tirada, el conjuro termina. Con un espacio de conjuro de nivel superior. Disipas automáticamente un conjuro sobre el obje- tivo cuyo nivel sea menor o igual al nivel del espacio de conjuro que hayas utilizado."}, {"n": "Dominar bestia", "lv": 4, "esc": "Encantamiento", "cl": ["druida", "explorador", "hechicero"], "t": "hechicero) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Una bestia que puedas ver dentro del alcance de- berá superar una tirada de salvación de Sabiduría o tendrá el estado de hechizada hasta que termine el conjuro. El objetivo tiene ventaja en la tirada si está luchando contra ti o tus aliados. Siempre que reciba daño, repetirá la tirada de salvación y, si tiene éxito, se librará del conjuro. Tendrás un vínculo telepático con el objetivo hechizado mientras estéis en el mismo plano de existencia. En tu turno, puedes usar este vínculo para dar órdenes al objetivo (no requiere acción), como “ataca a esa criatura”, “muévete hacia allí” o “tráeme ese objeto”. En su turno, el objetivo hace todo lo posible por obedecer. Si lleva a cabo una or- den y no recibe más instrucciones de tu parte, actúa y se mueve libremente y se centra en protegerse. Puedes ordenarle al objetivo que lleve a cabo reacciones, pero para ello deberás usar tu propia reacción. Con un espacio de conjuro de nivel superior. Tu concentración puede durar más con un espacio de conjuro de nivel 5 (hasta 10 minutos), 6 (hasta 1 hora) o 7 o más (hasta 8 horas)."}, {"n": "Dominar monstruo", "lv": 8, "esc": "Encantamiento", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 hora¶Una criatura que puedas ver dentro del alcance deberá superar una tirada de salvación de Sabiduría o tendrá el estado de hechizada hasta que termine el conjuro. El objetivo tiene ventaja en la tirada si está luchando contra ti o tus aliados. Siempre que reciba daño, repetirá la tirada de salvación y, si tiene éxito, se librará del conjuro. Tendrás un vínculo telepático con el objetivo hechizado mientras estéis en el mismo plano de existencia. En tu turno, puedes usar este vínculo para dar órdenes al objetivo (no requiere acción), como “ataca a esa criatura”, “muévete hacia allí” o “tráeme ese objeto”. En su turno, el objetivo hace todo lo posible por obedecer. Si lleva a cabo una or- den y no recibe más instrucciones de tu parte, actúa y se mueve libremente y se centra en protegerse.¶Puedes ordenarle al objetivo que lleve a cabo reacciones, pero para ello deberás usar tu propia reacción. Con un espacio de conjuro de nivel superior. Tu concentración puede durar más con un espacio de conjuro de nivel 9 (hasta 8 horas)."}, {"n": "Dominar persona", "lv": 5, "esc": "Encantamiento", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Un humanoide que puedas ver dentro del alcance deberá superar una tirada de salvación de Sabiduría o tendrá el estado de hechizado hasta que termine el conjuro. El objetivo tiene ventaja en la tirada si está luchando contra ti o tus aliados. Siempre que reciba daño, repetirá la tirada de salvación y, si tiene éxito, se librará del conjuro. Tendrás un vínculo telepático con el objetivo hechizado mientras estéis en el mismo plano de existencia. En tu turno, puedes usar este vínculo para dar órdenes al objetivo (no requiere acción), como “ataca a esa criatura”, “muévete hacia allí” o “tráeme ese objeto”. En su turno, el objetivo hace todo lo posible por obedecer. Si lleva a cabo una or- den y no recibe más instrucciones de tu parte, actúa y se mueve libremente y se centra en protegerse. Puedes ordenarle al objetivo que lleve a cabo reacciones, pero para ello deberás usar tu propia reacción. Con un espacio de conjuro de nivel superior. Tu concentración puede durar más con un espacio de conjuro de nivel 6 (hasta 10 minutos), 7 (hasta 1 hora) u 8 o más (hasta 8 horas)."}, {"n": "Don de lenguas", "lv": 3, "esc": "Adivinación", "cl": ["bardo", "brujo", "clérigo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, M (un zigurat en miniatura) Duración: 1 hora¶Este conjuro permite a la criatura que toques com- prender cualquier idioma hablado que oiga o lengua de signos que vea. Asimismo, cuando el objetivo se comunica oralmente o mediante signos, cualquier criatura que conozca al menos un idioma podrá entenderlo si lo escucha hablar o lo ve signar."}, {"n": "Dormir", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (una pizca de arena o pétalos de rosa) Duración: Concentración, hasta 1 minuto¶Todas las criaturas de tu elección en una esfera de 1,5 m de radio centrada en un punto dentro del alcance deben superar una tirada de salvación de Sabiduría o tendrán el estado de incapacitadas has- ta el final de su siguiente turno, momento en el que deberán repetir la tirada de salvación. Si un objetivo falla la segunda tirada, tendrá el estado de incons- ciente hasta que termine el conjuro. El conjuro termina sobre un objetivo si recibe daño o si alguien a 1,5 m o menos de él emplea una acción para zaran- dearlo y poner fin al efecto del conjuro. Las criaturas que no duermen, como los elfos, o que tengan inmunidad al estado de cansancio superan automáticamente las tiradas de salvación contra este conjuro."}, {"n": "Dulce descanso", "lv": 2, "esc": "Nigromancia", "cl": ["clérigo", "mago", "paladín"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: Toque Componentes: V, S, M (2 piezas de cobre, que se consumen como parte del conjuro) Duración: 10 días¶Tocas un cadáver u otro tipo de restos mortales. Hasta que termine el conjuro, el objetivo está prote- gido de la descomposición y no se puede convertir en un muerto viviente. El conjuro también amplía el tiempo máximo para resucitar al objetivo, ya que los días que pasa bajo su influencia no cuentan para el límite de tiempo de conjuros como alzar a los muertos."}, {"n": "Elementalismo", "lv": 0, "esc": "transmutación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Controlas los elementos y creas uno de los siguien- tes efectos dentro del alcance: Esculpir los elementos. Haces que la tierra, arena, fuego, humo, niebla o agua que quepan en un cubo de 30 cm de lado adopten una forma tosca (como la de una criatura) durante 1 hora. Invocar el agua. Creas un rocío de fría niebla que humedece ligeramente a las criaturas y objetos en un cubo de 1,5 m de lado. Como alternativa, creas una taza de agua limpia, ya sea en un recipiente¶abierto o sobre una superficie, y el agua se evapora al cabo de 1 minuto. Invocar el aire. Creas una brisa lo bastante fuerte como para ondear telas, remover polvo, agitar hojas y cerrar puertas y contraventanas abiertas en un cubo de 1,5 m de lado. Las puertas y contraventa- nas que algo o alguien mantenga abiertas no se ven afectadas. Invocar el fuego. Creas una fina nube de ascuas inofensivas y un humo de color perfumado en un cubo de 1,5 m de lado. Tú eliges el color y el olor, y las ascuas pueden encender velas, antorchas o lámparas dentro de la zona. El aroma del humo permanece durante 1 minuto. Invocar la tierra. Creas una fina capa de polvo o arena que cubre superficies en una zona de 1,5 m de lado o haces que aparezca una sola palabra escrita con tu letra en una superficie de tierra o arena."}, {"n": "Embelesar", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "brujo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Creas una serie de palabras encantadoras que provocan que una o más criaturas de tu elección a las que puedas ver dentro del alcance deban hacer una tirada de salvación de Sabiduría. Cual- quier c riatura contra la que luchéis tus aliados o tú superará automáticamente esta tirada. Si la falla, el objetivo sufrirá un penalizador de −10 a las pruebas de Sabiduría (Percepción) y a la Percepción pasiva hasta que el conjuro termine."}, {"n": "Encantar animal", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (unas migajas de comida) Duración: 24 horas¶Haces objetivo a una bestia que puedas ver dentro del alcance. El objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de hechizado hasta que termine el conjuro. Si alguno de tus aliados o tú dañáis al objetivo, el conjuro termina. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una bestia adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Encontrar el camino", "lv": 6, "esc": "Adivinación", "cl": ["bardo", "clérigo", "druida"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Lanzador Componentes: V, S, M (un juego de herramientas de adivinación, como cartas o runas, que valga al menos 100 po) Duración: Concentración, hasta 1 día¶Percibes mágicamente el camino físico más corto hacia un lugar que nombres. Debes estar familia- rizado con él, y el conjuro fallará si nombras un destino en otro plano de existencia, un destino que se mueva (como una fortaleza ambulante) o un destino inespecífico (como “la guarida de un dragón verde”). Hasta que termine el conjuro y mientras estés en el mismo plano de existencia que el destino, sabrás lo lejos que está y en qué dirección se halla. Cuando te topes con una encrucijada mientras vas al destino, identificarás qué camino es el más corto."}, {"n": "Encontrar familiar", "lv": 1, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: 1 hora o un ritual Alcance: 3 m Componentes: V, S, M (incienso para quemar que valga al menos 10 po, que se consume como parte del conjuro) Duración: Instantáneo¶Obtienes los servicios de un familiar, un espíritu que adopta una forma animal de tu elección: araña, búho, comadreja, cuervo, gato, halcón, lagarto, murciélago, pulpo, rana, rata u otra bestia con un valor de desafío de 0. El familiar, que aparecerá en un espacio sin ocupar dentro del alcance, tiene el perfil de la forma elegida (consulta el capítulo “Monstruos”), aunque es un celestial, un feérico o un infernal (a tu elección) en vez de una bestia. Tu familiar actúa con independencia de ti, pero obedece tus órdenes. Conexión telepática. Mientras tu familiar esté a 30 m o menos de ti, puedes comunicarte con él tele- páticamente. Además, como acción adicional, pue- des ver a través de sus ojos y escuchar lo que oiga hasta el principio de tu siguiente turno, y también obtienes los beneficios de cualquier sentido especial que tenga. Por último, cuando lances un conjuro con un alcance de toque, puedes hacer que tu familiar sea quien toque al objetivo. Tu familiar debe estar a 30 m o menos de ti y debe usar una reacción para tocar al objetivo cuando lances el conjuro. Combate. El familiar se considera un aliado para tus aliados y para ti, tira su propia iniciativa y actúa en su propio turno. Un familiar no puede atacar,¶pero puede realizar otras acciones de manera nor- mal. Desaparición del familiar. Si los puntos de golpe del familiar se reducen a 0, desaparecerá y reapare- cerá después de que vuelvas a lanzar este conjuro. Como acción de magia, puedes hacer que el familiar se retire temporalmente a una dimensión de bolsi- llo. Como alternativa, puedes hacer que se desva- nezca para siempre. Como acción de magia mientras esté desaparecido temporalmente, puedes hacer que reaparezca en un espacio sin ocupar a 9 m o menos de ti. Siempre que sus puntos de golpe se reduzcan a 0 o que el familiar se retire a la dimen- sión de bolsillo, dejará en el espacio que ocupaba cualquier cosa que vistiera o llevase. Un solo familiar. No puedes tener más de un fami- liar al mismo tiempo. Si lanzas este conjuro mien- tras tengas un familiar, harás que adopte una nueva forma que cumpla los requisitos."}, {"n": "Engañar", "lv": 5, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: S Duración: Concentración, hasta 1 hora¶Obtienes el estado de invisible al mismo tiempo que un doble ilusorio de ti aparece en tu sitio. El doble permanece hasta que termine el conjuro, pero la invisibilidad acaba de inmediato después de que hagas una tirada de ataque, causes daño o lances un conjuro. Como acción de magia, puedes hacer que tu doble ilusorio se mueva hasta el doble de tu velocidad y hacer que realice gestos, hable y se comporte del modo que quieras. El doble es intangible e invulne- rable. Puedes ver a través de sus ojos y oír con sus oídos como si estuvieras en su ubicación."}, {"n": "Enlace telepático", "lv": 5, "esc": "Adivinación", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 9 m Componentes: V, S, M (dos huevos) Duración: 1 hora¶Forjas un enlace telepático entre hasta ocho cria- turas voluntarias de tu elección dentro del alcance y las vinculas psíquicamente unas con otras hasta que termine el conjuro. Las criaturas que no pueden comunicarse mediante idiomas no se ven afectadas. Hasta que el conjuro termine, los objetivos se pue- den comunicar telepáticamente usando el enlace, tanto si comparten idioma como si no. Esta comuni- cación se puede producir a cualquier distancia, pero no se extiende a otros planos de existencia.¶Enmarañar¶Entender idiomas¶Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S, M (una pizca de hollín y sal) Duración: 1 hora¶Unas plantas apresadoras surgen del suelo en un cuadrado de 6 m de lado dentro del alcance. Hasta que termine el conjuro, estas plantas convertirán la zona en terreno difícil y desaparecerán cuando el conjuro termine. Cada criatura (excepto tú) que esté en la zona cuando lances el conjuro deberá superar una tirada de salvación de Fuerza o tendrá el estado de apre- sada hasta que el conjuro termine. Una criatura apresada puede emplear una acción para hacer una prueba de Fuerza (Atletismo) contra tu CD de salvación de conjuros. Si la supera, se liberará de las plantas y dejará de estar apresada por ellas.¶Hasta que el conjuro termine, entiendes el signi- ficado literal de las palabras que escuches o veas signadas en cualquier idioma. También comprendes todas las palabras escritas que ves, independien- temente del idioma en el que estén, pero debes tocar la superficie en la que estén inscritas. Tardas aproximadamente 1 minuto en leer una página. Este"}, {"n": "Ensueño", "lv": 5, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Especial Componentes: V, S, M (un puñado de arena) Duración: 8 horas¶Elige como objetivo a una criatura que conozcas en el mismo plano de existencia. Una criatura volun- taria a la que toques o tú entraréis en un estado de trance y serviréis de mensajero onírico. Mientras esté en el trance, el mensajero tendrá el estado de incapacitado y una velocidad de 0. Si el objetivo está dormido, el mensajero aparece en sus sueños y puede conversar con él mientras siga dormido y hasta que termine el conjuro. El mensajero también puede dar forma al entorno del sueño y crear paisajes, objetos y otras imágenes. El mensajero puede salir del trance en cualquier momento, lo que pondrá fin al conjuro. Al despertar, el objetivo recordará el sueño a la perfección. Si el objetivo está despierto cuando lances el conjuro, el mensajero lo sabrá y podrá poner fin al trance (y al conjuro) o esperar a que se duerma, momento en el cual entrará en sus sueños. Puedes hacer que el mensajero se le aparezca al objetivo como un ser aterrador. Si lo haces, el men- sajero podrá entregar un mensaje de un máximo de 10 palabras y luego el objetivo hará una tirada de salvación de Sabiduría. Si la falla, no recibirá beneficio alguno del descanso y sufrirá 3d6 de daño psíquico cuando se despierte."}, {"n": "Escudo", "lv": 1, "esc": "Abjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Reacción, que llevas a cabo cuando te acierta una tirada de ataque o eres el objetivo del conjuro proyectil mágico Alcance: Lanzador Componentes: V, S Duración: 1 asalto¶Una barrera imperceptible de fuerza mágica te protege. Hasta el principio de tu siguiente turno, tienes un bonificador de +5 a la CA, incluido contra el ataque al que reacciona, y no recibes ningún daño del conjuro proyectil mágico."}, {"n": "Escudo de fe", "lv": 1, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 18 m Componentes: V, S, M (un pergamino de plegarias) Duración: Concentración, hasta 10 minutos¶Un campo titilante envuelve a una criatura de tu elección dentro del alcance y le otorga un bonifica- dor de +2 a la CA hasta que el conjuro termine."}, {"n": "Escudo de fuego", "lv": 4, "esc": "Evocación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una luciérnaga o una pizca de fósforo) Duración: 10 minutos¶Unas llamas tenues envuelven tu cuerpo hasta que termine el conjuro y emiten luz brillante en un radio de 3 m y luz tenue 3 m más allá. Las llamas te proporcionan un escudo cálido o un escudo frío, a tu elección. El escudo cálido te pro- porciona resistencia al daño de frío, mientras que el escudo frío te concede resistencia al daño de fuego. Además, siempre que una criatura a 1,5 m o menos de ti te acierte con una tirada de ataque¶cuerpo a cuerpo, el escudo estallará en llamas. El atacante recibirá 2d8 de daño de fuego de un e scudo cálido o 2d8 de daño de frío de un escudo frío."}, {"n": "Escudriñar", "lv": 5, "esc": "Adivinación", "cl": ["bardo", "brujo", "clérigo", "druida", "mago"], "t": "mago) Tiempo de lanzamiento: 10 minutos Alcance: Lanzador Componentes: V, S, M (un canalizador que valga al menos 1000 po, como una bola de cristal, un espejo o una pila llena de agua) Duración: Concentración, hasta 10 minutos¶Puedes ver y oír a una criatura de tu elección que esté en el mismo plano de existencia que tú. El ob- jetivo hace una tirada de salvación de Sabiduría, modificada en función de lo bien que conozcas al objetivo y el tipo de conexión física que tengas con él (consulta las tablas más adelante). El objetivo desconoce contra qué hace la tirada de salvación; solo sabe que siente intranquilidad. Conocimiento sobre el objetivo¶Modificador de la tirada de salvación¶De segundas (has oído hablar del objetivo)¶+5¶De primera mano (has conocido al objetivo)¶+0¶Familiar (conoces bien al objetivo)¶−5¶¿Qué tienes del objetivo?¶Modificador de la tirada de salvación¶Dibujo u otro retrato¶−2¶Prenda u otra posesión¶−4¶Parte del cuerpo, mechón de pelo o trozo de uña¶−10¶Si supera la tirada de salvación, el objetivo no se verá afectado y no podrás volver a usar este conjuro con él durante 24 horas. Si la falla, el conjuro crea un sensor invisible e intangible a 3 m o menos de él. Puedes ver y oír a través del sensor como si estuvieras allí. El sensor se mueve a la vez que el objetivo y permanece a 3 m o menos de él hasta que termine el conjuro. Si algo puede percibir el sensor, se mostrará como un orbe luminoso del tamaño aproximado de tu puño. En vez de hacer objetivo a una criatura, puedes elegir una ubicación que hayas visto antes. Cuando lo hagas, el sensor aparecerá en ese lugar y no se moverá."}, {"n": "Esfera congelante", "lv": 6, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 90 m Componentes: V, S, M (una esfera de cristal en miniatura) Duración: Instantáneo¶Un globo glacial surge de ti y golpea un punto de tu elección dentro del alcance, donde explota en una esfera de 18 m de radio. Todas las criaturas situadas en la zona realizan una tirada de salvación de Cons- titución; sufrirán 10d6 de daño de frío si la fallan o la mitad del daño si la superan. Si el globo golpea una masa de agua, la conge- lará hasta una profundidad de 15 cm en un área cuadrada de 9 m de lado. El hielo dura 1 minuto. Las criaturas que estuvieran nadando en la super- ficie del agua congelada quedarán atrapadas en el hielo y tendrán el estado de apresadas. Una criatura atrapada puede utilizar una acción para hacer una prueba de Fuerza (Atletismo) contra tu CD de salva- ción de conjuros para liberarse. Puedes renunciar a lanzar el globo tras completar el conjuro. En ese caso, en tu mano aparecerá un globo de tamaño similar a un proyectil de honda que resulta frío al tacto. En cualquier momento, tú o una criatura a la que le entregues el orbe podéis lanzarlo con la mano (hasta un alcance de 12 m) o arrojarlo con una honda (hasta el alcance normal de la honda). Se hará añicos al impactar y c ausará el mismo efecto que el uso normal del conjuro. También puedes dejar el orbe en el suelo sin hacerlo pedazos y, tras 1 minuto, explotará si nadie lo ha hecho estallar. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Esfera de llamas", "lv": 2, "esc": "Conjuración", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (una bola de cera) Duración: Concentración, hasta 1 minuto¶Creas una esfera de fuego de 1,5 m de diámetro en un espacio sin ocupar del suelo dentro del alcance, y durará hasta que termine el conjuro. Cualquier criatura que termine su turno a 1,5 m o menos de ella hará una tirada de salvación de Destreza; sufrirá 2d6 de daño de fuego si la falla o la mitad de daño si la supera. Como acción adicional, puedes mover la esfera hasta 9 m haciéndola rodar. Si mueves la esfera al espacio de una criatura, esta hará la tirada de salva- ción contra la esfera, que ya no podrá moverse más durante el turno.¶Cuando mueves la esfera, puedes llevarla por encima de barreras de hasta 1,5 m de alto y hacer que salte huecos de hasta 3 m de ancho. La esfera prende los objetos inflamables que toque y no lleve o vista nadie y emite luz brillante en un radio de 6 m y luz tenue otros 6 m más allá. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Esfera elástica", "lv": 4, "esc": "Abjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una esfera de cristal) Duración: Concentración, hasta 1 minuto¶Una esfera destellante encierra a una criatura u objeto Grande o más pequeño dentro del alcance. Una criatura no voluntaria deberá superar una ti- rada de salvación de Destreza o quedará encerrada hasta que el conjuro termine. Nada (ni objetos físicos ni energía ni los efectos de otros conjuros) puede atravesar la barrera en ninguna de sus direcciones, aunque una criatura que esté en la esfera puede respirar en su interior. La esfera es inmune a todo el daño y una criatura o un objeto en su interior no puede sufrir daño por ataques o efectos que se originen en el exterior y tampoco puede dañar a nada que haya fuera de la esfera. La esfera no pesa nada y tiene un tamaño justo como para contener a la criatura o el objeto de su interior. Una criatura encerrada puede utilizar una acción para empujar las paredes de la esfera y hacerla rodar a hasta la mitad de su velocidad. De forma similar, otras criaturas pueden recoger la esfera y moverla. Un conjuro desintegrar que haga objetivo a la esfera la destruirá, pero no dañará nada que haya dentro."}, {"n": "Esfera vitriólica", "lv": 4, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (una gota de bilis) Duración: Instantáneo¶Señalas un lugar dentro del alcance y una bola res- plandeciente de ácido de 30 cm de diámetro vuela hacia el punto escogido y explota en una esfera de 6 m de radio. Todas las criaturas situadas en esa zona realizan una tirada de salvación de Destreza. Si la fallan, recibirán 10d4 de daño de ácido y otros 5d4 de daño de ácido al final de su siguiente turno. Si la superan, solo sufren la mitad del daño inicial.¶Con un espacio de conjuro de nivel superior. El daño inicial aumenta en 2d4 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Espada arcana", "lv": 7, "esc": "Evocación", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (una espada en miniatura que valga al menos 250 po) Duración: Concentración, hasta 1 minuto¶Creas una espada espectral que levitará dentro del alcance y durará hasta que termine el conjuro. Cuando aparezca la espada, puedes realizar un ataque de conjuro cuerpo a cuerpo contra un objetivo que se encuentre a 1,5 m o menos de ella. Si acierta, el objetivo recibe una cantidad de daño de fuerza igual a 4d12 más tu modificador por apti- tud mágica. En tus turnos posteriores, puedes emplear una acción adicional para mover la espada hasta 9 m a un lugar que puedas ver y repetir el ataque contra el mismo objetivo u otro distinto."}, {"n": "Espejismo arcano", "lv": 7, "esc": "Ilusionismo", "cl": ["bardo", "druida", "mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: Vista Componentes: V, S Duración: 10 días¶Haces que el terreno de una zona cuadrada de hasta 1,5 km de lado tenga el aspecto, los sonidos, los olores e incluso las sensaciones de otro tipo de terreno. Podrías hacer que un campo abierto o una carretera se parezcan a un pantano, una colina, una grieta u otro tipo de terreno difícil o infran- queable. Se puede hacer que un estanque parezca una pradera cubierta de hierba, que un precipicio se aparezca como una suave cuesta o que un barranco pedregoso y estrecho se presente como una carrete- ra amplia y lisa. De forma similar, puedes alterar el aspecto de las estructuras o añadir algunas donde no las hay. El conjuro no disfraza, oculta ni añade criaturas. La ilusión incluye elementos sonoros, visuales, táctiles y olfativos, por lo que puede convertir un lugar despejado en un terreno difícil (o viceversa) o entorpecer de otra forma el movimiento por la zona. Cualquier parte del terreno ilusorio (como una piedra o un palo) que se saque de la zona desaparece de inmediato. Las criaturas con visión verdadera pueden ver a través de la ilusión y distinguir la verdadera forma del terreno. Sin embargo, todos los demás elementos de la ilusión permanecen, por lo que, aunque dichas¶criaturas serán conscientes de que se trata de una ilusión, podrán interactuar físicamente con ella."}, {"n": "Espíritus guardianes", "lv": 3, "esc": "Conjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (un pergamino de plegarias) Duración: Concentración, hasta 10 minutos¶Unos espíritus protectores revolotean a tu alrede- dor en una emanación de 4,5 m hasta que el conjuro termine. Si tu alineamiento es bueno o neutral, su forma espectral parece angelical o feérica (a tu elec- ción). Si es malvado, su forma es infernal. Cuando lanzas este conjuro, puedes elegir criatu- ras para que no les afecte. La velocidad de las demás criaturas se reducirá a la mitad en la emanación. Cuando esta entre en el espacio de una criatura o cuando una criatura entre en la emanación o ter- mine su turno en ella, la criatura deberá hacer una tirada de salvación de Sabiduría. Si la falla, recibirá 3d8 de daño radiante (si tu alineamiento es bueno o neutral) o 3d8 de daño necrótico (si tu alinea- miento es malvado). Si la supera, recibirá la mitad de daño. Una criatura solo hace esta tirada una vez por turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Estallido mágico", "lv": 0, "esc": "evocación", "cl": ["hechicero"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Lanzas energía mágica contra una criatura u objeto dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 1d8 de daño del tipo que elijas: ácido, frío, fuego, psíquico, relámpago, trueno o veneno. Si sacas un 8 en un d8 con este conjuro, puedes tirar otro d8 y sumarlo al daño. Cuando lances este conjuro, la cantidad máxima de d8 que puedes sumar al daño del conjuro es igual a tu modificador por aptitud mágica. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Excursión etérea", "lv": 7, "esc": "Conjuración", "cl": ["bardo", "brujo", "clérigo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Hasta 8 horas¶Entras en las regiones fronterizas del Plano Etéreo, donde se superpone con tu plano actual. Perma- neces en la Frontera Etérea hasta que termine el conjuro. Durante este tiempo, puedes moverte en cualquier dirección. Si te mueves hacia arriba o ha- cia abajo, cada metro de movimiento te cuesta 1 m adicional. Puedes percibir el plano del que vienes, que se mostrará gris, y no puedes ver más allá de 18 m. Mientras estés en el Plano Etéreo, solo puedes afectar y ser afectado por criaturas, objetos y efec- tos que haya en dicho plano. Las criaturas que no estén en él no podrán percibirte o interactuar con- tigo a menos que un rasgo les otorgue la capacidad de hacerlo. Cuando el conjuro termine, reaparecerás en el plano del que viniste en el mismo sitio que se corresponde con tu espacio en la Frontera Etérea. Si apareces en un espacio ocupado, te desplazarás al espacio sin ocupar más cercano y recibirás 2 de daño de fuerza por cada 30 cm que te hayas movido. Este conjuro termina al instante si lo lanzas mientras estás en el Plano Etéreo o en un plano que no tenga frontera con él, como alguno de los Planos Exteriores. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a hasta tres criaturas volun- tarias (incluyéndote a ti) por cada nivel por encima de 7 que tenga el espacio. Estas criaturas deben estar a 3 m o menos de ti cuando lances el conjuro."}, {"n": "Explosión solar", "lv": 8, "esc": "Evocación", "cl": ["clérigo", "druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (un trozo de heliolita) Duración: Instantáneo¶Una esfera de 18 m de radio centrada en un punto de tu elección dentro del alcance resplandece con una brillante luz solar. Todas las criaturas situadas en la esfera hacen una tirada de salvación de Cons- titución. Si la fallan, recibirán 12d6 daño radiante y tendrán el estado de cegadas durante 1 minuto. Si la superan, recibirán solo la mitad de daño. Una criatura cegada por este conjuro realiza una tirada de salvación de Constitución al final de cada uno de sus turnos y, si tiene éxito, se librará del efecto. Este conjuro dispersa la oscuridad que haya en la zona y que fuera creada por un conjuro."}, {"n": "Fabricar", "lv": 4, "esc": "Transmutación", "cl": ["mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: 36 m¶Componentes: V, S Duración: Instantáneo¶Conviertes materias primas en productos del mismo material. Por ejemplo, puedes fabricar un puente de madera a partir de unos árboles, una cuerda con un trozo de cáñamo o prendas usando lino o lana. Elige materias primas que puedas ver dentro del alcance. Puedes fabricar un objeto Grande o más pequeño (que quepa en un cubo de 3 m de lado u ocho cubos conectados de 1,5 m de lado), siempre y cuando tengas suficiente material. Sin embargo, si trabajas con metal, piedra u otra sustancia mineral, el objeto fabricado no puede ser mayor que Mediano (y debe caber en un cubo de 1,5 m de lado). La cali- dad de los objetos fabricados depende de la calidad de los materiales. No se pueden crear criaturas ni objetos mágicos con este conjuro, y tampoco puedes usarlo para crear objetos que requieran un alto grado de habili- dad, como armas o armaduras, a menos que tengas competencia en el tipo de herramientas de artesano usadas para elaborar esos objetos."}, {"n": "Falsa vida", "lv": 1, "esc": "Nigromancia", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una gota de alcohol) Duración: Instantáneo¶Obtienes 2d4 + 4 puntos de golpe temporales. Con un espacio de conjuro de nivel superior. Ob- tienes 5 puntos de golpe temporales adicionales por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Favor divino", "lv": 1, "esc": "Transmutación", "cl": ["paladín"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V, S Duración: 1 minuto¶Hasta que el conjuro termine, tus ataques con armas infligen 1d4 de daño radiante adicional si aciertan."}, {"n": "Festín de héroes", "lv": 6, "esc": "Conjuración", "cl": ["bardo", "clérigo", "druida"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: Lanzador Componentes: V, S, M (un cuenco incrustado de gemas que valga al menos 1000 po y que se consume como parte del conjuro) Duración: Instantáneo¶Conjuras un festín que aparece sobre una superficie en un cubo de 3 m de lado sin ocupar junto a ti. Se tarda 1 hora en consumirlo, desaparece al final de¶ese tiempo y sus efectos beneficiosos no se aplican hasta que concluye dicha hora. En el festín pueden participar hasta doce criaturas. Una criatura que participe obtiene varios bene- ficios que durarán 24 horas. Esa criatura tendrá resistencia al daño de veneno e inmunidad a los estados de asustada y envenenada. Además, sus puntos de golpe máximos aumentan en 2d10 y recu- pera la misma cantidad de puntos de golpe."}, {"n": "Flecha ácida", "lv": 2, "esc": "Evocación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (ruibarbo en polvo) Duración: Instantáneo¶Una brillante flecha verde sale disparada hacia un objetivo dentro del alcance y estalla en una lluvia de ácido. Haz un ataque de conjuro a distancia con- tra el objetivo. Si acierta, el objetivo recibe 4d4 de daño de ácido y 2d4 de daño de ácido al final de su siguiente turno. Si falla, la flecha salpica al objetivo con ácido y solo le causa la mitad del daño inicial. Con un espacio de conjuro de nivel superior. El daño (tanto el inicial como el posterior) aumenta en 1d4 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Forma gaseosa", "lv": 3, "esc": "Transmutación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un poco de gasa) Duración: Concentración, hasta 1 hora¶Una criatura voluntaria a la que toques cambia de forma, junto con todo lo que lleve o vista, y se con- vierte en una niebla fina hasta que termine el conju- ro. El conjuro termina para el objetivo si sus puntos de golpe se reducen a 0 o si emplea una acción de magia para ponerle fin. Mientras está en esta forma, el único método de movimiento del objetivo es una velocidad volando de 3 m, y podrá levitar y entrar en el espacio de otra criatura y ocuparlo. El objetivo tiene resistencia al daño contundente, cortante y perforante, inmuni- dad al estado de derribado y ventaja en las tiradas de salvación de Fuerza, Destreza y Constitución. El objetivo puede atravesar aberturas estrechas, pero trata los líquidos como si fueran superficies sólidas. El objetivo no puede hablar ni manipular objetos y no puede soltar, usar ni interactuar de ninguna otra forma con cualquier objeto que llevara o sos- tuviera. Por último, el objetivo no puede atacar ni lanzar conjuros.¶Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Fuego feérico", "lv": 1, "esc": "Evocación", "cl": ["bardo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Concentración, hasta 1 minuto¶El conjuro ilumina con luz azul, verde o violeta, a tu elección, el contorno de los objetos en un cubo de 6 m de lado dentro del alcance. También se ilumina el contorno de cualquier criatura dentro del cubo que falle una tirada de salvación de Destreza. Hasta que termine el conjuro, los objetos y criaturas afec- tados emitirán luz tenue en un radio de 3 m y no po- drán beneficiarse del estado de invisibles. Las tiradas de ataque contra las criaturas u obje- tos afectados tendrán ventaja si el atacante puede verlos."}, {"n": "Fuerza fantasmal", "lv": 2, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un poco de vellón) Duración: Concentración, hasta 1 minuto¶Intentas crear una ilusión en la mente de una cria- tura que puedas ver dentro del alcance. El objetivo hace una tirada de salvación de Inteligencia. Si la falla, creas un objeto o una criatura fantasmal u otro fenómeno cuyas dimensiones no excedan las de un cubo de 3 m de lado y que solo puede percibir el objetivo hasta que el conjuro termine. El fantasma puede emitir sonidos, alterar la temperatura y pro- ducir otros estímulos. El objetivo puede usar una acción de estudiar para examinar la imagen con una prueba de Inteligencia (Investigación) contra tu CD de salvación de conju- ros. Si la supera, se da cuenta de que el fantasma es una ilusión y el conjuro termina. Mientras esté afectado por este conjuro, el obje- tivo tratará al fantasma como si fuera real y racio- nalizará cualquier resultado ilógico derivado de interactuar con él. Por ejemplo, si el objetivo intenta caminar por un puente ilusorio y sobrevive a la caída, creerá que el puente existe y que otra cosa ha provocado su caída. Un objetivo afectado incluso puede recibir daño de la ilusión si el fantasma se muestra como una amenaza o una criatura peligrosa. En cada uno de tus turnos, la forma fantasmal puede causar 2d8 de daño psíquico al objetivo si está en el área que ocu- pa el fantasma o a 1,5 m de él. El objetivo percibe el daño como de un tipo apropiado para la ilusión."}, {"n": "Fundirse con la piedra", "lv": 3, "esc": "Transmutación", "cl": ["clérigo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: Toque Componentes: V, S Duración: 8 horas¶Entras en un objeto o una superficie de piedra lo suficientemente grande como para que tu cuerpo quepa dentro y tanto tú como tu equipo os fundís con la piedra hasta que termine el conjuro. Para ello, debes tocar la piedra. No queda nada de tu presencia visible ni que se pueda detectar mediante sentidos que no sean mágicos. Mientras estés fundido con la piedra, no puedes ver lo que sucede fuera y tienes desventaja en las pruebas de Sabiduría (Percepción) que hagas para escuchar sonidos en el exterior. Eres consciente del paso del tiempo y puedes lanzar conjuros sobre ti. Puedes usar 1,5 m de tu movimiento para salir de la piedra por el punto en el que entraste, lo que pone fin al conjuro. Por lo demás, no te puedes mover. Un daño físico menor hecho a la piedra no te afecta, pero su destrucción parcial o un cambio en su forma (de manera que ya no quepas en ella) te ex- pulsa y te causa 6d6 de daño de fuerza. La destruc- ción completa de la piedra (o su transmutación en una sustancia distinta) te expulsa de ella y te inflige 50 de daño de fuerza. Si eres expulsado, te mueves al espacio sin ocupar más cercano junto al punto en el que entraste en ella y tendrás el estado de derribado."}, {"n": "Geas", "lv": 5, "esc": "Encantamiento", "cl": ["bardo", "clérigo", "druida", "mago", "paladín"], "t": "mago, paladín) Tiempo de lanzamiento: 1 minuto Alcance: 18 m Componentes: V Duración: 30 días¶Das una orden verbal a una criatura que puedas ver dentro del alcance y la obligas a llevar a cabo un co- metido o le impides realizar una acción o actividad, según desees. El objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de he- chizado hasta que termine el conjuro. El objetivo la superará automáticamente si no entiende la orden. Mientras esté hechizada, la criatura sufre 5d10 de daño psíquico si actúa de manera contraria a tus instrucciones, y solo podrá recibir este daño una vez al día. Puedes dar cualquier orden que quieras, siempre que no sea una actividad que suponga una muerte segura. Si das una orden suicida, el conjuro termina. Un conjuro deseo, levantar maldición o restablecimiento mayor también pone fin a este conjuro.¶Con un espacio de conjuro de nivel superior. Si usas un espacio de niveles 7 u 8, la duración será de 365 días. Si usas un espacio de nivel 9, el conjuro durará hasta que se le ponga fin mediante uno de los conjuros mencionados anteriormente."}, {"n": "Glifo custodio", "lv": 3, "esc": "Abjuración", "cl": ["bardo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (diamante en polvo que valga al menos 200 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado o se active¶Inscribes un glifo que liberará posteriormente un efecto mágico. Puedes hacerlo en una superfi- cie (como una mesa o un trozo de un suelo) o en un objeto que se pueda cerrar (como un libro o un cofre) para ocultar dicho glifo. Este puede abarcar una zona de hasta 3 m de diámetro. Si la superficie o el objeto se mueven más de 3 m respecto al lugar donde lanzaste el conjuro, el glifo se romperá y el conjuro terminará sin activarse. El glifo es casi imperceptible y es necesario su- perar una prueba de Sabiduría (Percepción) contra tu CD de salvación de conjuros para detectarlo. Cuando inscribes el glifo, decides qué lo activa y eliges si se trata de una runa explosiva o un glifo de conjuro, como se explica a continuación. Establecer el activador. Cuando lances el conjuro, decide qué activará el glifo. En el caso de los glifos inscritos en una superficie, las condiciones que suelen activarlos incluyen tocarlos o situarse sobre ellos, quitar otro objeto que los cubra o acercarse a cierta distancia de ellos. En el caso de los glifos inscritos en un objeto, suelen activarse al abrir el objeto o mirar el glifo. En cuanto un glifo se activa, este conjuro termina. Puedes especificar aún más la condición, de modo que solo las criaturas de ciertos tipos puedan acti- varlo (por ejemplo, que solo afecte a las aberracio- nes). También puedes establecer excepc
