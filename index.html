y lisa. Las estructuras fabricadas, el equipo y las criaturas en la zona no cambian. Las características táctiles del terreno no cam- bian, por lo que es probable que las criaturas que entren en la zona descubran que es una ilusión. Si la diferencia no es obvia al tacto, cualquier criatura que examine la ilusión puede usar una acción de estudiar y hacer una prueba de Inteli- gencia (Investigación) contra tu CD de salvación de conjuros para distinguirla. Si la criatura percibe que es una ilusión, la verá como una imagen difusa y superpuesta al terreno de verdad."}, {"n": "Terror", "lv": 3, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una pluma blanca) Duración: Concentración, hasta 1 minuto¶Todas las criaturas situadas en un cono de 9 m deberán superar una tirada de salvación de Sabidu- ría o soltarán cualquier cosa que tengan agarrada y tendrán el estado de asustadas hasta que termine el conjuro. Una criatura asustada realizará la acción de correr en todos sus turnos para alejarse de ti por la ruta más segura, a menos que no haya por dónde huir. Si la criatura acaba su turno en un espacio des- de el que no tenga línea de visión directa de ti, hará una tirada de salvación de Sabiduría. Si la supera, el conjuro terminará para ella."}, {"n": "Terror abyecto", "lv": 9, "esc": "Ilusionismo", "cl": ["brujo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Intentas crear horrores ilusorios en las mentes de otros. Todas las criaturas de tu elección situadas en una esfera de 9 m de radio centrada en un punto dentro del alcance realizan una tirada de salvación de Sabiduría. Si la fallan, los objetivos sufrirán 10d10 de daño psíquico y tendrán el estado de asus- tados hasta que el conjuro termine. Si la superan, solamente recibirán la mitad de ese daño. Un objetivo asustado hará una tirada de salva- ción de Sabiduría al final de cada uno de sus tur- nos. Si la falla, sufrirá 5d10 de daño psíquico. Si la supera, el conjuro terminará para ese objetivo."}, {"n": "Texto ilusorio", "lv": 1, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Toque Componentes: S, M (tinta que valga al menos 10 po, que se consume como parte del conjuro) Duración: 10 días¶Escribes en pergamino, papel u otro material adecuado y lo impregnas con una ilusión hasta que termine el conjuro. Para ti y las demás criaturas que designes cuando lanzas el conjuro, el texto parece normal, escrito con tu letra, y transmite el significado que pretendieras al escribirlo. Para los demás, el texto parece escrito en letra mágica o desconocida y es ininteligible. Como alternativa, la ilusión puede modificar el significado, la caligrafía y el idioma de un texto, aunque el idioma debe ser uno que conozcas. Si el conjuro se disipa, desaparecerán tanto el es- crito original como la ilusión. Una criatura con visión verdadera puede leer el mensaje oculto."}, {"n": "Toque helado", "lv": 0, "esc": "nigromancia", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Instantáneo¶Canalizas un frío sepulcral y haces un ataque de conjuro cuerpo a cuerpo contra un objetivo dentro del alcance. Si acierta, el objetivo recibirá 1d10 de daño necrótico y no podrá recuperar puntos de golpe hasta el final de tu siguiente turno. Mejora de truco. El daño aumenta en 1d10 cuando alcanzas los niveles 5 (2d10), 11 (3d10) y 17 (4d10)."}, {"n": "Toque vampírico", "lv": 3, "esc": "Nigromancia", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 1 minuto¶El toque de tu mano envuelta en sombras puede absorber la fuerza vital de otros para curar tus heridas. Haz un ataque de conjuro cuerpo a cuerpo contra una criatura dentro del alcance. Si acierta, el objetivo sufrirá 3d6 de daño necrótico y tú recu- perarás una cantidad de puntos de golpe igual a la mitad del daño necrótico infligido. Hasta que el conjuro termine, podrás realizar el ataque otra vez como acción de magia en cada uno de tus turnos y hacer objetivo a la misma cria- tura o a otra distinta. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Tormenta de aguanieve", "lv": 3, "esc": "Conjuración", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (un paraguas en miniatura) Duración: Concentración, hasta 1 minuto¶Hasta que el conjuro termine, caerá aguanieve en un cilindro de 12 m de alto y 6 m de radio centrado en un punto que elijas dentro del alcance. La zona está muy oscura y las llamas desprotegidas que haya en ella se apagan. El suelo abarcado en el cilindro es terreno difícil. Cuando una criatura entre en el cilindro por pri- mera vez en un turno o comience su turno en él, deberá superar una tirada de salvación de Destreza o tendrá el estado de derribada y perderá la concen- tración."}, {"n": "Tormenta de fuego", "lv": 7, "esc": "Evocación", "cl": ["clérigo", "druida", "hechicero"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S Duración: Instantáneo¶Una tormenta de llamas aparece dentro del alcance. El área de la tormenta consta de hasta diez cubos de 3 m de lado que puedes disponer según desees, cada uno de los cuales debe estar adyacente al menos a otro. Todas las criaturas situadas en la zona de 4,5 m deberán realizar una tirada de salvación de Destreza; sufrirán 7d10 de daño de fuego si la fallan o la mitad del daño si la superan. Los objetos inflamables dentro del área que no lleve o vista nadie empezarán a arder."}, {"n": "Tormenta de hielo", "lv": 4, "esc": "Evocación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 90 m Componentes: V, S, M (una manopla) Duración: Instantáneo¶Una granizada cae en un cilindro de 6 m de radio y 12 m de altura centrado en un punto dentro del alcance. Todas las criaturas situadas en el cilindro hacen una tirada de salvación de Destreza; sufrirán 2d10 de daño contundente y 4d6 de daño de frío si la fallan o la mitad del daño si la superan. Las bolas de granizo convierten el suelo del cilin- dro en terreno difícil hasta el final de tu siguiente turno. Con un espacio de conjuro de nivel superior. El daño contundente aumenta en 1d10 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Tormenta de la venganza", "lv": 9, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 1,5 km Componentes: V, S Duración: Concentración, hasta 1 minuto¶Hasta que termine el conjuro, una nube de tormenta se forma centrada en un punto dentro del alcance y se extiende hasta un radio de 90 m. Todas las criaturas que estén debajo de ella cuando aparezca deberán superar una tirada de salvación de Consti- tución o sufrirán 2d6 de daño de trueno y tendrán el estado de ensordecidas hasta que el conjuro termine. Al principio de cada uno de tus siguientes turnos, la tormenta produce efectos diferentes, como se detalla a continuación. Turno 2. Cae una lluvia ácida. Todas las criaturas y objetos que estén debajo de la nube sufrirán 4d6 de daño de ácido. Turno 3. Invocas seis relámpagos que surgen de la nube para golpear a seis criaturas u objetos distintos bajo ella. Cada objetivo hace una tirada de salvación de Destreza; sufrirá 10d6 de daño de relámpago si la falla o la mitad del daño si la supera. Turno 4. Caen bolas de granizo. Todas las cria- turas que estén debajo de la nube sufrirán 2d6 de daño contundente. Turnos 5 a 10. La zona bajo la nube se ve asolada por vendavales y aguanieve. Todas las criaturas que estén allí sufren 1d6 de daño de frío. Hasta que el conjuro termine, la zona es terreno difícil y está muy oscura. Además, es imposible hacer ataques con armas a distancia, ya que un fuerte viento sopla en toda la zona."}, {"n": "Tormenta de meteoritos", "lv": 9, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 1,5 km Componentes: V, S Duración: Instantáneo¶Unos orbes de fuego abrasador caen en picado en cuatro puntos del suelo distintos que puedas ver dentro del alcance. Todas las criaturas situadas en una esfera de 12 m de radio centrada en cada uno de esos puntos hacen una tirada de salvación de Destreza. Sufrirán 20d6 de daño de fuego y 20d6 de daño contundente si la fallan o la mitad del daño si la superan. Las criaturas que estén situadas en el área de efecto de más de una de las esferas ardien- tes solo se verán afectadas por una. Los objetos no mágicos que se encuentren dentro del área del conjuro también recibirán el daño, salvo si los lleva o viste una criatura, y empezarán a arder si son inflamables."}, {"n": "Trepar cual arácnido", "lv": 2, "esc": "Transmutación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una gota de betún y una araña) Duración: Concentración, hasta 1 hora¶Hasta que el conjuro termine, una criatura volun- taria a la que toques gana la capacidad de moverse hacia arriba, hacia abajo y de lado por superficies verticales, así como por techos. Esta manera de mo- verse no requiere del uso de las manos, que quedan libres. Además, el objetivo obtiene una velocidad trepando igual a su velocidad. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Truco de la cuerda", "lv": 2, "esc": "Transmutación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un trozo de cuerda) Duración: 1 hora¶Tocas una cuerda, lo que hace que uno de sus extre- mos flote hacia arriba hasta que la cuerda se ponga perpendicular al suelo o toque un techo. En el extre- mo superior de la cuerda se abre un portal invisible de 0,9 m por 1,5 m, el cual conduce a un espacio extradimensional que dura hasta que el conjuro termine. Este espacio puede alcanzarse trepando por la cuerda, que puede recogerse o soltarse desde el interior. En el espacio caben hasta ocho criaturas Media- nas o más pequeñas. Los ataques, conjuros y otros efectos no pueden cruzar el espacio en ningún sentido, pero las criaturas que están dentro pueden ver a través del portal. Todo lo que esté dentro del espacio caerá fuera cuando el conjuro termine."}, {"n": "Tsunami", "lv": 8, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 1,5 km Componentes: V, S Duración: Concentración, hasta 6 asaltos¶Un muro de agua surge de la nada en un punto de tu elección dentro del alcance. Puedes hacerlo de hasta 90 m de longitud, 90 m de alto y 15 m de grosor y durará hasta que termine el conjuro. Cuando aparezca el muro, todas las criaturas situadas en su área hacen una tirada de salvación de Fuerza; sufrirán 6d10 de daño contundente si la fallan o la mitad de daño si la superan. Al principio de cada uno de tus turnos tras la aparición del muro, se alejará 15 m de ti junto con todas las criaturas que haya en su interior. Cual- quier criatura Enorme o más pequeña dentro del muro, o a cuyo espacio entre el muro cuando este se mueva, deberá superar una tirada de salvación de Fuerza o sufrirá 5d10 de daño contundente. Una criatura solo puede sufrir este daño una vez por asalto. Al final del turno, la altura del muro se reduce en 15 m y el daño que causa el muro en asaltos subsiguientes se reduce en 1d10. Cuando el muro llegue a 0 m de altura, el conjuro termina. Una criatura atrapada en el muro puede moverse nadando. Sin embargo, debido a la fuerza de la ola, la criatura deberá superar una prueba de Fuerza (Atletismo) contra tu CD de salvación de conjuros para moverse. Si no la supera, no podrá hacerlo. Una criatura que salga del muro caerá al suelo."}, {"n": "Urna mágica", "lv": 6, "esc": "Nigromancia", "cl": ["mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Lanzador Componentes: V, S, M (una gema, un cristal o un relicario que valga al menos 500 po) Duración: Hasta que sea disipado¶Tu cuerpo entra en estado catatónico y tu alma lo abandona y entra en el recipiente que has usado como componente material del conjuro. Mientras tu alma esté dentro del recipiente, serás consciente de lo que te rodea, igual que si estuvieras en el espacio de dicho recipiente. No podrás moverte ni llevar a cabo reacciones. La única acción que puedes reali- zar es proyectar tu alma hasta 30 m del recipiente, bien para regresar a tu cuerpo viviente (y poner fin al conjuro) o bien para tratar de poseer el cuerpo de un humanoide. Puedes intentar poseer a cualquier humanoide que esté a 30 m o menos de ti que puedas ver (las criaturas protegidas mediante un conjuro círculo mágico o protección contra el bien y el mal no pueden ser poseídas). El objetivo hace una tirada de salva-¶ción de Carisma. Si la falla, tu alma se introducirá en el cuerpo del objetivo y la suya quedará atrapada en el recipiente. Si la supera, resistirá tus esfuerzos por poseerlo y no podrás volver a intentarlo durante 24 horas. En cuanto posees el cuerpo de una criatura, lo controlas. Tus puntos de golpe, dados de puntos de golpe, Fuerza, Destreza, Constitución, velocidad y sentidos se sustituyen por los de la criatura. Por lo demás, conservas tu perfil. Por su parte, el alma de la criatura poseída puede percibir desde el recipiente usando sus propios sentidos, pero no puede moverse y tiene el estado de incapacitada. Mientras posees un cuerpo, puedes usar una acción de magia para volver del cuerpo anfitrión al recipiente si está a 30 m o menos de ti, lo que hace que el alma de la criatura anfitriona regrese a su propio cuerpo. Si el cuerpo anfitrión muere mien- tras estás en él, la criatura muere y tú debes hacer una tirada de salvación de Carisma contra tu propia CD de salvación de conjuros. Si la superas, volverás al recipiente si está a 30 m o menos de ti. De lo con- trario, morirás. Si el recipiente es destruido o el conjuro termina, tu alma volverá a tu cuerpo. Si tu cuerpo está a más de 30 m de ti o está muerto, morirás. Si el alma de otra criatura está en el recipiente cuando es destruido, esa alma volverá a su cuerpo, siempre y cuando esté vivo y a 30 m o menos de ella. De lo contrario, esa criatura morirá. Cuando el conjuro termine, el recipiente se des- truirá."}, {"n": "Ver invisibilidad", "lv": 2, "esc": "Adivinación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una pizca de talco) Duración: 1 hora¶Hasta que termine el conjuro, ves a las criaturas y objetos que tengan el estado de invisibles como si fueran visibles y puedes ver en el Plano Etéreo. Las criaturas y objetos que haya en él tendrán un aspecto fantasmal."}, {"n": "Viajar con el viento", "lv": 6, "esc": "Transmutación", "cl": ["druida"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 9 m Componentes: V, S, M (una vela) Duración: 8 horas¶Tú y hasta diez criaturas voluntarias que elijas den- tro del alcance asumís formas gaseosas hasta que termine el conjuro y tenéis la apariencia de jirones de nubes. En esta forma de nube, un objetivo tiene¶una velocidad volando de 90 m, puede levitar, tiene inmunidad al estado de derribado y resistencia al daño contundente, cortante y perforante. Las únicas acciones que puede realizar un objetivo en esta forma son la acción de correr o una acción de magia para empezar a volver a su forma normal. Recu- perarla lleva 1 minuto, durante el cual el objetivo tendrá el estado de aturdido. Hasta que el conjuro termine, el objetivo puede volver a la forma de nube, lo que también requiere una acción de magia seguida de una transformación de 1 minuto. Si un objetivo se encuentra en forma de nube y volando cuando el efecto termina, desciende 18 m por asalto durante 1 minuto hasta aterrizar, lo que hace sin ningún peligro. Si transcurrido ese minuto no ha aterrizado, caerá la distancia restante."}, {"n": "Viajar mediante plantas", "lv": 6, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 3 m Componentes: V, S Duración: 1 minuto¶Este conjuro crea un vínculo mágico entre una planta inanimada de tamaño Grande o mayor den- tro del alcance y otra planta a cualquier distancia en el mismo plano de existencia. Tienes que haber visto o tocado la planta de destino al menos una vez antes. Hasta que termine el conjuro, cualquier cria- tura puede entrar en la planta objetivo y salir por la de destino gastando 1,5 m de movimiento."}, {"n": "Vínculo protector", "lv": 2, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un par de anillos de platino que valgan al menos 50 po cada uno y que debéis llevar puestos tanto tú como el objetivo hasta que termine el conjuro) Duración: 1 hora¶Tocas a otra criatura voluntaria y creas una cone- xión mística entre ella y tú hasta que el conjuro ter- mine. Mientras el objetivo esté a 18 m o menos de ti, obtiene un bonificador de +1 a la CA y a las tiradas de salvación, así como resistencia a todo el daño. Sin embargo, cada vez que reciba daño, tú sufrirás la misma cantidad de daño. El conjuro termina si tus puntos de golpe se redu- cen a 0 o si el objetivo y tú os separáis más de 18 m. También termina si se lanza otra vez sobre cual- quiera de las dos criaturas conectadas.¶Visión en la oscuridad¶Zancada prodigiosa¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una zanahoria seca) Duración: 8 horas¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una pizca de tierra) Duración: 1 hora¶Hasta que el conjuro termine, una criatura volun- taria a la que toques tendrá visión en la oscuridad hasta 45 m.¶Tocas a una criatura y su velocidad aumenta en 3 m hasta que el conjuro termine. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por"}, {"n": "Visión veraz", "lv": 6, "esc": "Adivinación", "cl": ["bardo", "brujo", "clérigo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (hongos pulverizados que valgan al menos 25 po, que se consumen como parte del conjuro) Duración: 1 hora¶Hasta que el conjuro termine, la criatura voluntaria a la que toques tendrá visión verdadera hasta 36 m."}, {"n": "Volar", "lv": 3, "esc": "Transmutación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una pluma) Duración: Concentración, hasta 10 minutos¶Tocas a una criatura voluntaria. Hasta que el con- juro termine, el objetivo consigue una velocidad volando de 18 m y puede levitar. Cuando el conjuro termine, el objetivo caerá si aún está en el aire, excepto si puede detener la caída. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Voluta estelar", "lv": 0, "esc": "evocación", "cl": ["bardo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Lanzas una mota de luz contra una criatura u objeto dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibirá 1d8 de daño radiante y, hasta el final de tu siguiente turno, emitirá luz tenue en un radio de 3 m y no podrá beneficiarse del estado de invisible. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Zona de la verdad", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: 10 minutos¶Creas una zona mágica que protege contra el engaño en una esfera de 4,5 m de radio centrada en un punto dentro del alcance. Hasta que el conjuro termine, una criatura que entre en la zona del conjuro por primera vez en un turno o comience su turno allí realizará una tirada de salvación de Carisma. Si la falla, no podrá decir una mentira voluntariamente mientras esté en el radio del conjuro. Sabrás si una criatura supera o falla esta tirada. Una criatura afectada es consciente del conjuro y puede evitar responder a preguntas a las que normalmente respondería con una mentira. Dicha criatura puede dar respuestas evasivas, pero deberá ser sincera."}];

const PF=[[2,'Moxie','Puntos = tabla de nivel. Se recuperan en descanso corto o largo. Conoces Brace Up, The Old One-Two y Stick and Move.'],[2,'Street Smart','Parrandear/sparring cuentan como actividad ligera al descansar; conoces la ciudad tras 8 h de juerga.'],[3,'Bloodied but Unbowed','Reacción al quedar a la mitad de PG o menos: PG temporales = nivel + CON y recuperas todo el Moxie. Una vez por descanso.'],[4,'Dig Deep','Acción adicional: resistencia a contundente/perforante/cortante 1 min; después 1 nivel de agotamiento.'],[5,'Extra Attack','Atacas dos veces con la acción Atacar.'],[5,'Haymaker','Ataques con desventaja este turno, pero el daño de armas pugilistas/desarmado usa el dado al máximo.'],[6,'Moxie-Fueled Fists','Tus golpes desarmados cuentan como mágicos.'],[7,'Fancy Footwork','Competencia en salvaciones de DES.'],[7,'Shake It Off','Acción: termina un efecto de hechizado o asustado sobre ti.'],[9,'Down but Not Out','Con Bloodied but Unbowed: suma tu competencia al daño 1 min. Una vez por descanso largo.'],[10,'School of Hard Knocks','Resistencia psíquica; ventaja contra aturdido/inconsciente.'],[13,'Rabble Rouser','Ventaja en Persuasión/Intimidación con la gente del lugar tras juerga.'],[14,'Unbreakable','Ventaja en salvaciones FUE/DES/CON; gasta 1 Moxie para repetir una salvación fallida.'],[15,'Herculean','Capacidad de carga x2; daño x2 a objetos inanimados.'],[18,'Fighting Spirit','A 0 PG (≤4 agotamiento): recuperas mitad de PG y de Moxie, +1 agotamiento. Descanso largo.'],[20,'Peak Physical Condition','FUE y CON +2 (máx. 22); descanso largo recupera 2 agotamientos y todos los dados de golpe.']];

function spellCatalog(){return [...SP.map((s,i)=>({...s,...(S.spellEdits['core:'+i]||{}),key:'core:'+i,base:true})),...S.customSpells.map((s,i)=>({...s,...(S.spellEdits['custom:'+s.id]||{}),key:'custom:'+s.id,base:false}))]}

const meta=s=>{const head=s.t.split('¶')[0]||'';const get=(a,b)=>{let m=head.match(new RegExp(a+'\\s*:?\\s*(.*?)\\s+(?='+b+')','i'));return m?m[1].trim():''};return {time:get('Tiempo de lanzamiento','Alcance'),range:get('Alcance','Componentes'),components:get('Componentes','Duración'),duration:((head.match(/Duración\s*:\s*(.*)/i)||[])[1]||'').trim(),ritual:/\britual\b/i.test(head.slice(0,200)),concentration:/concentraci[oó]n/i.test(head.slice(0,250))}}
function spellLimits(s){const m=meta(s),base=+s.lv>0;const a=[`Si no conoces o no tienes preparado «${s.n}» (salvo una excepción de tu clase, objeto o rasgo), no puedes elegirlo para lanzarlo.`];if(base)a.push('Si no tienes una ranura de nivel suficiente o una alternativa válida (p. ej., un ritual permitido), no puedes lanzar su versión que consume ranura.');else a.push('Si no tienes acceso a este truco mediante tu clase, rasgo u otra fuente, no puedes utilizarlo, aunque no consuma ranuras.');const co=m.components.toUpperCase();if(co.includes('V'))a.push('Si no puedes pronunciar sus componentes verbales (por ejemplo, por un efecto de silencio), no puedes lanzarlo de la forma habitual.');else if(co.includes('S'))a.push('Si no puedes realizar sus gestos somáticos con una mano válida, no puedes lanzarlo de la forma habitual.');else if(co.includes('M'))a.push('Si te falta el componente material requerido o un sustituto permitido, no puedes lanzarlo.');else a.push('Si una regla te impide lanzar conjuros (por ejemplo, la restricción de un efecto o estado), no puedes activarlo.');
let t=m.time.toLowerCase();if(t.includes('reacci'))a.push('Sin la reacción disponible o sin el desencadenante exigido por el conjuro, no puedes lanzarlo.');else if(t.includes('adicional'))a.push('Si ya utilizaste tu acción adicional ese turno, no puedes lanzarlo con esa acción.');else if(t.includes('minuto')||t.includes('hora'))a.push('Si no puedes dedicar el tiempo completo de lanzamiento indicado ('+(m.time||'ver descripción')+'), no llegas a completarlo.');else a.push('Si no dispones de la acción correspondiente en este momento, no puedes lanzarlo.');
const r=m.range.toLowerCase();if(r.includes('toque'))a.push('Si el objetivo necesita ser tocado y está fuera de tu alcance físico, no puedes aplicárselo.');else if(r.includes('lanzador')||r.includes('personal'))a.push('Si eliges un objetivo externo en lugar del propio lanzador, no estás siguiendo el alcance indicado.');else if(r.includes('visión'))a.push('Si careces de línea de visión requerida o el lugar no está dentro del alcance indicado, la elección es inválida.');else a.push('Si el objetivo o punto elegido queda fuera de su alcance ('+(m.range||'consulta el texto')+') o tras cobertura total cuando la regla lo prohíbe, no es un objetivo válido.');return a.slice(0,5)}
function featureLimits(f){const text=(f.t||'').toLowerCase(),a=[];a.push(`Si no tienes el nivel ${f.lv} o la fuente que concede «${f.n}», no dispones de esta habilidad.`);if(f.cost){a.push(`Si quedan menos de ${f.cost} puntos Moxie u otro recurso exigido, no puedes activar este uso.`)}else if(/descanso/.test(text)){a.push('Si ya agotaste sus usos hasta el descanso que indica el rasgo, no puedes volver a activarlo.')}else a.push('Si una regla, transformación o condición te priva de ese rasgo, no puedes beneficiarte de él.');if(/reacci[oó]n/i.test(text))a.push('Si ya gastaste tu reacción este asalto, no puedes usar esta habilidad como reacción.');else if(/acci[oó]n adicional/i.test(text))a.push('Si ya gastaste la acción adicional del turno, no puedes activar el rasgo como acción adicional.');else if(/acci[oó]n/i.test(text))a.push('Si no puedes realizar la acción indicada en tu turno, no puedes activar el rasgo de esa manera.');else a.push('Si no ocurre el desencadenante o supuesto exacto indicado por la característica, no se aplica.');
if(/ataque|golpe|puñ|fisticuffs|one-two|haymaker|fists/i.test(f.n+' '+text))a.push('Si no estás realizando el ataque o golpe requerido por la descripción, su beneficio de ataque no se activa.');else if(/hechiz|conjur|magia/i.test(text))a.push('Si no posees el hechizo, objetivo o tipo de magia que exige el rasgo, no puedes aprovechar ese efecto.');else if(/pg|puntos de golpe|daño/.test(text))a.push('Si no se produce la pérdida de PG o el daño que lo desencadena, este efecto no se activa.');else a.push('Si la situación no cumple las condiciones específicas del texto, el beneficio no entra en juego.');a.push('Si estás incapacitado y el rasgo requiere realizar una acción o reacción, no puedes activarlo voluntariamente (los rasgos pasivos pueden seguir aplicándose).');return a.slice(0,5)}
function fiveEditor(type,key,arr){return `<div class="limit-box"><h4>5 situaciones en las que no se puede usar o no se aplica</h4><ol>${arr.map((x,i)=>`<li>${esc(x)}</li>`).join('')}</ol><p class="mut">Guía contextual, no cinco prohibiciones universales: manda la descripción y la decisión del DM. Puedes editar estos casos.</p></div>`}
function setSpellLimit(key,index,v){const spell=spellCatalog().find(x=>x.key===key);if(!spell)return;S.spellEdits[key]??={};const initial=Array.isArray(S.spellEdits[key].limits)&&S.spellEdits[key].limits.length===5?S.spellEdits[key].limits.slice():spellLimits(spell);initial[index]=v;S.spellEdits[key].limits=initial;save()}

function removeSpell(key){S.customSpells=S.customSpells.filter(s=>'custom:'+s.id!==key);delete S.spellEdits[key];delete S.prep[key];save();draw()}
function castSpell(key,selectedLevel,ritual){const s=spellCatalog().find(x=>x.key===key);if(!s)return false;if(!S.prep[key]&&!S.prep[s.n]){alert('Primero marca este conjuro como seleccionado o preparado.');return false}let row=null;let lv=+s.lv;if(lv&&!(ritual&&meta(s).ritual)){row=slotRows().find(r=>r.key===String(selectedLevel)&&r.lv>=lv&&(r.max-(+S.usedS[r.key]||0))>0);if(!row){alert('No tienes espacios disponibles de nivel suficiente.');return false}}const previous={usedS:{...S.usedS},spellCasts:{...S.spellCasts},concentration:S.concentration,clase:S.clase,spell:s.n,level:row?row.lv:0,ritual:!!ritual};if(row)S.usedS[row.key]=(+S.usedS[row.key]||0)+1;S.spellCasts[key]=(+S.spellCasts[key]||0)+1;if(meta(s).concentration)S.concentration=s.n;S.slotHistory.unshift(previous);S.slotHistory=S.slotHistory.slice(0,30);save();draw();return true}

function featureCatalog(){const bases=(CORE_FEATURES[S.clase]||[]).map(([lv,n,t],i)=>({id:`class:${S.clase}:${i}`,lv,n,t,source:S.clase==='Pugilista'?'Pugilist v3.x · terceros':S.clase==='Artífice'?'Artífice · fuera de SRD 5.2.1':'Resumen orientativo (SRD / reglas 2024)'}));if(S.clase==='Pugilista')for(const [n,lv,t,cost] of [['Brace Up',2,'Acción adicional: gasta 1 Moxie para obtener PG temporales según Fisticuffs + nivel + CON.',1],['The Old One-Two',2,'Tras la acción Atacar, gasta 1 Moxie y realiza dos golpes desarmados como acción adicional.',1],['Stick and Move',2,'Acción adicional y 1 Moxie para empujar a un adversario o realizar la acción Correr.',1]])bases.push({id:'mox:'+n,lv,n,t,cost,source:'Pugilist v3.x · terceros'});if(S.clase==='Pugilista'&&S.club&&CLUBS[S.club]){CLUBS[S.club].split(' · ').forEach((line,i)=>{const lv=+line.split(' ')[0]||3;bases.push({id:`club:${S.club}:${i}`,lv,n:line.replace(/^\d+\s*/,''),t:'Rasgo de Fight Club. El archivo original solo incluye el nombre o un resumen; añade aquí el texto de tu versión del suplemento antes de usarlo.',source:'Fight Club · resumen incompleto'})})}return [...bases,...S.customFeatures.map(f=>({...f,id:'user:'+f.id,source:'Personalizado'}))].map(f=>({...f,...(S.featureEdits[f.id]||{})})).sort((a,b)=>a.lv-b.lv||a.n.localeCompare(b.n,'es'))}

function removeFeature(id){S.customFeatures=S.customFeatures.filter(f=>'user:'+f.id!==id);delete S.featureEdits[id];save();draw()}
function featureCard(f){const limitation=Array.isArray(f.limits)&&f.limits.length===5?f.limits:featureLimits(f);return `<details class="sp"><summary><span class="spell-name">${esc(f.n)}</span><span class="tag">Nivel ${f.lv}</span><span class="mut">${esc(f.source)}</span></summary><p>${esc(f.t)}</p>${fiveEditor('feature',f.id,limitation)}<details class="editor"><summary>Editar habilidad y sus 5 casos</summary><div class="fields">${field('Nombre',f.n,`editFeature('${f.id}','n',this.value)`)}${field('Nivel',f.lv,`editFeature('${f.id}','lv',this.value)`,'number','min="1" max="20"')}</div><label class="field">Descripción completa<textarea onchange="editFeature('${f.id}','t',this.value)">${esc(f.t)}</textarea></label>${limitation.map((x,i)=>`<label class="field">Caso ${i+1}<textarea rows="2" onchange="setFeatureLimit('${f.id}',${i},this.value)">${esc(x)}</textarea></label>`).join('')}</div></details></details>`}
function rasgos(){const all=featureCatalog(),active=all.filter(f=>f.lv<=S.nivel);return `<div class="card"><div class="section-heading"><div><h2>Habilidades y rasgos</h2><p class="mut">${active.length} accesibles a nivel ${S.nivel} · ${all.length} en el catálogo de ${esc(S.clase)}. Descripciones de apoyo editables, no sustituyen el manual.</p></div><button onclick="newFeature()">+ Crear habilidad</button></div><label class="pick"><input type="checkbox" ${S.allFeatures?'checked':''} onchange="S.allFeatures=this.checked;save();draw()"> Ver también niveles futuros</label><p class="mut">Cada rasgo incluye cinco casos de uso imposible o no aplicable. Si un rasgo es pasivo, se interpretan como situaciones sin beneficio.</p></div><div class="card">${(S.allFeatures?all:active).map(featureCard).join('')||'<p>No hay rasgos disponibles todavía. Puedes añadirlos manualmente.</p>'}</div>`}
function diario(){return `<div class="card"><h2>Notas y trasfondo</h2><label class="field">Historia, equipo, dotes y condiciones especiales<textarea rows="10" onchange="S.notas=this.value;save()" placeholder="Escribe lo que necesites...">${esc(S.notas)}</textarea></label><div class="fields">${field('Oro',S.oro,"updateField('oro',+this.value||0)",'number')}${field('Plata',S.plata,"updateField('plata',+this.value||0)",'number')}${field('Cobre',S.cobre,"updateField('cobre',+this.value||0)",'number')}${field('Iniciativa adicional',S.iniciativaExtra,"updateField('iniciativaExtra',+this.value||0)",'number')}</div></div><div class="card"><h2>Fuentes y versiones</h2><p>La colección inicial de 319 hechizos es la incorporada en la hoja que compartiste. Los resúmenes de rasgos de clase son orientativos, y los textos editables pueden ampliarse con tus manuales.</p><p>Referencia de reglas abiertas: <a href="https://www.dndbeyond.com/srd" target="_blank" rel="noopener noreferrer">SRD v5.2.1 (CC BY 4.0)</a>. El <strong>Artífice</strong> no figura en ese SRD, y <strong>The Pugilist</strong> de Benjamin Huffman es contenido de terceros, no una clase oficial de Wizards of the Coast.</p><p><strong>Importante:</strong> las cinco restricciones por hechizo o rasgo son ayudas basadas en requisitos de activación; no todas se aplican en toda situación. Comprueba opciones como lanzamiento sin componentes, objetos mágicos, hechizos innatos, excepciones de clase y decisiones del DM.</p></div>`}

const COLS=8;
function fit(x,y,w,h,id){const T=total(),R=Math.ceil(T/COLS);if(x+w>COLS||y+h>R)return false;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const k=(y+j)*COLS+x+i;if(k>=T)return false;for(const p in S.placed){if(p==id)continue;const q=S.placed[p],it=S.items.find(z=>z.id==p);if(!it)continue;const[pw,ph]=q.r?[it.h,it.w]:[it.w,it.h];if(x+i>=q.x&&x+i<q.x+pw&&y+j>=q.y&&y+j<q.y+ph)return false}}return true}
function moch(){const T=total(),R=Math.ceil(T/COLS),used=S.items.reduce((a,i)=>a+(S.placed[i.id]?i.w*i.h:0),0);
const own={};for(const p in S.placed){const q=S.placed[p],it=S.items.find(z=>z.id==p);if(!it)continue;const[w,h]=q.r?[it.h,it.w]:[it.w,it.h];for(let j=0;j<h;j++)for(let i=0;i<w;i++)own[(q.y+j)*COLS+q.x+i]=[it,j==0&&i==0]}
let g='';for(let k=0;k<R*COLS;k++){const x=k%COLS,y=Math.floor(k/COLS),o=own[k];g+=k>=T?`<button class="c off"></button>`:o?`<button class="c it" style="background:${o[0].c}" title="${o[0].n}" onclick="rem(${o[0].id})">${o[1]?o[0].n.slice(0,6):''}</button>`:`<button class="c" onclick="put(${x},${y})"></button>`}
return `<div class="card"><h2>Mochila del aventurero</h2><p>Espacios totales <b>${CL[S.clase][0]}</b> · Mod. FUE <b>${fmt(md(S.ab[0]))}</b> · Bonificador <b>${fmt(bonus(md(S.ab[0])))}</b> · Disponibles <b class="${T-used<0?'bad':'ok'}">${T-used}</b> de ${T}</p>
<div class="grid" style="grid-template-columns:repeat(${COLS},34px)">${g}</div><p class="mut">Elige un objeto de abajo y toca una celda para colocarlo (esquina superior izquierda). Toca un objeto colocado para sacarlo.</p></div>
<div class="card"><h2>Objetos</h2><div class="row">${CAT.map(c=>`<button onclick="add('${c[0]}',${c[1]},${c[2]})">${c[0]} ${c[1]}×${c[2]}</button>`).join('')}</div><div class="row" style="margin-top:8px"><input id="nn" placeholder="Objeto propio"><input id="nw" type="number" value="1" min="1"><input id="nh" type="number" value="1" min="1"><button onclick="add(nn.value||'Objeto',+nw.value,+nh.value)">Añadir</button></div>
<div style="margin-top:8px">${S.items.map(i=>`<div class="row"><span style="background:${i.c};width:14px;height:14px;display:inline-block"></span><button class="${S.sel==i.id?'on':''}" onclick="S.sel=${i.id};save();draw()">${S.placed[i.id]?'✔':'○'} ${i.n} ${i.w}×${i.h}</button><button onclick="const name=prompt('Nuevo nombre del objeto',S.items.find(x=>x.id===${i.id}).n);if(name!==null){S.items.find(x=>x.id===${i.id}).n=name;save();draw()}">Renombrar</button><button onclick="rot(${i.id})">Rotar</button><button onclick="del(${i.id})">✕</button></div>`).join('')}</div></div>`}
const CAT=[['Poción',1,1],['Pergamino',1,1],['Antorcha',2,1],['Flechas',1,1],['Raciones',1,1],['Cuerda',2,1],['Kit herram.',2,2],['Libro hechizos',2,2],['Escudo',2,2],['Espada larga',3,1],['Lanza',3,1],['Arco largo',3,1],['Armadura media',2,3],['Ballesta pesada',2,3]];
const COL=['#4a6fa5','#6b4a9a','#a33','#8a7a1e','#3d7a4a','#8a5a2a','#2e8a8a'];
function add(n,w,h){S.items.push({id:Date.now()+Math.floor(Math.random()*999),n,w:Math.max(1,w),h:Math.max(1,h),c:COL[S.items.length%COL.length]});S.sel=S.items[S.items.length-1].id;save();draw()}
function put(x,y){const it=S.items.find(i=>i.id==S.sel);if(!it||S.placed[it.id])return;const r=S.placed[it.id]?.r||it.rot;const[w,h]=r?[it.h,it.w]:[it.w,it.h];if(!fit(x,y,w,h,it.id)){alert('No cabe ahí');return}S.placed[it.id]={x,y,r:!!r};save();draw()}
function rem(id){delete S.placed[id];S.sel=id;save();draw()}
function rot(id){const it=S.items.find(i=>i.id==id);it.rot=!it.rot;delete S.placed[id];save();draw()}
function del(id){S.items=S.items.filter(i=>i.id!=id);delete S.placed[id];save();draw()}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(String(S.nombre||'personaje').replace(/[^a-z0-9_-]/gi,'_')||'personaje')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.ab)||!Array.isArray(d.items))throw Error('Formato');S=Object.assign({},def,d);save();draw();alert('Personaje importado.')}catch(_){alert('No se pudo importar: el archivo no parece una copia válida de esta hoja.')}e.target.value=''};r.readAsText(f)}

function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(String(S.nombre||'personaje').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]/gi,'_')||'personaje')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.ab)||!Array.isArray(d.items)||!CL[d.clase])throw Error('Formato');S={...def,...d};normalize();save();draw();alert('Personaje importado.')}catch(_){alert('Archivo inválido: importa una copia JSON de esta hoja.')}e.target.value=''};r.readAsText(f)}
function toggleTheme(){const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('dnd-theme',root.dataset.theme)}catch(e){}}
try{const th=localStorage.getItem('dnd-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
function draw(){nav();const map={hoja,hech,mox,rasgos,moch,diario};document.getElementById('v').innerHTML=map[S.tab]();}
draw();
