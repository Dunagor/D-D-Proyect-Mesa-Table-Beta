iones sobre qué criaturas no activarán el glifo; por ejemplo, las que pronuncien una contraseña. Runa explosiva. Cuando se activa, el glifo estalla con energía mágica en una esfera de 6 m de radio centrada en él. Todas las criaturas situadas en esa zona realizan una tirada de salvación de Destreza. Sufrirán 5d8 de daño de ácido, frío, fuego, relámpa- go o trueno (el tipo que elijas al crear el glifo) si la fallan o la mitad del daño si la superan. Glifo de conjuro. Puedes almacenar un conjuro preparado de nivel 3 o inferior en el glifo si lo lanzas como parte de la creación de dicho glifo. El conjuro debe tener como objetivo una sola criatura o un área. El conjuro almacenado no tiene ningún efecto inmediato cuando se lanza de esta manera.¶Cuando el glifo se activa, el conjuro almacenado surte efecto. Si el conjuro tiene un objetivo, elige como dicho objetivo a la criatura que haya activado el glifo. Si afecta a un área, la zona está centrada en esa criatura. Si el conjuro invoca criaturas hostiles o crea objetos o trampas perjudiciales, aparecerán lo más cerca posible del intruso y lo atacarán. Si el conjuro requiere concentración, no terminará hasta alcanzar su duración máxima. Con un espacio de conjuro de nivel superior. El daño de una runa explosiva aumenta en 1d8 por cada nivel por encima de 3 que tenga el espacio. Si creas un glifo de conjuro, puedes almacenar cualquier conjuro de hasta el mismo nivel que el espacio de conjuro que hayas empleado para el glifo custodio."}, {"n": "Globo de invulnerabilidad", "lv": 6, "esc": "Abjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una cuenta de cristal) Duración: Concentración, hasta 1 minuto¶Una barrera inmóvil y brillante surge en una ema- nación de 3 m alrededor de ti y permanece hasta que el conjuro termine. Cualquier conjuro de nivel 5 o inferior que se l ance desde fuera de la barrera no puede afectar a nada dentro de ella. Tales conjuros pueden hacer objetivo a criaturas y objetos que estén dentro de la barrera, pero no tendrán ningún efecto sobre ellos. De forma similar, el interior de la barrera estará excluido de las áreas de efecto creadas por dichos conjuros. Con un espacio de conjuro de nivel superior. La barrera bloquea los conjuros de 1 nivel más por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Golpe apresador", "lv": 1, "esc": "Conjuración", "cl": ["explorador"], "t": "Tiempo de lanzamiento: Acción adicional, que realizas de inmediato tras acertar a una criatura con un arma Alcance: Lanzador Componentes: V Duración: Concentración, hasta 1 minuto¶Al acertar al objetivo, unas enredaderas aparecerán sobre él y deberá hacer una tirada de salvación de Fuerza. Las criaturas Grandes o de mayor tamaño tienen ventaja en esta tirada. Si la falla, tendrá el es- tado de apresado hasta que el conjuro termine. Si la supera, las enredaderas se marchitan y el conjuro termina. Mientras esté apresado, el objetivo sufrirá 1d6 de daño perforante al principio de cada uno de sus turnos. El objetivo o una criatura a su alcance puede emplear una acción para hacer una prueba¶de Fuerza (Atletismo) contra tu CD de salvación de conjuros. Si la supera, el conjuro termina. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio.¶Guardas y guardias¶Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (una pizca de azufre) Duración: Instantáneo¶Creas una protección que cubre hasta 250 m2 de espacio en el suelo. La zona protegida puede tener hasta 6 m de altura y le das la forma de una zona cuadrada de 15 m de lado, cien cuadrados contiguos de 1,5 m de lado o veinticinco cuadrados contiguos de 3 m de lado. Cuando lances el conjuro, puedes especificar cria- turas individuales que no se verán afectadas por los efectos del conjuro. También puedes designar una contraseña que, cuando se diga en alto a 1,5 m o menos de la zona protegida, hace inmune a sus efectos a quien la dice. El conjuro crea los efectos indicados a continua- ción en la zona protegida. Disipar magia no tiene efecto sobre guardas y guardias, pero sí que se pueden disipar los siguientes efectos. Si se disipan los cuatro, guardas y guardias terminará. Si lanzas el conjuro a diario durante 365 días en la misma zona, el conjuro durará hasta que se disipen todos sus efectos. Escaleras. Todas las escaleras de la zona protegida se llenan de telas de araña de arriba abajo, como si estuvieran afectadas por el conjuro telaraña. Mientras dure guardas y guardias, estas telas de araña vuelven a generarse en un plazo de 10 minutos si se destruyen. Pasillos. Todos los pasillos protegidos se llenan de niebla y pasan a estar muy oscuros. Además, en cada intersección o en cada camino que se divida y que permita elegir una dirección, hay un 50 % de probabilidad de que una criatura que no seas tú piense que va en la dirección contraria a la que haya elegido. Puertas. Todas las puertas de la zona protegida están cerradas de manera mágica, como si estuvie- ran afectadas por el conjuro cerradura arcana. Ade- más, puedes cubrir hasta 10 puertas con una ilusión para que parezcan simples secciones de pared. Otro efecto del conjuro. Sitúas uno de los siguien- tes efectos mágicos dentro de la zona protegida:"}, {"n": "Grasa", "lv": 1, "esc": "Conjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un poco de piel de cerdo o de mantequilla) Duración: 1 minuto¶Una grasa no inflamable cubre una zona cuadrada del suelo de 3 m de lado centrada en un punto den- tro del alcance y que la convierte en terreno difícil hasta que termina el conjuro. Cuando aparezca la grasa, las criaturas que haya en esa zona deberán superar una tirada de salva- ción de Destreza o tendrán el estado de derribadas. Una criatura que entre en la zona o termine su turno ahí deberá superar esa tirada de salvación o caerá derribada."}, {"n": "Guarda contra la muerte", "lv": 4, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: 8 horas¶Tocas a una criatura y le concedes cierta protección frente a la muerte. La primera vez que los puntos de golpe del objetivo fueran a reducirse a 0 antes de que el conjuro termine, en lugar de eso, se reducen a 1 y el conjuro termina. Si el conjuro sigue activo cuando el objetivo sufre un efecto que fuera a matarlo al instante sin c ausarle daño, se niega ese efecto y el conjuro termina."}, {"n": "Documento de referencia del sistema 5.2.1", "lv": 6, "esc": "Abjuración", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (una vara de plata que valga al menos 10 po) Duración: 24 horas¶• Luces danzantes en cuatro pasillos con un patrón sencillo que las luces reproducirán mientras dure guardas y guardias. • Boca mágica en dos lugares. • Nube apestosa en dos lugares (los vapores vol- verán tras 10 minutos si se dispersan mientras dure guardas y guardias). • Ráfaga de viento en un pasillo o sala (el viento sopla sin parar mientras dure el conjuro).¶• Sugestión en una casilla de 1,5 m de lado, y cual- quier criatura que entre en ella recibirá la suges- tión mentalmente."}, {"n": "Guardián de la fe", "lv": 4, "esc": "Conjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V Duración: 8 horas¶Un guardián espectral Grande aparece en un espacio sin ocupar que puedas ver dentro del alcance y levita sobre él hasta que termine el conju- ro. El guardián ocupa ese espacio, es invulnerable y se muestra en una forma adecuada para tu deidad o panteón. Cualquier enemigo que entre en un espacio a 3 m o menos del guardián por primera vez en un turno o empiece su turno allí hará una tirada de salvación de Destreza; sufrirá 20 de daño radiante si la falla o la mitad de daño si la supera. El guardián se des- vanece cuando ha causado un total de 60 de daño."}, {"n": "Guía", "lv": 0, "esc": "adivinación", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tocas a una criatura voluntaria y eliges una habili- dad. Hasta que el conjuro termine, la criatura añade 1d4 a una prueba de característica con la habilidad elegida."}, {"n": "Hablar con las plantas", "lv": 3, "esc": "Transmutación", "cl": ["bardo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: 10 minutos¶Insuflas una consciencia y una animación limitadas a las plantas en una emanación inmóvil de 9 m, lo que les otorga la capacidad de comunicarse contigo y obedecer órdenes sencillas que les des. Puedes preguntar a las plantas acerca de sucesos que hayan ocurrido en la zona del conjuro durante el último día y conseguir información sobre qué criaturas han pasado por allí, el clima y otras circunstancias. También puedes convertir el terreno difícil debido al crecimiento vegetal (como matorrales y maleza) en terreno normal hasta que termine el conjuro o puedes convertir un terreno normal en el que haya plantas en terreno difícil hasta que termine el conjuro.¶El conjuro no permite que las plantas se liberen del suelo y se desplacen, pero sí que pueden mover sus ramas, zarcillos y tallos por ti. Si hay una criatura de tipo “planta” en la zona, puedes comunicarte con ella como si compartierais un idioma común."}, {"n": "Hablar con los animales", "lv": 1, "esc": "Adivinación", "cl": ["bardo", "brujo", "druida", "explorador"], "t": "explorador) Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S Duración: 10 minutos¶Hasta que termine el conjuro, puedes comprender y comunicarte verbalmente con bestias y usar con ellas cualquiera de las opciones de la acción de influir. La mayoría de bestias tienen poco que decir en cuestiones que no tengan que ver con la supervi- vencia o la compañía, pero como mínimo podrán proporcionarte información sobre los lugares y monstruos cercanos, incluyendo lo que hayan perci- bido en el último día."}, {"n": "Hablar con los muertos", "lv": 3, "esc": "Nigromancia", "cl": ["bardo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 3 m Componentes: V, S, M (incienso para quemar) Duración: 10 minutos¶Otorgas una apariencia de vida a un cadáver de tu elección dentro del alcance para que pueda respon- der a tus preguntas. El cadáver debe tener boca y el conjuro falla si la criatura difunta era un muerto viviente cuando falleció. El conjuro también falla si el cadáver ya ha sido el objetivo de este conjuro en los últimos 10 días. Hasta que el conjuro termine, puedes hacerle al cadáver hasta cinco preguntas. Este solo sabe lo que sabía en vida, incluidos los idiomas. Sus respuestas suelen ser breves, crípticas o repetitivas, y no se siente obligado a darte una respuesta verdadera si eres hostil con él o te reconoce como un enemigo. Este conjuro no devuelve el alma de la criatura a su cuerpo, solo anima su espíritu. Por tanto, el cadáver no puede aprender nueva información, no entiende nada que haya ocurrido después su muerte y no puede especular sobre sucesos futuros."}, {"n": "Hacer añicos", "lv": 2, "esc": "Evocación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (una lasca de mica) Duración: Instantáneo¶Un fuerte ruido surge de un punto de tu elección dentro del alcance. Todas las criaturas situadas en una esfera de 3 m de radio centrada en ese punto hacen una tirada de salvación de Constitución; sufrirán 3d8 de daño de trueno si la fallan o la mitad del daño si la superan. Los autómatas tienen desventaja en esta tirada. Los objetos no mágicos que se encuentren dentro del área del conjuro también recibirán el daño, salvo si los lleva o viste una criatura. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 2 que tenga el espacio.¶Hallar corcel¶MOD. SALV.¶MOD. SALV.¶Des 12 +1 +1 Sab 12 +1 +1¶Con 14 +2 +2 Car 8 −1 −1¶Sentidos: Percepción pasiva 11 Idiomas: telepatía 1,5 km (solo funciona contigo) VD: ninguno (0 PX; BC igual a tu bonificador por competencia)¶Atributos Vínculo vital. Cuando recuperas puntos de golpe mediante un conjuro de nivel 1 o superior, el corcel recupera la misma cantidad de puntos de golpe si estás"}, {"n": "a 1,5 m o menos de él.", "lv": 2, "esc": "Conjuración", "cl": ["paladín"], "t": "Acciones¶Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Golpetazo sobrenatural. Tirada de ataque cuerpo a cuerpo: bonificador igual a tu modificador de ataque de conjuros, alcance 1,5 m. Acierto: 1d8 más el nivel de daño radiante (celestial), psíquico (feérico) o necrótico (infernal).¶Invocas un ser sobrenatural que asume la forma de un corcel fiel en un espacio sin ocupar de tu elección dentro del alcance. La criatura utiliza el perfil del corcel sobrenatural. Si ya tienes un corcel gracias a este conjuro, se sustituirá por el nuevo. El corcel se parece a un animal Grande que puedas montar de tu elección, como un caballo, un alce, un camello o un lobo terrible. Siempre que lances el conjuro, elige el tipo de criatura del corcel (celestial, feérico o infernal), lo que determinará ciertos atri- butos de su perfil. Combate. El corcel se considera un aliado para tus aliados y para ti. En combate, la criatura comparte tu orden de iniciativa y funciona como una montura controlada mientras vayas sobre ella (como se des- cribe en las normas del combate montado). Si tienes el estado de incapacitado, su turno irá justo después del tuyo, actuará con independencia de ti y se cen- trará en protegerte. Desaparición del corcel. El corcel desaparece si sus puntos de golpe se reducen a 0 o si mueres. Cuando desaparece, deja atrás todo lo que vistiera o llevase. Si vuelves a lanzar este conjuro, decides si invocas al corcel que desapareció u otro distinto. Con un espacio de conjuro de nivel superior. Usa el nivel del espacio de conjuro para determinar el nivel del conjuro en el perfil.¶Corcel sobrenatural¶Celestial, feérico o infernal Grande (a tu elección), neutral CA: 10 + 1 por cada nivel del conjuro PG: 5 + 10 por cada nivel del conjuro (el corcel tiene una cantidad de dados de golpe [d10] igual al nivel del conjuro) Velocidad: 18 m, volar 18 m (requiere un conjuro de nivel 4 o superior)¶MOD. SALV.¶Fue 18 +4 +4 Int 6 −2 −2¶Acciones adicionales Mirada siniestra (solo infernal; se recarga tras un descanso largo). Tirada de salvación de Sabiduría: CD igual a tu CD de salvación de conjuros, una criatura a 18 m o menos que el corcel pueda ver. Fallo: el objetivo tiene el estado de asustado hasta el final de tu siguiente turno. Paso feérico (solo feérico; se recarga tras un descanso largo). El corcel se teletransporta, junto con su jinete, a un espacio sin ocupar de tu elección a 18 m o menos del corcel. Toque sanador (solo celestial; se recarga tras un descanso largo). Una criatura a 1,5 m o menos del corcel recupera una cantidad de puntos de golpe igual a 2d8 más el nivel del conjuro."}, {"n": "Hechizar monstruo", "lv": 4, "esc": "Encantamiento", "cl": ["bardo", "brujo", "druida", "hechicero", "mago"], "t": "hechicero, mago) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: 1 hora¶Una criatura que puedas ver dentro del alcance realiza una tirada de salvación de Sabiduría. La hace con ventaja si está luchando contra ti o tus aliados. Si la falla, tendrá el estado de hechizado hasta que el conjuro termine o hasta que tus aliados o tú le hagáis daño. La criatura hechizada es amistosa contigo, pero cuando el conjuro termine, sabrá que la hechizaste. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Hechizar persona", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "brujo", "druida", "hechicero", "mago"], "t": "hechicero, mago) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: 1 hora¶Un humanoide que puedas ver dentro del alcance realiza una tirada de salvación de Sabiduría. La hace con ventaja si está luchando contra ti o tus aliados. Si la falla, tendrá el estado de hechizado hasta que el conjuro termine o hasta que tus aliados o tú le hagáis daño. La criatura hechizada es amistosa contigo, pero cuando el conjuro termine, sabrá que la hechizaste. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Heroísmo", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 minuto¶Insuflas valor a una criatura voluntaria a la que toques. Hasta que el conjuro termine, la criatura es inmune al estado de asustada y obtiene una cantidad de puntos de golpe temporales igual a tu modificador por aptitud mágica al principio de cada uno de sus turnos. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Hoja de fuego", "lv": 2, "esc": "Evocación", "cl": ["druida", "hechicero"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V, S, M (una hoja de zumaque) Duración: Concentración, hasta 10 minutos¶Haces aparecer una hoja ardiente en tu mano libre que es similar en tamaño y forma a una cimitarra y que durará hasta que termine el conjuro. Si sueltas la hoja, desaparece, pero puedes volver a invocarla como acción adicional. Como acción de magia, puedes hacer un ataque de conjuro cuerpo a cuerpo con la hoja ardiente. Si acierta, el objetivo sufrirá una cantidad de daño de fuego igual a 3d6 más tu modificador por aptitud mágica. La hoja llameante emite luz brillante en un radio de 3 m y luz tenue 3 m más allá.¶Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Identificar", "lv": 1, "esc": "Adivinación", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Toque Componentes: V, S, M (una perla que valga al menos 100 po) Duración: Instantáneo¶Tocas un objeto durante el lanzamiento del conjuro. Si se trata de un objeto mágico de un objeto imbuido de magia, averiguarás sus propiedades y cómo usar- las, si hace falta sintonizarse con él y cuántas cargas tiene, si corresponde. Si hay conjuros activos que afecten al objeto, sabrás cuáles son. Si el objeto se creó mediante un conjuro, averiguarás su nombre. Si tocas a una criatura en lugar de un objeto, averiguarás qué conjuros activos le afectan en ese momento, si hay alguno."}, {"n": "Ilusión menor", "lv": 0, "esc": "ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: S, M (un poco de vellón) Duración: 1 minuto¶Creas un sonido o una imagen de un objeto situado dentro del alcance que permanecerá hasta que termine el conjuro. Consulta las descripciones a continuación para conocer sus efectos. La ilusión termina si lanzas el conjuro de nuevo. Si una criatura emplea su acción de estudiar para examinar la imagen o el sonido, puede determinar que es una ilusión si supera una prueba de Inteli- gencia (Investigación) contra tu CD de salvación de conjuros. Si la criatura descubre que se trata de una ilusión, esta se irá desvaneciendo para esa criatura. Sonido. Si creas un sonido, su volumen se situará entre el de un susurro y el de un grito. Puede ser tu voz, la de otra criatura, el rugido de un león, un redoblar de tambores o cualquier otro sonido que elijas. El sonido continúa incesante mientras dure el conjuro o puedes originar sonidos distintos en diferentes momentos antes del fin del conjuro. Imagen. Si creas la imagen de un objeto (como una silla, pisadas embarradas o un pequeño cofre), no podrá ser mayor que un cubo de 1,5 m de lado. La imagen no puede generar sonido, luz, olor o cual- quier otro efecto sensorial. La interacción física con la imagen revela que es una ilusión, ya que las cosas pueden atravesarla."}, {"n": "Ilusión programada", "lv": 6, "esc": "Ilusionismo", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (polvo de jade con un valor de al menos 25 po) Duración: Hasta que sea disipado¶Creas una ilusión de un objeto, una criatura u otro tipo de fenómeno visible dentro del alcance que se activa cuando se produce una condición específica. Hasta entonces, la ilusión es imperceptible. No pue- de tener un tamaño mayor que un cubo de 9 m de lado y, cuando lanzas el conjuro, tú decides cómo se comporta y el sonido que emite. Esta actuación programada puede durar hasta 5 minutos. Cuando se produzca la condición especificada, la ilusión se activará y actuará de la manera que hayas descrito. En cuanto finalice su actuación, desapa- recerá y permanecerá inactiva durante 10 minutos, tras lo cual podrá volver a activarse la ilusión. La condición puede ser tan genérica o detallada como quieras, aunque debe basarse en fenómenos visuales o audibles que se produzcan a 9 m o menos del área. Por ejemplo, podrías crear una ilusión de ti para que aparezca y avise a quienes intenten abrir una puerta con trampa. La interacción física con la imagen revela que es una ilusión, ya que las cosas pueden atravesarla. Si una criatura emplea una acción de estudiar para examinar la imagen, puede determinar que es una ilusión si supera una prueba de Inteligencia (In- vestigación) contra tu CD de salvación de conjuros. Si la criatura descubre que la imagen es una ilusión, no se dejará engañar por ella y los sonidos que emi- ta le sonarán huecos."}, {"n": "Imagen mayor", "lv": 3, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un poco de vellón) Duración: Concentración, hasta 10 minutos¶Creas una imagen de un objeto, una criatura u otro tipo de fenómeno visible cuyas dimensiones no excedan las de un cubo de 6 m de lado. La imagen aparece en un sitio que puedas ver dentro del alcance y se mantiene hasta que termine el conjuro. Parece real e incluye sonidos, olores y temperatura apropiados para lo que se representa, pero no puede hacer daño ni provocar estados. Si estás dentro del alcance de la ilusión, puedes utilizar una acción de magia para moverla a otro sitio dentro de dicho alcance. Al cambiarla de sitio, puedes alterar su apariencia de forma que sus movimientos parezcan naturales. Por ejemplo, si creas la imagen de una criatura y la mueves, puedes¶alterarla de forma que parezca estar andando. De forma similar, puedes hacer que la ilusión produzca distintos sonidos en diferentes momentos e incluso mantener una conversación, por ejemplo. La interacción física con la imagen revela que es una ilusión, ya que las cosas pueden atravesarla. Si una criatura emplea una acción de estudiar para examinar la imagen, puede determinar que es una ilusión si supera una prueba de Inteligencia (In- vestigación) contra tu CD de salvación de conjuros. Si la criatura descubre que la imagen es una ilusión, no se dejará engañar por ella y sus otras cualidades sensoriales se irán desvaneciendo para esa criatura. Con un espacio de conjuro de nivel superior. El conjuro durará hasta que sea disipado y no requerirá concentración si se lanza con un espacio de conjuro de nivel 4 o superior."}, {"n": "Imagen múltiple", "lv": 2, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: 1 minuto¶En tu espacio aparecen tres duplicados ilusorios de ti. Hasta que el conjuro termine, estos duplicados se mueven a la vez que tú e imitan tus acciones cam- biando de posición, por lo que es imposible saber cuál es la imagen real. Cada vez que una criatura te acierte con una tira- da de ataque mientras dure el conjuro, tira 1d6 por cada uno de tus duplicados restantes. Si cualquiera de los resultados es de 3 o más, uno de los duplica- dos recibe el golpe en tu lugar y es destruido. Por lo demás, los duplicados ignoran el resto del daño y efectos. Cuando los tres duplicados son destrui- dos, el conjuro termina. Una criatura no se verá afectada por este conjuro si tiene el estado de cegada, visión ciega o visión verdadera."}, {"n": "Imagen silenciosa", "lv": 1, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un poco de vellón) Duración: Concentración, hasta 10 minutos¶Creas una imagen de un objeto, una criatura u otro tipo de fenómeno visible cuyas dimensiones no excedan las de un cubo de 4,5 m de lado. La imagen aparece en un sitio dentro del alcance y se mantiene hasta el final del conjuro. La imagen es solamente visual; no está acompañada de sonido, olor u otros efectos sensoriales. Como acción de magia, puedes mover la imagen a cualquier sitio dentro del alcance. Al cambiarla de¶sitio, puedes alterar su apariencia de forma que sus movimientos parezcan naturales. Por ejemplo, si creas la imagen de una criatura y la mueves, puedes alterarla de forma que parezca estar andando. La interacción física con la imagen revela que es una ilusión, ya que las cosas pueden atravesarla. Si una criatura emplea una acción de estudiar para examinar la imagen, puede determinar que es una ilusión si supera una prueba de Inteligencia (In- vestigación) contra tu CD de salvación de conjuros. Si la criatura descubre que la imagen es una ilusión, no se dejará engañar por ella."}, {"n": "Impacto certero", "lv": 0, "esc": "adivinación", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: S, M (un arma con la que tengas competencia y que valga al menos 1 pc) Duración: Instantáneo¶Un destello de perspicacia mágica te guía y haces un ataque con el arma empleada para lanzar el conjuro. El ataque usa tu aptitud mágica para las tiradas de ataque y de daño en lugar de la Fuerza o la Destreza. Si el ataque inflige daño, puede ser radiante o del tipo de daño normal del arma (a tu elección). Mejora de truco. Independientemente de si haces daño radiante o del tipo normal del arma, el ataque inflige daño radiante adicional cuando alcanzas los niveles 5 (1d6), 11 (2d6) y 17 (3d6)."}, {"n": "Imponer maldición", "lv": 3, "esc": "Nigromancia", "cl": ["bardo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tocas a una criatura, que deberá superar una tirada de salvación de Sabiduría o quedará maldecida hasta que el conjuro termine. Hasta que se rompa la maldición, el objetivo sufrirá uno de los siguien- tes efectos a tu elección:¶• Elige una característica. El objetivo tendrá des- ventaja en las pruebas de característica y tiradas de salvación hechas con esa característica. • El objetivo tendrá desventaja en las tiradas de ataque contra ti. • En combate, el objetivo deberá superar una tirada de salvación de Sabiduría al principio de cada uno de sus turnos o se verá obligado a llevar a cabo la acción de esquivar ese turno. • Si causas daño al objetivo con una tirada de ata- que o un conjuro, recibirá 1d8 de daño necrótico adicional.¶Con un espacio de conjuro de nivel superior. Si lanzas este conjuro con un espacio de nivel 4, puedes mantener la concentración en él hasta 10 minutos. Si usas un espacio de nivel 5 o superior, el conjuro no requiere concentración y la duración pasará a ser de 8 horas (espacio de nivel 5 o 6) o de 24 horas (espacio de nivel 7 u 8). Si usas un espacio de conjuro de nivel 9, el conjuro durará hasta que sea disipado."}, {"n": "Indetectable", "lv": 3, "esc": "Abjuración", "cl": ["bardo", "explorador", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una pizca de diamante en polvo que valga al menos 25 po, que se consume como parte del conjuro) Duración: 8 horas¶Hasta que termine el conjuro, escondes a un objetivo que toques ante los conjuros de adivinación. Este puede ser una criatura voluntaria, o un lugar o un objeto que no midan más de 3 m en ninguna de sus dimensiones. El objetivo no podrá ser el objetivo de conjuros de adivinación ni podrá ser percibido mediante sensores mágicos de escudriñamiento."}, {"n": "Infligir heridas", "lv": 1, "esc": "Nigromancia", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Instantáneo¶Una criatura a la que toques hace una tirada de salvación de Constitución; sufrirá 2d10 de daño necrótico si la falla o la mitad del daño si la supera. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Inmovilizar monstruo", "lv": 5, "esc": "Encantamiento", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (un trozo de hierro recto) Duración: Concentración, hasta 1 minuto¶Elige a una criatura que puedas ver dentro del alcance. El objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de parali- zado hasta que termine el conjuro. Al final de cada uno de sus turnos, el objetivo repite la tirada de salvación y, si tiene éxito, se librará del conjuro. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Inmovilizar persona", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "brujo", "clérigo", "druida", "hechicero", "mago"], "t": "druida, hechicero, mago) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un trozo de hierro recto) Duración: Concentración, hasta 1 minuto¶Elige a un humanoide que puedas ver dentro del alcance. El objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de parali- zado hasta que termine el conjuro. Al final de cada uno de sus turnos, el objetivo repite la tirada de salvación y, si tiene éxito, se librará del conjuro. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a un humanoide adicional por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Insecto gigante", "lv": 4, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Trepar cual arácnido. El insecto puede trepar por superficies difíciles e incluso recorrer techos sin tener que realizar pruebas de característica.¶Acciones Ataque múltiple. El insecto realiza una cantidad de ataques igual a la mitad del nivel de este conjuro (redondeado hacia abajo). Punzada venenosa. Tirada de ataque cuerpo a cuerpo: bonificador igual a tu modificador de ataque de conjuros, alcance 3 m. Acierto: 1d6 + 3 más el nivel del conjuro de daño perforante más 1d4 de daño de veneno. Proyectil de telarañas (solo araña). Tirada de ataque a distancia: bonificador igual a tu modificador de ataque de conjuros, alcance 18 m. Acierto: 1d10 + 3 más el nivel del conjuro de daño contundente y la velocidad del objetivo se reduce a 0 hasta el principio del siguiente turno del insecto.¶Acciones adicionales¶Invocas una araña, una avispa o un ciempiés g igante (a tu elección cuando lanzas el conjuro). Se manifiesta en un espacio sin ocupar que puedas ver dentro del alcance y utiliza el perfil del insecto g igante. La forma que elijas determina ciertos aspectos de su perfil. La criatura desaparecerá si sus puntos de golpe se reducen a 0 o si el conjuro termina. La criatura se considera un aliado para tus aliados y para ti. En combate, la criatura comparte tu orden de iniciativa, pero su turno va justo después del tuyo, obedece tus órdenes verbales (no requiere acción) y, si no le das ninguna, realiza la acción de esquivar y usa su movimiento para evitar el peligro. Con un espacio de conjuro de nivel superior. Usa el nivel del espacio de conjuro para determinar el nivel del conjuro en el perfil.¶Insecto gigante¶Bestia Grande, sin alineamiento CA: 11 + el nivel del conjuro PG: 30 + 10 por cada nivel del conjuro superior al 4 Velocidad: 12 m, trepar 12 m, volar 12 m (solo avispa) MOD. SALV.¶MOD. SALV.¶MOD. SALV.¶Fue 17 +3 +3 Int 4 −3 −3¶Des 13 +1 +1 Sab 14 +2 +2¶Con 15 +2 +2 Car 3 −4 −4¶Sentidos: visión en la oscuridad 18 m; Percepción pasiva 12 Idiomas: entiende los idiomas que conozcas VD: ninguno (0 PX; BC igual a tu bonificador por competencia)¶Atributos¶Escupitajo venenoso (solo ciempiés). Tirada de salvación de Constitución: tu CD de salvación de conjuros, una criatura que el insecto pueda ver a 3 m o menos. Fallo: el objetivo tendrá el estado de envenenado hasta el principio del siguiente turno del insecto."}, {"n": "Invertir la gravedad", "lv": 7, "esc": "Transmutación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 30 m Componentes: V, S, M (un imán natural y virutas de hierro) Duración: Concentración, hasta 1 minuto¶Este conjuro invierte la gravedad en un cilindro de 15 m de radio y 30 m de alto centrado en un punto dentro del alcance. Todas las criaturas y objetos dentro de la zona que no estén fijados al suelo caerán hacia arriba y llegarán a la parte superior del cilindro. Una criatura puede hacer una tirada de salvación de Destreza para agarrarse a un objeto fijo a su alcance y así evitar la caída hacia arriba. Si un techo o un objeto fijo se interpone en la caída, las criaturas y objetos chocan contra él como harían en una caída normal hacia abajo. Si una cria- tura u objeto llega a la parte superior del cilindro sin chocarse con nada, permanecerá allí flotando hasta que el conjuro termine. Cuando ocurra, las criaturas y objetos afectados caerán hacia abajo."}, {"n": "Invisibilidad", "lv": 2, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una pestaña envuelta en goma arábiga)¶Duración: Concentración, hasta 1 hora¶Una criatura a la que tocas tiene el estado de invisi- ble hasta que el conjuro termine. El conjuro termi- nará inmediatamente después de que el objetivo haga una tirada de ataque, cause daño o lance un conjuro. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Invisibilidad mejorada", "lv": 4, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Espíritu dracónico Dragón Grande, neutral¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 minuto¶CA: 14 + el nivel del conjuro PG: 50 + 10 por cada nivel del conjuro superior al 5 Velocidad: 9 m, nadar 9 m, volar 18 m MOD. SALV.¶MOD. SALV.¶MOD. SALV.¶Una criatura a la que tocas tiene el estado de invisible hasta que el conjuro termine.¶Fue 19 +4 +4 Int 10 +0 +0¶Des 14 +2 +2 Sab 14 +2 +2¶Con 17 +3 +3 Car 14 +2 +2"}, {"n": "Invocación instantánea", "lv": 6, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Toque Componentes: V, S, M (un zafiro que valga al menos 1000 po) Duración: Hasta que sea disipado¶Resistencias: ácido, frío, fuego, relámpago, veneno Inmunidades: asustado, envenenado, hechizado Sentidos: visión ciega 9 m, visión en la oscuridad 18 m; Percepción pasiva 12 Idiomas: dracónico, entiende los idiomas que conozcas VD: ninguno (0 PX; BC igual a tu bonificador por competencia)¶Tocas el zafiro empleado en el lanzamiento y un objeto que pese 5 kg o menos y cuya dimensión más grande sea de 1,8 m o menos. El conjuro deja una marca invisible en su superficie y graba de la misma forma el nombre del objeto en el zafiro. Cada vez que lances este conjuro, deberás usar un zafiro distinto. A partir de entonces, podrás emplear una acción de magia para decir el nombre del objeto y aplastar el zafiro. El objeto aparecerá en tu mano al instante, sin importar las distancias físicas o interplanares, y el conjuro terminará. Si otra criatura sostiene o lleva el objeto consigo, aplastar el zafiro no lo llevará hasta ti. En su lugar, descubrirás quién es la criatura que lo tiene y su paradero actual.¶Atributos¶Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un objeto con la imagen de un dragón grabada en él que valga al menos 500 po) Duración: Concentración, hasta 1 hora¶Jaula de fuerza"}, {"n": "lanzas el conjuro). Éxito: la mitad del daño.", "lv": 7, "esc": "Evocación", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 30 m Componentes: V, S, M (polvo de rubí que valga al menos 1500 po, que se consume como parte del conjuro) Duración: Concentración, hasta 1 hora¶Una prisión inmóvil e invisible con forma de cubo y compuesta de fuerza mágica surge en una zona de¶tu elección dentro del alcance. Puede ser una jaula o una caja de paredes sólidas, según desees. Una prisión con forma de jaula puede tener hasta 6 m de lado y estar hecha de barrotes de 1,25 cm de diámetro separados 1,25 cm entre sí. Una prisión con forma de caja puede tener hasta 3 m de lado. Creará una barrera sólida que impida que cualquier materia la atraviese y bloqueará cualquier conjuro que se lance a esa zona o desde ella. Cuando lances el conjuro, cualquier criatura que esté completamente dentro del área de la jaula quedará atrapada en ella. A las criaturas que se encuentren solo parcialmente dentro del área o sean demasiado grandes para caber en ella se las empujará lejos del centro de la jaula hasta estar completamente fuera de la zona. Una criatura que esté dentro de la jaula no puede salir de ella por medios que no sean mágicos. Si la criatura intenta usar el teletransporte o el viaje interplanar para huir, primero deberá hacer una tirada de salvación de Carisma. Si la supera, podrá usar esa magia para salir de la jaula. Si falla la t irada, no saldrá y se perderá el espacio de conjuro o el efecto. La jaula también se extiende hasta el Plano Etéreo e impide el viaje etéreo. Este conjuro no se puede eliminar mediante disipar magia."}, {"n": "Laberinto", "lv": 8, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Destierras a una criatura que puedas ver dentro del alcance a un semiplano laberíntico. El objetivo per- manecerá allí hasta que termine el conjuro o hasta que escape del laberinto. El objetivo puede llevar a cabo una acción de estudiar para intentar escapar. Cuando lo haga, realizará una prueba de Inteligencia (Investiga- ción) con CD 20. Si la supera, escapará y el conjuro terminará. Cuando el conjuro termine, el objetivo reapare- cerá en el espacio que abandonó o en el espacio sin ocupar más cercano si dicho espacio está ocupado."}, {"n": "Labia", "lv": 8, "esc": "Encantamiento", "cl": ["bardo", "brujo"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V Duración: 1 hora¶Hasta que el conjuro termine, cuando hagas una prueba de Carisma, puedes sustituir el resultado de la tirada por un 15. Además, digas lo que digas, cual-¶quier magia usada para detectar si dices la verdad indicará que la estás diciendo."}, {"n": "Levantar maldición", "lv": 3, "esc": "Abjuración", "cl": ["brujo", "clérigo", "mago", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Instantáneo¶Con tan solo tocar a una criatura o un objeto, eli- minarás todas las maldiciones que le afecten. Si el objetivo es un objeto mágico maldito, la maldición permanecerá, pero este conjuro romperá la sinto- nización del objeto con el dueño, lo que le permitirá quitárselo o deshacerse de él."}, {"n": "Levitar", "lv": 2, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un muelle de metal) Duración: Concentración, hasta 10 minutos¶Una criatura o un objeto suelto de tu elección que puedas ver dentro del alcance se eleva verticalmente hasta 6 m y se mantiene suspendido hasta que el conjuro termine. El conjuro puede hacer levitar un objeto que pese hasta 250 kg y no afecta a una criatura no voluntaria que supere una tirada de salvación de Constitución. El objetivo solo puede moverse empujándose o t irando de un objeto fijo o una superficie a su alcance (como una pared o techo), lo que le per- mite desplazarse como si estuviera trepando. En tu t urno, puedes variar la altitud del objetivo hasta 6 m en cualquier sentido. Si tú mismo eres el objetivo, te puedes mover hacia arriba o abajo como parte de tu movimiento. En caso contrario, puedes usar una acción de magia para mover al objetivo, que deberá permanecer dentro del alcance del conjuro. Cuando el conjuro termine, el objetivo flotará suavemente hasta llegar al suelo si todavía está en el aire."}, {"n": "Libertad de movimiento", "lv": 4, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida", "explorador"], "t": "explorador) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (una tira de cuero) Duración: 1 hora¶Tocas a una criatura voluntaria. Hasta que termine el conjuro, el movimiento del objetivo no se ve afec- tado por el terreno difícil y los conjuros y otros efec- tos mágicos no pueden reducir su velocidad ni hacer que tenga los estados de apresado o p  aralizado.¶Además, el objetivo tiene una velocidad nadando igual a su velocidad. El objetivo también puede gastar 1,5 m de movi- miento para escapar automáticamente de ataduras no mágicas, como unas esposas o una criatura que le imponga el estado de agarrado. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 4 que tenga el espacio.¶pago y elegir como objetivo el mismo punto u otro distinto. Si estás al aire libre y hay una tormenta cuando lanzas este conjuro, te da el control de ella en vez de crear una nueva. En estas condiciones, el daño del conjuro aumenta en 1d10. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 3 que tenga el espacio.¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (polvo de rubí que valga al menos 50 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado¶Tiempo de lanzamiento: Acción o ritual Alcance: Lanzador Componentes: V, S, M (pelaje de un sabueso) Duración: Instantáneo"}, {"n": "Llama sagrada", "lv": 0, "esc": "evocación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Un fulgor de llamas desciende sobre una criatura que puedas ver dentro del alcance. El objetivo deberá superar una tirada de salvación de Destreza o sufrirá 1d8 de daño radiante. No podrá beneficiarse de la cobertura media o tres cuartos en esta tirada. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Llamar al relámpago", "lv": 3, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Una nube de tormenta aparece en un punto dentro del alcance que puedas ver por encima de ti. La nube adopta la forma de un cilindro de 3 m de altura y 18 m de radio. Cuando lances el conjuro, elige un punto que puedas ver bajo la nube y de ella caerá un relám- pago hacia ese punto. Todas las criaturas a 1,5 m o menos de ese punto hacen una tirada de salvación de Destreza; sufrirán 3d10 de daño de relámpago si la fallan o la mitad del daño si la superan. Hasta que el conjuro termine, puedes usar una acción de magia para volver a invocar otro relám-"}, {"n": "Localizar criatura", "lv": 4, "esc": "Adivinación", "cl": ["bardo", "clérigo", "druida", "explorador", "mago", "paladín"], "t": "explorador, mago, paladín) Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (pelaje de un sabueso) Duración: Concentración, hasta 1 hora¶Describe o nombra una criatura que conozcas. Presientes la dirección en la que se encuentra dicha criatura si está a 300 m o menos de ti. Si la criatura se está moviendo, conoces la dirección de su movi- miento. El conjuro puede localizar a una criatura especí- fica que conozcas o a la criatura más cercana de un tipo específico (como un humano o un unicornio) si has visto a una criatura así de cerca (a 9 m o menos) al menos una vez. Si una criatura que describas o nombres está adoptando una forma distinta, por ejemplo bajo los efectos de un conjuro de la carne a la piedra o polimorfar, este conjuro no la localiza. El conjuro no puede localizar a una criatura si hay cualquier grosor de plomo que bloquee una ruta directa entre la criatura y tú."}, {"n": "Localizar objeto", "lv": 2, "esc": "Adivinación", "cl": ["bardo", "clérigo", "druida", "explorador", "mago", "paladín"], "t": "explorador, mago, paladín)¶Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una ramita con forma de horquilla) Duración: Concentración, hasta 10 minutos¶Describe o nombra un objeto que conozcas. Presien- tes la dirección en la que se encuentra dicho objeto¶si está a 300 m o menos de ti. Si el objeto se está moviendo, conoces la dirección de su movimiento. El conjuro puede localizar un objeto específico que conozcas si lo has visto de cerca (a 9 m o menos) al menos una vez. Como alternativa, el conjuro pue- de localizar el objeto más cercano de un tipo parti- cular, como un cierto tipo de ropa, joyas, muebles, herramientas o armas. El conjuro no puede localizar un objeto si hay cualquier grosor de plomo que bloquee una ruta directa entre dicho objeto y tú."}, {"n": "Luces danzantes", "lv": 0, "esc": "ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una pizca de fósforo) Duración: Concentración, hasta 1 minuto¶Creas hasta cuatro luces del tamaño de antorchas dentro del alcance. Puedes darles la apariencia de antorchas, linternas u orbes luminosos, y levitarán hasta que el conjuro termine. Como alternativa, combinas las cuatro luces en una sola de tamaño Mediano y aspecto vagamente humanoide. En am- bos casos, cada luz proyecta una luz tenue en un radio de 3 m. Como acción adicional, puedes mover las luces hasta 18 m a otro espacio dentro del alcance. Cada luz debe estar a 6 m o menos de otra luz creada por este conjuro y se desvanecerá si sale del alcance del mismo."}, {"n": "Luz", "lv": 0, "esc": "evocación", "cl": ["bardo", "clérigo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, M (una luciérnaga o musgo fosforescente) Duración: 1 hora¶Tocas un objeto Grande o más pequeño que nadie lleve o vista. Hasta que el conjuro termine, el objeto emitirá luz brillante en un radio de 6 m y luz tenue otros 6 m más allá. La luz puede tener el color que desees. Tapar completamente el objeto con un material opaco bloqueará la luz. El conjuro termina si lo vuelves a lanzar."}, {"n": "Luz del día", "lv": 3, "esc": "Evocación", "cl": ["clérigo", "druida", "explorador", "hechicero", "paladín"], "t": "hechicero, paladín) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: 1 hora¶Hasta que el conjuro termine, una luz solar se extiende desde un punto dentro del alcance y llena una esfera de 18 m de radio. La zona que cubre es de luz brillante y emite una luz tenue 18 m más allá. Como alternativa, lanzas el conjuro sobre un ob- jeto que no lleve o vista nadie, lo que hará que la luz solar llene una emanación de 18 m metros que se origina en él. Cubrir el objeto con algo opaco, como un cuenco o un casco, bloqueará la luz solar. Si cualquier zona del conjuro se superpone con una zona de oscuridad creada por un conjuro de nivel 3 o inferior, el conjuro que creó esa oscuridad se disipa."}, {"n": "Mal de ojo", "lv": 6, "esc": "Nigromancia", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 1 minuto¶Hasta que el conjuro termine, tus ojos se convierten en un vacío oscuro. Una criatura de tu elección que puedas ver a 18 m o menos de ti deberá superar una tirada de salvación de Sabiduría o se verá afec- tada por uno de los efectos descritos debajo, a tu elección, hasta que termine el conjuro. En cada uno de tus turnos hasta que el conjuro termine, puedes usar una acción de magia para hacer objetivo a otra criatura, pero no puedes vol- ver a elegir a una que haya superado una tirada de salvación contra este lanzamiento del conjuro. Náuseas. El objetivo tiene el estado de envenenado. Pánico. El objetivo tiene el estado de asustado. En cada uno de sus turnos, el objetivo asustado de- berá realizar la acción de correr para alejarse de ti por la ruta más corta y segura disponible. Si se mue- ve a un espacio que esté al menos a 18 m de ti donde no pueda verte, el efecto termina. Sueño. El objetivo tiene el estado de inconsciente. Se despertará si recibe algún daño o si otra criatura utiliza una acción para despertarlo."}, {"n": "Maleficio", "lv": 1, "esc": "Encantamiento", "cl": ["brujo"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 27 m Componentes: V, S, M (el ojo petrificado de un tritón) Duración: Concentración, hasta 1 hora¶Impones una maldición a una criatura que puedas ver dentro del alcance. Hasta que el conjuro termine, infliges 1d6 de daño necrótico adicional al objetivo siempre que le aciertes con una tirada de ataque. Además, elige una característica cuando lances el conjuro. El objetivo tendrá desventaja en las pruebas que haga con la característica elegida.¶Si los puntos de golpe del objetivo se reducen a 0 antes de que el conjuro termine, puedes usar una acción adicional en un turno posterior para malde- cir a una nueva criatura. Con un espacio de conjuro de nivel superior. Tu concentración puede durar más si usas un espacio de conjuro de nivel 2 (hasta 4 horas), 3 o 4 (hasta 8 horas) o 5 o más (24 horas)."}, {"n": "Mano arcana", "lv": 5, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una cáscara de huevo y un guante) Duración: Concentración, hasta 1 minuto¶Creas una mano de energía mágica brillante de ta- maño Grande en un espacio sin ocupar que puedas ver dentro del alcance. Esta mano durará hasta que el conjuro termine y estará bajo tus órdenes, imi- tando los movimientos de tu propia mano. La mano es un objeto con una CA de 20 y una cantidad de puntos de golpe igual a tus puntos de golpe máximos. Si sus puntos de golpe se reducen a 0, el conjuro termina. La mano no ocupa el espacio en el que se encuentra. Cuando lances el conjuro y como acción adicional en tus siguientes turnos, puedes mover la mano has- ta 18 m y luego usar uno de los siguientes efectos: Mano apresadora. La mano intenta agarrar a una criatura Enorme o más pequeña que esté a 1,5 m o menos de ella. El objetivo deberá superar una tirada de salvación de Destreza o tendrá el estado de agarrado. La CD para escapar es igual a tu CD de salvación de conjuros. Mientras la mano agarre al objetivo, puedes usar una acción adicional para hacer que la mano lo aplaste y causarle una can- tidad de daño contundente igual a 4d6 más tu modificador por aptitud mágica. Mano contundente. La mano intenta empujar a una criatura Enorme o más pequeña que esté a 1,5 m o menos de ella. El objetivo deberá superar una tirada de salvación de Fuerza o la mano lo empu- jará hasta 1,5 m más una distancia igual a 1,5 m × tu modificador por aptitud mágica. La mano se mueve a la vez que el objetivo y permanece a 1,5 m o menos de él. Mano interpuesta. La mano te proporciona co- bertura media contra ataques y otros efectos que se originen en su espacio o intenten atravesarla. Además, ese espacio se considera terreno difícil para tus enemigos. Puño cerrado. La mano golpea a un objetivo a 1,5 m o menos de ella. Haz un ataque de conjuro¶cuerpo a cuerpo. Si acierta, el objetivo recibe 5d8 de daño de fuerza.¶Con un espacio de conjuro de nivel superior. El daño del puño cerrado aumenta en 2d8 y el daño de la mano apresadora aumenta en 2d6 por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Mano de mago", "lv": 0, "esc": "conjuración", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: 1 minuto¶Conjuras una mano espectral flotante en un punto de tu elección dentro del alcance. La mano dura hasta que el conjuro termine. Además, desaparecerá si en algún momento está a más de 9 m de ti o si vuelves a lanzar este conjuro. Cuando lances este conjuro, puedes utilizar la mano para manipular un objeto, abrir una puerta o un recipiente que no estén cerrados con llave, sacar un objeto de un recipiente abierto o guardarlo en él o verter el contenido de un vial. Como acción de magia en tus siguientes turnos, puedes volver a controlar la mano de esta forma. Como parte de la acción, puedes mover la mano hasta 9 m. La mano no puede atacar, activar objetos mágicos ni llevar más de 5 kg de peso."}, {"n": "Manos ardientes", "lv": 1, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Instantáneo¶Una fina capa de llamas se proyecta desde ti. Todas las criaturas situadas en un cono de 4,5 m hacen una tirada de salvación de Destreza; sufrirán 3d6 de daño de fuego si la fallan o la mitad del daño si la superan. Los objetos inflamables dentro del cono que no lleve o vista nadie empezarán a arder. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Mansión magnífica", "lv": 7, "esc": "Conjuración", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: 90 m Componentes: V, S, M (una puerta en miniatura que valga al menos 15 po) Duración: 24 horas¶Conjuras una puerta brillante dentro del alcance que permanece hasta que el conjuro termine. La puerta mide 1,5 m de ancho y 3 m de alto y lleva a una morada extradimensional. Tú y cualquier criatura que designes cuando lances el conjuro podréis entrar en la morada extradimensional mientras la puerta permanezca abierta. Puedes abrirla o cerrarla (no requiere acción) si estás a 9 m o menos de ella. Mientras permanezca cerrada, es imperceptible. Al otro lado de la puerta encuentras un fastuoso recibidor, tras la cual se hallan numerosas estan- cias. La morada está limpia y es fresca y cálida. Puedes crear cualquier plano de planta que desees, pero no puede superar los 50 cubos conti- guos, cada uno de 3 m de lado. El lugar está amue- blado y decorado como elijas y contiene comida suficiente como para servir un banquete de nueve platos a hasta 100 personas. Los muebles y otros objetos creados por este conjuro se convierten en humo si se sacan del lugar. El personal de servicio está compuesto de 100 sir- vientes casi transparentes que atienden a todos los que entran. Tú decides la apariencia y el atuendo de estos sirvientes, que son invulnerables y obe- decen tus órdenes. Los sirvientes pueden realizar las t areas que haría un humano, pero no pueden atacar ni realizar ninguna acción que dañaría directamente a otra criatura. Por lo tanto, pueden traer y llevar cosas, limpiar, arreglar y plegar ropa, encender fuegos, servir comida y vino, etc., aunque no pueden abandonar el lugar. Cuando el conjuro termina, todas las criaturas u objetos que queden en el espacio extradimensio- nal son expulsados a los espacios sin ocupar más cercanos a la entrada."}, {"n": "Marca del cazador", "lv": 1, "esc": "Adivinación", "cl": ["explorador"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 27 m Componentes: V Duración: Concentración, hasta 1 hora¶Marcas mágicamente a una criatura que puedas ver dentro del alcance como tu presa. Hasta que el conjuro termine, infliges 1d6 de daño de fuerza adicional al objetivo siempre que le aciertes con una tirada de ataque. También tendrás ventaja en cualquier prueba de Sabiduría (Percepción o Super- vivencia) que realices para buscarlo. Si los puntos de golpe del objetivo se reducen a 0 antes de que el conjuro termine, puedes emplear una acción adicional para transferir la marca a una nueva criatura que puedas ver dentro del alcance.¶Con un espacio de conjuro de nivel superior. Tu concentración puede durar más si usas un espacio de conjuro de nivel 3 o 4 (hasta 8 horas) o 5 o más (hasta 24 horas)."}, {"n": "Marchitar", "lv": 4, "esc": "Nigromancia", "cl": ["brujo", "druida", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Una criatura a la que puedas ver dentro del alcance deberá hacer una tirada de salvación de Constitu- ción; sufrirá 8d8 de daño necrótico si la falla o la mitad del daño si la supera. Las criaturas de tipo “planta” fallan automáticamente la tirada. Como alternativa, haz objetivo a una planta no mágica que no sea una criatura, como un árbol o un arbusto. No hará una tirada de salvación: sim- plemente se marchitará y morirá. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Mastín fiel", "lv": 4, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (un silbato de plata) Duración: 8 horas¶Conjuras un perro guardián en un espacio sin ocupar que puedas ver dentro del alcance. El perro permanece hasta que el conjuro termine o hasta que os alejéis a más de 90 m. Solo tú puedes verlo y es intangible e invulnerable. Cuando una criatura Pequeña o de mayor tamaño se acerque a 9 m o menos de él sin decir la contra- seña que especifiques al lanzar el conjuro, el mastín empezará a ladrar ruidosamente. Además, tiene visión verdadera hasta 9 m. Al principio de cada uno de tus turnos, el mastín tratará de morder a un enemigo que esté a 1,5 m o menos de él. Ese enemigo deberá superar una ti- rada de salvación de Destreza o sufrirá 4d8 de daño de fuerza. En tus siguientes turnos, puedes usar una acción de magia para mover el mastín hasta 9 m."}, {"n": "Mensaje", "lv": 0, "esc": "transmutación", "cl": ["bardo", "druida", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 36 m¶Componentes: S, M (un alambre de cobre) Duración: 1 asalto¶Moldear la piedra¶Señalas a una criatura dentro del alcance y susurras un mensaje. El objetivo (y únicamente el objetivo) escucha el mensaje y puede responder con un susu- rro que solamente tú puedes oír. Puedes lanzar este conjuro a través de objetos físicos si conoces al objetivo y sabes que está detrás de la barrera. El silencio mágico, 30 cm de piedra, metal o madera o una lámina fina de plomo blo- quean el conjuro.¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (arcilla blanda) Duración: Instantáneo"}, {"n": "Mensajero animal", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "druida", "explorador"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 9 m Componentes: V, S, M (unas migajas de comida) Duración: 24 horas¶Una bestia Diminuta de tu elección que puedas ver dentro del alcance deberá superar una tirada de salvación de Carisma o intentará enviar un mensaje por ti (si el valor de desafío del objetivo no es 0, la supera automáticamente). Indica un lugar que hayas visitado y da una descripción general del destina- tario, como “una persona que lleva un uniforme de guardia de la ciudad” o “una enana pelirroja con un gorro puntiagudo”. Además, le transmites al animal un mensaje de hasta 25 palabras. Hasta que termine el conjuro, la bestia viajará hacia el lugar elegido y recorrerá aproximadamente 37,5 km cada 24 horas o 75 km si puede volar. Cuando llegue, la bestia entregará tu mensaje a la criatura que le hayas descrito e imitará tu forma de comunicarte. Si la bestia no llega a su destino antes de que el conjuro termine, el mensaje se pierde y la bestia regresa al lugar donde lanzaste el conjuro. Con un espacio de conjuro de nivel superior. La duración del conjuro aumenta en 48 horas por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Mente en blanco", "lv": 8, "esc": "Abjuración", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: 24 horas¶Hasta que el conjuro termine, una criatura volun- taria a la que toques tendrá inmunidad al daño psí- quico y al estado de hechizada. Además, no se verá afectada por nada que pudiera percibir sus emocio- nes o alineamiento, leer sus pensamientos o detec- tar mágicamente su ubicación, y ningún conjuro (ni siquiera deseo) puede conseguir información sobre el objetivo, observarlo desde lejos o controlar su mente."}, {"n": "Mover la tierra", "lv": 6, "esc": "Transmutación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una pala en miniatura) Duración: Concentración, hasta 2 horas¶Elige una zona de terreno que no tenga más de 12 m de lado dentro del alcance. Puedes cambiar como quieras la forma de la tierra, la arena o la arcilla del área hasta que termine el conjuro. Puedes aumentar o reducir la elevación de la zona, crear o llenar una zanja, levantar o derribar una pared o formar una columna. La extensión de cualquiera de estos cam- bios no puede superar la mitad de la dimensión más larga de la zona. Por ejemplo, si afectas a un cuadra- do de 12 m de lado, puedes crear una columna de hasta 6 m de altura, aumentar o reducir la elevación del cuadrado hasta 6 m, cavar una zanja de hasta 6 m de profundidad, etc. Estos cambios tardan 10 minutos en completarse. Como la transformación de la zona se produce poco a poco, las criaturas que haya en ella generalmente no quedarán atrapadas por el movimiento del suelo ni sufrirán daños por ello. Al final de cada 10 minutos que pases concentrán- dote en el conjuro, podrás elegir una nueva zona de terreno que modificar dentro del alcance. Este conjuro no puede manipular la piedra natural ni las construcciones de piedra. Las rocas y las estructuras se desplazan para acomodar el nuevo terreno. Si la forma que le das al terreno hace que una estructura sea inestable, esta podría hundirse. De forma similar, este conjuro no afecta directa- mente al crecimiento vegetal y la tierra desplazada se lleva con ella cualquier planta que haya."}, {"n": "Muro de espinas", "lv": 6, "esc": "Conjuración", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un puñado de espinas vegetales) Duración: Concentración, hasta 10 minutos¶Creas un muro de maleza enmarañada que está repleta de espinas puntiagudas como agujas. Este muro aparecerá dentro del alcance sobre una super- ficie sólida y durará hasta que termine el conjuro. Eliges si crear un muro recto de hasta 18 m de lon- gitud, 3 m de altura y 1,5 m de grosor o un círculo de arbustos de hasta 6 m de diámetro, 6 m de altura y 1,5 m de grosor. El muro bloquea la línea de visión. Cuando aparezca el muro, todas las criaturas situadas en su área hacen una tirada de salvación de Destreza; sufrirán 7d8 de daño perforante si la fallan o la mitad de daño si la superan. Las criaturas pueden atravesar el muro, pero es un proceso lento y doloroso. Una criatura que atra- viese el muro deberá gastar 4 m de movimiento por cada metro que avance. Además, la primera vez que una criatura entre en un espacio del muro o termine su turno allí, realizará una tirada de salvación de Destreza; sufrirá 7d8 de daño cortante si la falla o la mitad del daño si la supera Una criatura solo hace esta tirada una vez por turno. Con un espacio de conjuro de nivel superior. Los dos tipos de daño aumentan en 1d8 por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Muro de fuego", "lv": 4, "esc": "Evocación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un trozo de carbón) Duración: Concentración, hasta 1 minuto¶Creas un muro de fuego en una superficie sólida dentro del alcance. Puedes formar un muro recto de hasta 18 m de longitud, 6 m de altura y 30 cm de grosor o un muro circular de hasta 6 m de diámetro, 6 m de altura y 30 cm de grosor. El muro es opaco y durará hasta que termine el conjuro. Cuando aparezca el muro, todas las criaturas situadas en su área hacen una tirada de salvación de Destreza; sufrirán 5d8 de daño de fuego si la fallan o la mitad de daño si la superan. Un lado del muro, que seleccionas cuando lanzas el conjuro, causa 5d8 de daño de fuego a cada cria- tura que termine su turno a 3 m o menos de ese lado o dentro del muro. Una criatura recibirá el mismo daño cuando entre en el muro por primera vez en un turno o termine su turno allí. El otro lado del muro no causa ningún daño.¶Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Muro de fuerza", "lv": 5, "esc": "Evocación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un trozo de vidrio) Duración: Concentración, hasta 10 minutos¶Un muro de fuerza invisible surge de la nada en un punto de tu elección dentro del alcance. Este muro adopta la orientación que tú elijas y puede ser tanto una barrera horizontal o vertical como estar situado en ángulo. También puede flotar o estar apoyado en una superficie sólida. Puedes darle for- ma de cúpula semiesférica o de globo con un radio de hasta 3 m o puedes hacer que sea una superficie plana compuesta por hasta 10 paneles de 3 m por 3 m. Cada panel debe estar adyacente a otro panel. En cualquiera de las formas, el muro tiene un grosor de 6 mm y durará hasta que termine el conjuro. Al aparecer, si el muro atraviesa el espacio de una criatura, esta es empujada hacia un lado del muro (tú eliges cuál). Nada puede atravesar el muro físicamente. Es inmune a todo el daño y no se puede eliminar mediante disipar magia. Sin embargo, un conjuro desintegrar destruye el muro al instante. El muro también se extiende hasta el Plano Etéreo e impide el viaje etéreo a través de él."}, {"n": "Muro de hielo", "lv": 6, "esc": "Evocación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un trozo de cuarzo) Duración: Concentración, hasta 10 minutos¶Creas un muro de hielo en una superficie sólida dentro del alcance. Puedes darle forma de cúpula semiesférica o de globo con un radio de hasta 3 m o puedes hacer que sea una superficie plana com- puesta por hasta 10 paneles cuadrados de 3 m de lado. Cada panel debe estar adyacente a otro panel. En cualquiera de las formas, el muro tiene un grosor de 30 cm y durará hasta que termine el conjuro. Al aparecer, si el muro atraviesa el espacio de una criatura, esta es empujada hacia un lado del muro (tú eliges cuál) y hace una tirada de salvación de Destreza; sufrirá 10d6 de daño de frío si la falla o la mitad de daño si la supera. El muro es un objeto que se puede dañar y, por tanto, atravesar. Tiene una CA de 12, 30 puntos de golpe por cada sección de 3 m de lado, inmunidad al daño de frío, psíquico y de veneno y vulnerabi- lidad al daño de fuego. Si se reduce una sección¶del muro de 3 m de lado a 0 puntos de golpe, se destruirá y dejará una capa de aire gélido en el lugar que ocupaba. Si una criatura pasa por la capa de aire gélido por primera vez en un turno, deberá hacer una tirada de salvación de Constitución; sufrirá 5d6 de daño de frío si la falla o la mitad de daño si la supera. Con un espacio de conjuro de nivel superior. El daño que causa el muro al aparecer aumenta en 2d6 y el que se sufre por cruzar la capa de aire géli- do aumenta en 1d6 por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Muro de piedra", "lv": 5, "esc": "Evocación", "cl": ["druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un cubo de granito) Duración: Concentración, hasta 10 minutos¶Un muro no mágico de piedra sólida brota en un punto de tu elección dentro del alcance. Tiene 15 cm de grosor y está compuesto de 10 paneles de 3 m por 3 m. Cada panel debe estar adyacente a otro pa- nel. Como alternativa, puedes crear paneles de 3 m por 6 m cuyo grosor sea solo de 7,5 cm. Al aparecer, si el muro atraviesa el espacio de una criatura, esta es empujada hacia un lado del muro (tú eliges cuál). Si una criatura fuera a quedar rodeada por todas partes por el muro (o por el muro y otra superficie sólida), puede hacer una tirada de salvación de Destreza. Si la supera, podrá usar su reacción para moverse hasta su velocidad y no quedar encerrada por el muro. El muro puede adoptar la forma que desees, pero no puede ocupar el mismo espacio que una criatura o un objeto. El muro no tiene por qué ser vertical ni apoyarse en una base firme. Sin embargo, sí debe fundirse con alguna masa de piedra existente que lo sostenga firmemente. Así, podrías usar este conjuro para formar un puente que cruce una sima o para crear una rampa. Si creas un muro que se extienda más de 6 m, de- bes reducir a la mitad el tamaño de cada panel para crear soportes. Puedes moldear el muro de forma tosca para que tenga almenas y elementos similares. El muro es un objeto hecho de piedra que se puede dañar y, por tanto, atravesar. Cada panel tiene una CA de 15, 30 puntos de golpe por cada 2,5 cm de grosor e inmunidad al daño psíquico y de veneno. Si los puntos de golpe de un panel se reducen a 0, se destruye, lo que podría provocar que los paneles conectados se derrumben, a discreción de tu GM. Si mantienes la concentración en este conjuro durante toda su duración, el muro se vuelve perma- nente y no se puede disipar. De lo contrario, desapa- rece en cuanto el conjuro termine."}, {"n": "Muro de viento", "lv": 3, "esc": "Evocación", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (un abanico y una pluma) Duración: Concentración, hasta 1 minuto¶Un muro conformado por un intenso viento surge del suelo en un punto de tu elección dentro del alcance. Puedes formar un muro de hasta 15 m de longitud, 4,5 m de altura y 30 cm de grosor. Puedes darle a ese muro la forma que quieras, siempre que trace una ruta continua por el suelo, y durará hasta que termine el conjuro. Cuando aparezca el muro, todas las criaturas situadas en su área hacen una tirada de salvación de Fuerza; sufrirán 4d8 de daño contundente si la fallan o la mitad de daño si la superan. El viento fuerte mantiene a raya la niebla, el humo y otros gases. Las criaturas voladoras de tamaño Pequeño o menor no pueden atravesar el muro. Los materiales sueltos de poco peso que entran en el muro salen volando hacia arriba. Las flechas, los virotes y otros proyectiles ordinarios lanzados a ob- jetivos que estén detrás del muro salen despedidos hacia arriba y fallan automáticamente. Los pedrus- cos lanzados por gigantes o máquinas de asedio y los proyectiles similares no se ven afectados. Las criaturas en forma gaseosa no pueden atravesarlo."}, {"n": "Muro prismático", "lv": 9, "esc": "Abjuración", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: 10 minutos¶Un plano de luz rutilante y multicolor forma un muro vertical opaco (de hasta 27 m de largo, 9 m de alto y 2,5 cm de grosor) centrado en un punto dentro del alcance. Como alternativa, le das al muro la forma de un globo de hasta 9 m de diámetro centrado en un punto dentro del alcance. El muro permanecerá allí hasta que termine el conjuro. Si lo colocas en un espacio que ocupa una criatura, el conjuro termina al instante sin surtir efecto. El muro emite luz brillante hasta 30 m y luz tenue 30 m más allá. Las criaturas que indiques cuando lanzas el conjuro y tú podéis atravesar el muro y estar cerca de él sin sufrir daños. Si otra criatura que pueda ver el muro se acerca a 6 m o menos de él, deberá superar una tirada de salvación de Constitu- ción o tendrá el estado de cegada durante 1 minuto. El muro consta de siete capas, cada una de un co- lor distinto. Cuando una criatura meta una mano en el muro o lo atraviese, lo debe hacer capa por capa hasta superarlas todas. Para cada una, deberá rea- lizar una tirada de salvación de Destreza o quedará¶afectada por las propiedades de esa capa, como se describe en la tabla “Capas prismáticas”. El muro, que tiene una CA de 10, se puede destruir capa por capa, en orden de rojo a violeta, por el me- dio específico para cada una de ellas. Si se destruye una capa, seguirá eliminada hasta que termine el conjuro. Campo antimagia no tiene efecto en el muro y disipar magia solo puede afectar a la capa violeta.¶Capas prismáticas Orden¶Roja. Si falla la tirada: 12d6 de daño de fuego. Si supera la tirada: la mitad de daño. Efectos adicionales: los ataques a distancia no mágicos no pueden atravesar esta capa, que se destruye si recibe al menos 25 de daño de frío.¶Naranja. Si falla la tirada: 12d6 de daño de ácido. Si supera la tirada: la mitad de daño. Efectos adicionales: los ataques a distancia mágicos no atraviesan esta capa, que puede destruirse mediante un viento fuerte (como el que crea ráfaga de viento).¶Amarilla. Si falla la tirada: 12d6 de daño de relámpago. Si supera la tirada: la mitad de daño. Efectos adicionales: la capa se destruye si recibe al menos 60 de daño de fuerza.¶Verde. Si falla la tirada: 12d6 de daño de veneno. Si supera la tirada: la mitad de daño. Efectos adicionales: un conjuro pasamuros u otro del mismo nivel o superior que puedan abrir un portal en una superficie sólida destruirán esta capa.¶Azul. Si falla la tirada: 12d6 de daño de frío. Si supera la tirada: la mitad de daño. Efectos adicionales: la capa se destruye si recibe al menos 25 de daño de fuego.¶Efectos¶Añil. Si falla la tirada: el objetivo tendrá el estado de apresado y hará una tirada de salvación de Constitución al final de cada uno de sus turnos. Si la supera tres veces, el estado terminará. Si la falla tres veces, tendrá el estado de petrificado hasta que lo libere un efecto como el del conjuro restablecimiento mayor. Los éxitos y los fallos no tienen por qué ser consecutivos: lleva la cuenta de ambos hasta que el objetivo tenga tres de un mismo tipo. Efectos adicionales: no es posible lanzar conjuros a través de esta capa, que puede destruirse mediante la luz brillante del conjuro luz del día.¶Orden¶Efectos¶Violeta. Si falla la tirada: el objetivo tendrá el estado de cegado y hará una tirada de salvación de Sabiduría al principio de tu siguiente turno. Si la supera, el estado terminará. Si la falla, el estado terminará y la criatura se teletransportará a otro plano de existencia (a elección de tu GM). Efectos adicionales: esta capa puede destruirse mediante disipar magia."}, {"n": "Nube aniquiladora", "lv": 5, "esc": "Conjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Creas una esfera de una niebla amarillo-verdosa de 6 m de radio centrada en un punto dentro del alcance. La niebla dura hasta que el conjuro termine o hasta que la disperse un viento intenso (por ejem- plo, el que crea ráfaga de viento), lo que pondrá fin al conjuro. La zona que ocupa está muy oscura. Todas las criaturas situadas en la esfera hacen una tirada de salvación de Constitución; sufrirán 5d8 de daño de veneno si la fallan o la mitad del daño si la superan. Una criatura también deberá ha- cer esta tirada cuando la esfera entre en su espacio o cuando la criatura entre en la esfera o termine su turno en ella. Una criatura solo hace esta tirada una vez por turno. La esfera se aleja de ti 3 m al principio de cada uno de tus turnos. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Nube apestosa", "lv": 3, "esc": "Conjuración", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (un huevo podrido) Duración: Concentración, hasta 1 minuto¶Creas una esfera de gas nauseabundo y amarillento de 6 m de radio centrada en un punto dentro del alcance. La nube está muy oscura y permanece en el aire hasta que el conjuro termine o hasta que la disperse un viento fuerte (por ejemplo, el que crea ráfaga de viento). Todas las criaturas que comiencen su turno en la esfera deberán superar una tirada de salvación de Constitución o tendrán el estado de envenenadas hasta el final del turno actual. Mientras estén enve- nenadas de esta forma, no podrán realizar acciones ni acciones adicionales."}, {"n": "Nube de oscurecimiento", "lv": 1, "esc": "Conjuración", "cl": ["druida", "explorador", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S"}, {"n": "Duración: Concentración, hasta 1 hora", "lv": 4, "esc": "Adivinación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (un poco de pelo de murciélago) Duración: Concentración, hasta 1 hora¶Creas una esfera de niebla de 6 m de radio centrada en un punto dentro del alcance. La esfera está muy oscura y dura hasta que el conjuro termine o hasta que la disperse un viento fuerte (por ejemplo, el que crea ráfaga de viento). Con un espacio de conjuro de nivel superior. El radio de la niebla aumenta en 6 m por cada nivel por encima de 1 que tenga el espacio.¶Nube incendiaria¶Creas un ojo invisible e invulnerable dentro del alcance que levita hasta que el conjuro termine. Recibes mentalmente información visual desde el ojo, que puede mirar en cualquier dirección y tiene visión en la oscuridad hasta 9 m. Como acción adicional, puedes mover el ojo hasta 9 m en cualquier dirección. El ojo no podrá atrave- sar una barrera sólida, pero podrá pasar por cual- quier abertura de 2,5 cm de diámetro como mínimo.¶Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Instantáneo¶Una nube turbulenta de humo y ascuas llena una esfera de 6 m de radio centrada en un punto dentro del alcance. La zona que ocupa la nube está muy oscura y dura hasta que el conjuro termine o hasta que la disperse un viento fuerte (por ejemplo, el que crea ráfaga de viento). Cuando aparezca la nube, todas las criaturas dentro de ella harán una tirada de salvación de Destreza; sufrirán 10d8 de daño de fuego si la fallan o la mitad del daño si la superan. Una criatura tam- bién deberá hacer esta tirada cuando la esfera entre en su espacio o cuando la criatura entre en la esfera o termine su turno en ella. Una criatura solo hace esta tirada una vez por turno. La nube se aleja de ti 3 m en la dirección que elijas al principio de cada uno de tus turnos.¶Desatas una ola de energía atronadora. Todas las criaturas situadas en un cubo de 4,5 m de lado adya- cente a ti harán una tirada de salvación de Consti- tución. Si la fallan, recibirán 2d8 de daño de trueno y serán empujadas 3 m respecto a ti. Si la superan, solo sufrirán la mitad de ese daño. Además, a los objetos sueltos que estén completa- mente dentro del cubo se les empujará 3 m respecto a ti y la explosión atronadora podrá oírse a 90 m de distancia. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima"}, {"n": "Ofuscación", "lv": 8, "esc": "Encantamiento", "cl": ["bardo", "brujo", "druida", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (un llavero sin llaves) Duración: Instantáneo¶Ojo arcano¶Atacas la mente de una criatura que puedas ver dentro del alcance. El objetivo hace una tirada de salvación de Inteligencia. Si la falla, sufrirá 10d12 de daño ps
