íquico y no podrá lanzar conjuros ni realizar acciones de magia. Al final de cada 30 días, el objetivo repite la tirada de salvación y, si tiene éxito, se librará del efecto. También se puede finalizar este efecto mediante un conjuro curar, deseo o restablecimiento mayor. Si supera la tirada, solo sufrirá la mitad de ese daño."}, {"n": "Orbe cromático", "lv": 1, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (un diamante que valga al menos 50 po) Duración: Instantáneo¶Lanzas un orbe de energía a un objetivo dentro del alcance. Elige entre ácido, frío, fuego, relámpago, trueno o veneno para el tipo de orbe creado y des- pués haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 3d8 de daño del tipo elegido. Si sacas el mismo número en dos o más de los d8, el orbe salta a otro objetivo distinto de tu elección que esté a 9 m o menos del objetivo. Haz una tirada de ataque contra el nuevo objetivo y otra tirada de daño. El orbe no puede volver a saltar, a menos que¶lances el conjuro con un espacio de nivel 2 o supe- rior. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 1 que tenga el espacio. El orbe puede saltar un máximo de veces igual al nivel del espacio gastado. Una criatura solo puede ser el objetivo una vez por cada lanzamiento del conjuro."}, {"n": "Orden imperiosa", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "clérigo", "paladín"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Das una orden de una sola palabra a una criatura que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o verse obligado a obedecer la orden en su próximo turno. Elige una de las siguientes órdenes: Acércate. El objetivo se acerca a ti por la ruta más corta y directa posible, y su turno acaba si se sitúa a 1,5 m o menos de ti. Detente. En su turno, el objetivo no se mueve y no usa acciones ni acciones adicionales. Huye. El objetivo emplea su turno en alejarse de ti de la manera más rápida posible. Póstrate. El objetivo adopta el estado de derribado y termina su turno. Suelta. El objetivo suelta lo que sea que esté suje- tando y acaba su turno. Con un espacio de conjuro de nivel superior. Puedes afectar a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Oscuridad", "lv": 2, "esc": "Evocación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, M (pelaje de murciélago y un trozo de carbón) Duración: Concentración, hasta 10 minutos¶Hasta que el conjuro termine, una oscuridad mágica se propaga desde un punto dentro del alcance y llena una esfera de 4,5 m de radio. La visión en la oscuridad no puede ver a través de ella y la luz no mágica no puede alumbrarla. Como alternativa, lanzas el conjuro sobre un objeto que no lleve o vista nadie, lo que hará que la oscuridad llene una emanación de 4,5 m que se origina en él. Cubrir el objeto con algo opaco, como un cuenco o un casco, bloqueará la oscuridad. Si cualquier zona del conjuro se superpone con una zona de luz brillante o luz tenue creada por¶un conjuro de nivel 2 o inferior, el conjuro que creó esa luz se disipa."}, {"n": "Palabra de curación", "lv": 1, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 18 m Componentes: V Duración: Instantáneo¶Una criatura de tu elección que puedas ver dentro del alcance recupera una cantidad de puntos de golpe igual a 2d4 más tu modificador por aptitud mágica. Con un espacio de conjuro de nivel superior. La curación aumenta en 2d4 por cada nivel por enci- ma de 1 que tenga el espacio."}, {"n": "Palabra de curación en masa", "lv": 3, "esc": "Abjuración", "cl": ["bardo", "clérigo"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 18 m Componentes: V Duración: Instantáneo¶Hasta seis criaturas de tu elección que puedas ver dentro del alcance recuperan una cantidad de puntos de golpe igual a 2d4 más tu modificador por aptitud mágica. Con un espacio de conjuro de nivel superior. La curación aumenta en 1d4 por cada nivel por enci- ma de 3 que tenga el espacio."}, {"n": "Palabra de poder: aturdir", "lv": 8, "esc": "Encantamiento", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Abrumas la mente de una criatura que puedas ver dentro del alcance. Si el objetivo tiene 150 puntos de golpe o menos, tendrá el estado de aturdido. De lo contrario, su velocidad será 0 hasta el princi- pio de tu siguiente turno. El objetivo aturdido hace una tirada de salvación de Constitución al final de cada uno de sus turnos y, si tiene éxito, se librará del estado."}, {"n": "Palabra de poder: matar", "lv": 9, "esc": "Encantamiento", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Obligas a morir a una criatura que puedas ver dentro del alcance. Si el objetivo tiene 100 puntos¶de golpe o menos, morirá. De lo contrario, sufrirá 12d12 de daño psíquico.¶Palabra de poder: sanar¶Puntos de golpe"}, {"n": "Efecto", "lv": 9, "esc": "Encantamiento", "cl": ["bardo", "clérigo"], "t": "0–20¶El objetivo muere.¶Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶21–30¶El objetivo tiene los estados de aturdido, cegado y ensordecido durante 1 hora.¶31–40¶El objetivo tiene los estados de cegado y ensordecido durante 10 minutos.¶41–50¶El objetivo tiene el estado de ensordecido durante 1 minuto.¶Una criatura que puedas ver dentro del alcance se ve envuelta por una oleada de energía sana- dora. El objetivo recupera todos sus puntos de golpe. Si la criatura tiene los estados de asustada, aturdida, envenenada, hechizada o paralizada, los estados terminan. Si la criatura tiene el estado de derribada, puede usar su reacción para levantarse."}, {"n": "Palabra de regreso", "lv": 6, "esc": "Conjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 1,5 m Componentes: V Duración: Instantáneo¶Tú y hasta cinco criaturas voluntarias a 1,5 m o menos de ti os teletransportáis al instante a un santuario designado previamente. Tú y cualquier criatura que se teletransporte contigo a pareceréis en el espacio sin ocupar más cercano al punto designado al preparar el santuario (consulta más adelante). Si lanzas este conjuro sin preparar antes un santuario, no tiene ningún efecto. Debes designar un lugar como santuario lanzando este conjuro allí; por ejemplo, en un templo."}, {"n": "Palabra divina", "lv": 7, "esc": "Evocación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 9 m Componentes: V Duración: Instantáneo¶Susurras una palabra imbuida con el poder de los Planos Superiores. Todas las criaturas de tu elección dentro del alcance realizan una tirada de salvación de Carisma. Si la fallan, los objetivos que tengan 50 puntos de golpe o menos sufrirán un efecto en función de sus puntos de golpe actuales, como se muestra en la tabla “Efectos de palabra divina”. Con independencia de sus puntos de golpe, cual- quier objetivo celestial, elemental, feérico o infer- nal que falle su tirada de salvación se verá forzado a regresar a su plano de origen (si no está en él ya) y no podrá regresar al plano actual durante 24 horas por cualquier medio que no sea un conjuro deseo.¶Efectos de palabra divina"}, {"n": "Parar el tiempo", "lv": 9, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V Duración: Instantáneo¶Detienes el paso del tiempo brevemente para todo el mundo menos para ti. Para las demás criaturas, el tiempo no avanza, mientras que tú puedes llevar a cabo 1d4 + 1 turnos seguidos, durante los cuales puedes usar acciones y moverte con normalidad. Este conjuro termina si una de las acciones que usas o uno de los efectos que creas durante este periodo afecta a una criatura que no seas tú o a un objeto que lleve o vista alguien que no seas tú. También termina si te mueves a un sitio que esté a más de 300 m del lugar donde lo lanzaste."}, {"n": "Pasamuros", "lv": 5, "esc": "Transmutación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una pizca de semillas de sésamo) Duración: 1 hora¶Aparece un pasaje en un punto que puedas ver en una superficie de madera, yeso o piedra (como una pared, un techo o un suelo) dentro del alcance y se mantiene hasta que termine el conjuro. Tú eliges las dimensiones de la abertura: hasta 1,5 m de ancho, 2,4 m de alto y 6 m de largo. El pasaje no crea ninguna inestabilidad en la estructura que lo rodea. Cuando la abertura desaparece, las criaturas o los objetos que sigan en el pasaje creado por el con- juro serán expulsados sin daño alguno al espacio sin ocupar más cercano a la superficie sobre la que lanzaste el conjuro."}, {"n": "Pasar sin rastro", "lv": 2, "esc": "Abjuración", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (cenizas de muérdago quemado) Duración: Concentración, hasta 1 hora¶Hasta que el conjuro termine, irradias un aura de ocultación en una emanación de 9 m. Mientras permanezcáis dentro, las criaturas que elijas y tú tendréis un bonificador de +10 a las pruebas de Destreza (Sigilo) y no dejaréis huellas."}, {"n": "Paso arbóreo", "lv": 5, "esc": "Conjuración", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 1 minuto¶Obtienes la capacidad de entrar en un árbol y mo- verte desde dentro al interior de otro árbol del mismo tipo que esté a 150 m o menos. Ambos árbo- les tienen que estar vivos y ser al menos del mis- mo tamaño que tú. Para entrar en un árbol debes gastar 1,5 m de movimiento. Al instante conoces la ubicación de todos los demás árboles del mismo tipo situados a 150 m o menos y, como parte del movimiento gastado para entrar en el árbol, puedes pasar al interior de uno de esos árboles o salir del árbol en el que estás. Apareces en un punto de tu elección a 1,5 m o menos del árbol de destino gastando otros 1,5 m de movimiento. Si no te queda movimiento, apareces a 1,5 m o menos del árbol en el que entraste. Puedes usar esta capacidad de transporte solo una vez en cada uno de tus turnos y debes terminar cada turno fuera de un árbol."}, {"n": "Paso brumoso", "lv": 2, "esc": "Conjuración", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V Duración: Instantáneo¶Una niebla plateada te rodea brevemente y te tele- transportas hasta 9 m a un espacio sin ocupar que puedas ver."}, {"n": "Patrón hipnótico", "lv": 3, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una pizca de confeti) Duración: Concentración, hasta 1 minuto¶Creas un patrón de colores que se retuercen en un cubo de 9 m de lado dentro del alcance. El patrón aparece un instante y se desvanece. Todas las cria- turas de la zona que puedan ver el patrón deberán superar una tirada de salvación de Sabiduría o tendrán el estado de hechizadas hasta que termine el conjuro. Mientras estén hechizadas, las criaturas tendrán una velocidad de 0 y el estado de incapaci- tadas.¶El conjuro finaliza para una criatura afectada si esta recibe daño o si alguien más emplea una acción para sacudir a dicha criatura y sacarla de su estu- por."}, {"n": "Pequeña choza", "lv": 3, "esc": "Evocación", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: 1 minuto o un ritual Alcance: Lanzador Componentes: V, S, M (una cuenta de cristal) Duración: 8 horas¶Una emanación de 3 m surge a tu alrededor y per- manece estática hasta que termine el conjuro. El conjuro fallará al lanzarlo si la emanación no es lo bastante grande como para cubrir a todas las criaturas en su área. Las criaturas y los objetos que haya en la emana- ción cuando lances el conjuro pueden moverse por ella libremente. El resto de criaturas y objetos no pueden atravesarla. No pueden lanzarse conjuros de nivel 3 o inferior a través de ella y los efectos de estos conjuros no pueden penetrar a su interior. Dentro de la emanación, la atmósfera es cómoda y seca, con independencia del clima exterior. Hasta que el conjuro termine, puedes hacer que el inte- rior esté iluminado con luz tenue o a oscuras (no requiere acción). Desde el exterior, la emanación es opaca y del color que elijas, pero es transparente desde el interior. El conjuro termina antes si sales de la emanación o lo vuelves a lanzar."}, {"n": "Perdición", "lv": 1, "esc": "Encantamiento", "cl": ["bardo", "brujo", "clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una gota de sangre) Duración: Concentración, hasta 1 minuto¶Hasta tres criaturas de tu elección a las que puedas ver dentro del alcance deberán hacer una tirada de salvación de Carisma cada una. Siempre que un ob- jetivo que haya fallado esta tirada de salvación haga una tirada de ataque o de salvación antes de que termine el conjuro, deberá restar 1d4 al resultado de dicha tirada. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Piedad con los moribundos", "lv": 0, "esc": "nigromancia", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 4,5 m Componentes: V, S Duración: Instantáneo¶Elige a una criatura dentro del alcance que tenga 0 puntos de golpe y no esté muerta. La criatura pasa a estar estable. Mejora de truco. El alcance se duplica cuando alcanzas los niveles 5 (9 m), 11 (18 m) y 17 (36 m)."}, {"n": "Piel pétrea", "lv": 4, "esc": "Transmutación", "cl": ["druida", "explorador", "hechicero", "mago"], "t": "hechicero, mago)¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (polvo de diamante que valga al menos 100 po y que se consume como parte del conjuro) Duración: Concentración, hasta 1 hora¶Hasta que el conjuro termine, una criatura volunta- ria a la que toques tiene resistencia al daño contun- dente, cortante y perforante."}, {"n": "Piel robliza", "lv": 2, "esc": "Transmutación", "cl": ["druida", "explorador"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Toque Componentes: V, S, M (un puñado de corteza) Duración: 1 hora¶Tocas a una criatura voluntaria. Hasta que el conjuro termine, la piel del objetivo adopta una apa- riencia de corteza y su clase de armadura no podrá ser inferior a 17."}, {"n": "Plaga de insectos", "lv": 5, "esc": "Conjuración", "cl": ["clérigo", "druida", "hechicero"], "t": "Tiempo de lanzamiento: Acción Alcance: 90 m Componentes: V, S, M (una langosta) Duración: Concentración, hasta 10 minutos¶Un enjambre de langostas llena una esfera de 6 m de radio centrada en un punto de tu elección dentro del alcance. Permanece hasta que termine el conjuro y la zona se considera ligeramente oscura y terreno difícil. Cuando aparezca el enjambre, todas las criaturas dentro de él harán una tirada de salvación de Cons- titución; sufrirán 4d10 de daño perforante si la fa- llan o la mitad del daño si la superan. Una criatura también hará esta tirada cuando entre en el área del conjuro por primera vez en un turno o termine su turno allí. Una criatura solo hace esta tirada una vez por turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 5 que tenga el espacio."}, {"n": "Plegaria de curación", "lv": 2, "esc": "Abjuración", "cl": ["clérigo", "paladín"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: 9 m Componentes: V Duración: Instantáneo¶Hasta cinco criaturas de tu elección que permanez- can dentro del alcance del conjuro durante todo su lanzamiento obtienen los beneficios de un descanso corto y también recuperan 2d8 puntos de golpe. Las criaturas no pueden volver a beneficiarse de este conjuro hasta que finalicen un descanso largo. Con un espacio de conjuro de nivel superior. La curación aumenta en 1d8 por cada nivel por enci- ma de 2 que tenga el espacio."}, {"n": "Polimorfar", "lv": 4, "esc": "Transmutación", "cl": ["bardo", "druida", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un capullo de oruga) Duración: Concentración, hasta 1 hora¶Intentas transformar en una bestia a una c riatura que puedas ver dentro del alcance. El objetivo debe superar una tirada de salvación de Sabiduría o adoptará la forma de una bestia hasta que t ermine el conjuro. Esa forma puede ser la de cualquier bestia que elijas y cuyo valor de desafío sea igual o menor que el del objetivo (o que el nivel del objetivo si este no tiene un valor de desafío). El perfil del objetivo se sustituye por el de la bestia elegida, pero el objetivo conservará su alineamiento, personalidad, tipo de criatura, puntos de golpe y dados de puntos de golpe. En el apartado “Animales” del capítulo “Monstruos” puedes consultar varios perfiles de bestias. El objetivo obtiene una cantidad de puntos de golpe temporales igual a los puntos de golpe de la forma de bestia. Estos puntos de golpe temporales se desvanecerán si conserva alguno cuando el con- juro termine. El conjuro termina antes de tiempo si el objetivo se queda sin puntos de golpe temporales. Las acciones que puede realizar el objetivo están limitadas por la anatomía de su nueva forma y no podrá hablar ni lanzar conjuros. El equipo del objetivo se funde con su nueva forma y la criatura no podrá usar ese equipo ni beneficiarse de él."}, {"n": "Polimorfar verdadero", "lv": 9, "esc": "Transmutación", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una gota de mercurio, un poco de goma arábiga y un jirón de humo) Duración: Concentración, hasta 1 hora¶Elige a una criatura o un objeto no mágico que pue- das ver dentro del alcance. La criatura adopta la for- ma de otra criatura o la de un objeto no mágico, o el objeto se convierte en una criatura (el objeto no puede llevarse ni vestirse). La transformación dura hasta que el conjuro termine o hasta que el objetivo muera o sea destruido, pero si mantienes la concen- tración en el conjuro durante su duración completa, permanecerá hasta que sea disipado. Una criatura no voluntaria puede hacer una tirada de salvación de Sabiduría y, si la supera, el conjuro no le afectará. Criatura en criatura. Si conviertes a una criatura en otro tipo de criatura, la nueva forma puede ser cualquier tipo que elijas y que tenga un valor de desafío igual o menor que el valor de desafío o el nivel del objetivo. El perfil del objetivo se reemplaza por el perfil de la nueva forma, pero mantiene sus puntos de golpe, dados de puntos de golpe, alinea- miento y personalidad. El objetivo obtiene una cantidad de puntos de golpe temporales igual a los puntos de golpe de la nueva forma. Estos puntos de golpe temporales se desvanecerán si conserva alguno cuando el conjuro termine. Las acciones que puede realizar el objetivo están limitadas por la anatomía de su nueva forma y no podrá hablar ni lanzar conjuros. El equipo del objetivo se funde con su nueva forma y la criatura no podrá usar ese equipo ni beneficiar- se de él. Objeto en criatura. Puedes convertir un objeto en cualquier tipo de criatura, siempre que el tamaño de dicha criatura no sea mayor que el del objeto y que su valor de desafío sea de 9 o menos. La criatura es amistosa contigo y tus aliados. En combate, sus turnos van inmediatamente después de los tuyos y obedece tus órdenes. Si el conjuro dura más de una hora, dejas de controlar a la criatura, que puede seguir siendo amistosa contigo en función de cómo la hayas t ratado. Criatura en objeto. Si conviertes a una criatura en un objeto, se transforma en esa forma junto con todo lo que lleve o vista, siempre que el tamaño del objeto no sea mayor que el de la criatura. El perfil de la criatura pasa a ser el del objeto y no tiene recuerdos del tiempo pasado en esa forma después de que el conjuro termine y vuelva a la normalidad.¶Conjuras un portal que enlaza un espacio sin ocupar que puedas ver dentro del alcance con una ubica- ción precisa situada en otro plano de existencia. El portal es una abertura circular a la que puedes dar un diámetro de entre 1,5 y 6 m, que puedes orientar en la dirección que elijas. El portal perma- nece hasta que el conjuro termine y puede verse su destino a través de él. El portal tiene una parte delantera y otra trasera en cada plano en el que aparece y solo es posible desplazarse a través de él si se atraviesa por la parte delantera. Cualquier cosa que lo haga es transportada al instante al otro plano y aparecerá en el espacio sin ocupar más cercano al portal. Las deidades y otros gobernantes de planos pueden impedir que los portales creados mediante este conjuro se abran en su presencia o en cualquier lugar dentro de sus dominios. Cuando lances el conjuro, puedes decir el nom- bre de una criatura específica (no sirven un pseudónimo, un título o un apodo). Si esa criatura está en un plano distinto al tuyo, el portal se abrirá junto a la criatura mencionada y la transportará al espacio sin ocupar más cercano en tu lado del por- tal. No obtienes ningún poder especial sobre la cria- tura y será libre de actuar según tu GM considere apropiado: puede irse, atacarte o ayudarte.¶Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un diamante que valga al menos 5000 po) Duración: Concentración, hasta 1 minuto¶Tocas a una criatura voluntaria y la dotas de una capacidad limitada de ver el futuro inmediato. Hasta que el conjuro termine, el objetivo tendrá ventaja en las pruebas con d20 y las demás cria- turas tendrán desventaja en las tiradas de ataque"}, {"n": "Potenciar característica", "lv": 2, "esc": "Transmutación", "cl": ["bardo", "clérigo", "druida", "explorador", "hechicero", "mago"], "t": "explorador, hechicero, mago)¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (pelo de animal o una pluma) Duración: Concentración, hasta 1 hora¶Tocas a una criatura y eliges Fuerza, Destreza, In- teligencia, Sabiduría o Carisma. Hasta que termine el conjuro, el objetivo tiene ventaja en las pruebas con la característica elegida. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 2 que tenga el espacio. Puedes elegir una característica distinta para cada objetivo."}, {"n": "Presciencia", "lv": 9, "esc": "Adivinación", "cl": ["bardo", "brujo", "druida", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Toque Componentes: V, S, M (una pluma de colibrí) Duración: 8 horas¶contra él. El conjuro termina antes si lo vuelves a lanzar."}, {"n": "Prestidigitación", "lv": 0, "esc": "transmutación", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 3 m Componentes: V, S Duración: Hasta 1 hora¶Creas un efecto mágico dentro del alcance, elegido de entre las opciones a continuación. Si lanzas este conjuro varias veces, puedes mantener activos a la vez hasta tres de sus efectos no instantáneos. Creación menor. Creas un abalorio no mágico o una imagen ilusoria que te cabe en la mano y dura hasta el final de tu siguiente turno. El abalorio no inflige daño y no tiene valor monetario. Efecto sensorial. Creas un efecto sensorial ins- tantáneo e inofensivo, como una lluvia de chispas, una ligera ráfaga de viento, tenues notas musicales o un olor extraño. Jugar con fuego. Enciendes o apagas al instante una vela, una antorcha o una hoguera pequeña. Limpiar o ensuciar. Limpias o ensucias al instante un objeto de hasta 0,03 m3. Marca mágica. Haces que aparezca una mancha de color, una pequeña marca o un símbolo en un objeto o superficie durante 1 hora. Sensación menor. Enfrías, calientas o das sabor a un material inerte de hasta 0,03 m3 durante 1 hora."}, {"n": "Prohibición", "lv": 6, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: 10 minutos o un ritual Alcance: Toque Componentes: V, S, M (polvo de rubí que valga al menos 1000 po) Duración: 1 día¶Creas una protección contra los viajes mágicos que cubre una zona del suelo de 4000 m2 hasta una al- tura de 9 m. Hasta que termine el conjuro, ninguna criatura podrá teletransportarse a esa zona ni entrar en ella usando portales, como los creados por el conjuro portal. El conjuro protege la zona frente al viaje interplanar, por lo que impide que cualquier criatura entre en el área mediante el Plano Astral, el Plano Etéreo, los Parajes Feéricos, el Páramo Sombrío o el conjuro desplazamiento entre planos. Además, el conjuro daña a los tipos de criaturas que elijas al lanzarlo. Elige uno o más de los siguien- tes: aberraciones, celestiales, elementales, feéricos, infernales y muertos vivientes. Cuando una criatura de un tipo elegido entre en la zona del conjuro por primera vez en un turno o termine su turno allí,¶recibirá 5d10 de daño radiante o necrótico (a tu elección cuando lanzas el conjuro). Puedes designar una contraseña cuando lanzas el conjuro. Si una criatura pronuncia la contraseña al entrar en el área, no recibirá daño del conjuro. La zona del conjuro no se puede superponer con la de otro conjuro prohibición. Si lanzas prohibición todos los días durante 30 días en la misma ubica- ción, el conjuro durará hasta que sea disipado y los componentes materiales se consumirán en el último lanzamiento."}, {"n": "Protección contra el bien y el mal", "lv": 1, "esc": "Abjuración", "cl": ["brujo", "clérigo", "druida", "mago", "paladín"], "t": "paladín)¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un frasco de agua bendita que valga al menos 25 po, que se consume como parte del conjuro) Duración: Concentración, hasta 10 minutos¶Hasta que el conjuro termine, una criatura voluntaria a la que toques estará protegida contra aberraciones, celestiales, elementales, feéricos, infernales o muertos vivientes. La protección con- cede varios beneficios. Las criaturas de esos tipos tendrán desventaja en las tiradas de ataque contra el objetivo. El objetivo tampoco puede ser poseído por las criaturas ni obtener los estados de asustado o hechizado a causa de ellas. Si el objetivo ya está asustado, hechizado o poseído por una criatura de estos tipos, dicho objetivo tendrá ventaja en cual- quier nueva tirada de salvación contra el efecto correspondiente."}, {"n": "Protección contra energía", "lv": 3, "esc": "Abjuración", "cl": ["clérigo", "druida", "explorador", "hechicero", "mago"], "t": "hechicero, mago) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 hora¶Hasta que termine el conjuro, una criatura volun- taria a la que toques tendrá resistencia a un tipo de daño de tu elección: ácido, frío, fuego, relámpago o trueno."}, {"n": "Protección contra veneno", "lv": 2, "esc": "Abjuración", "cl": ["clérigo", "druida", "explorador", "paladín"], "t": "paladín) Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: 1 hora¶Tocas a una criatura y pones fin al estado de enve- nenada si lo sufre. Hasta que termine el conjuro, el objetivo tiene ventaja en las tiradas de salvación¶para evitar o poner fin al estado de envenenado y resistencia al daño de veneno."}, {"n": "Proyección astral", "lv": 9, "esc": "Nigromancia", "cl": ["brujo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: 1 hora Alcance: 3 m Componentes: V, S, M (por cada objetivo del conjuro, un jacinto que valga al menos 1000 po y un lingote de plata que valga al menos 100 po, que se consumen como parte del conjuro) Duración: Hasta que sea disipado¶Tú y hasta ocho criaturas voluntarias dentro del alcance proyectáis vuestros cuerpos astrales al Plano Astral (si ya estáis allí, el conjuro termina al instante). El cuerpo material que deja atrás un objetivo queda en animación suspendida; tiene el estado de inconsciente, no necesita aire ni comida y no envejece. El cuerpo astral de un objetivo es semejante a su cuerpo en casi todo y replica su perfil y sus posesio- nes. La diferencia principal es un cordón plateado que sale de entre los omóplatos de la forma astral y se desvanece a los 30 cm. Si el cordón se corta (algo que solo puede ocurrir si un efecto así lo indi- ca), el cuerpo y la forma astral del objetivo mueren. Una forma astral puede viajar a través del Plano Astral. Si abandona el plano, el cuerpo y las posesio- nes del objetivo viajan a través del cordón de plata, permitiéndole volver a entrar en su cuerpo en el nuevo plano. El daño y otros efectos que se le apliquen a una forma astral no afectan al cuerpo del objetivo y viceversa. Si los puntos de golpe del cuerpo del ob- jetivo o de su forma astral se reducen a 0, el conjuro terminará para él. El conjuro termina para todos los objetivos si empleas una acción de magia para ponerle fin. Cuando el conjuro termine para un objetivo que no esté muerto, reaparecerá en su cuerpo y concluirá su animación suspendida."}, {"n": "Proyectar imagen", "lv": 7, "esc": "Ilusionismo", "cl": ["bardo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 750 km Componentes: V, S, M (una estatuilla de ti que valga al menos 5 po) Duración: Concentración, hasta 1 día¶Creas una copia ilusoria de ti que dura hasta que termine el conjuro. La copia puede aparecer en cualquier lugar dentro del alcance que hayas visto antes, sin importar que haya obstáculos que se in- terpongan. La ilusión tiene tu aspecto y suena como tú, pero es intangible. Si recibe cualquier daño, desaparecerá y el conjuro terminará.¶Puedes ver a través de sus ojos y oír con sus oídos como si estuvieras en su espacio. Como acción de magia, puedes hacer que se mueva hasta 18 m y que realice gestos, hable y se comporte del modo que quieras. Imita tu gestualidad a la perfección. La interacción física con la imagen revela que es una ilusión, ya que las cosas pueden atravesarla. Si una criatura emplea una acción de estudiar para examinar la imagen, puede determinar que es una ilusión si supera una prueba de Inteligencia (In- vestigación) contra tu CD de salvación de conjuros. Si la criatura descubre que la imagen es una ilusión, no se dejará engañar por ella y los sonidos que emi- ta le sonarán huecos."}, {"n": "Proyectil mágico", "lv": 1, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Creas tres dardos brillantes de fuerza mágica y cada uno de ellos golpea a una criatura de tu elección a la que puedas ver dentro del alcance. Cada dardo inflige 1d4 + 1 de daño de fuerza al objetivo. Todos los dardos aciertan a la vez y puedes dirigirlos para que acierten a una sola criatura o a varias. Con un espacio de conjuro de nivel superior. El conjuro crea un dardo adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Puerta dimensional", "lv": 4, "esc": "Conjuración", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 150 m Componentes: V Duración: Instantáneo¶Te teletransportas a una ubicación dentro del alcance y llegas exactamente al sitio deseado. Puede ser un lugar que tengas a la vista, uno que logres visualizar o uno que puedas describir indicando la distancia y la dirección, como “60 m en línea recta hacia abajo” o “90 m hacia arriba y hacia el noroeste en un ángulo de 45 grados”. También puedes teletransportar contigo a una criatura voluntaria. La criatura deberá estar a 1,5 m o menos de ti cuando te teletransportes y a parecerá en un espacio a 1,5 m o menos de tu espacio de destino. Si la otra criatura, tú o las dos fuerais a llegar a un espacio ya ocupado por una criatura o totalmente ocupado por uno o más objetos, la criatura que viaje contigo y tú sufriréis 4d6 de daño de fuerza y la teletransportación fallará."}, {"n": "Purificar comida y bebida", "lv": 1, "esc": "Transmutación", "cl": ["clérigo", "druida", "paladín"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 3 m Componentes: V, S Duración: Instantáneo¶Eliminas el veneno y la podredumbre de la comida y bebida no mágicas en una esfera de 1,5 m de radio centrada en un punto dentro del alcance."}, {"n": "Ráfaga de viento", "lv": 2, "esc": "Evocación", "cl": ["druida", "explorador", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (la semilla de una legumbre) Duración: Concentración, hasta 1 minuto¶De ti surge una ráfaga de viento fuerte en una línea recta de 18 m de largo y 3 m de ancho en la direc- ción que elijas hasta que termine el conjuro. Todas las criaturas en esa línea deberán superar una tirada de salvación de Fuerza o serán empujadas 4,5 m en la dirección de la línea. Las criaturas que terminen su turno en ella también deberán hacer la tirada de salvación. Cualquier criatura que esté en la línea deberá gastar 2 m de movimiento por cada metro que se mueva para acercarse a ti. La ráfaga dispersa el gas o el vapor y apaga velas y otras llamas desprotegidas de la zona. Hace que las llamas protegidas, como las de los faroles, se agiten salvajemente y tienen un 50 % de probabili- dad de apagarse. Como acción adicional en tus siguientes turnos, puedes cambiar la dirección en la que la línea surge de ti."}, {"n": "Ralentizar", "lv": 3, "esc": "Transmutación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una gota de melaza) Duración: Concentración, hasta 1 minuto¶Alteras el tiempo alrededor de hasta seis criaturas de tu elección en un cubo de 12 m de lado dentro del alcance. Cada objetivo deberá superar una tirada de salvación de Sabiduría o se verá afectado hasta que termine el conjuro. Un objetivo afectado ve cómo su velocidad se reduce a la mitad, sufre un penalizador de −2 a la CA y a las tiradas de salvación de Destreza y no puede llevar a cabo reacciones. En sus turnos, puede realizar una acción o una acción adicional, pero no ambas, y solo puede hacer un ataque si emplea la acción de atacar. Si lanza un conjuro con un com-¶ponente somático, hay un 25 % de probabilidades de que el conjuro falle porque el objetivo haga los gestos demasiado despacio. Un objetivo afectado repetirá la tirada de salva- ción al final de cada uno de sus turnos y, si tiene éxito, se librará del conjuro."}, {"n": "Rayo abrasador", "lv": 2, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: Instantáneo¶Lanzas tres rayos ardientes y los arrojas contra uno o varios objetivos dentro del alcance. Haz un ataque de conjuro a distancia por cada rayo. Si acierta, el objetivo recibe 2d6 de daño de fuego. Con un espacio de conjuro de nivel superior. Creas un rayo adicional por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Rayo de escarcha", "lv": 0, "esc": "evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Lanzas un rayo helado de luz blanquiazul hacia una criatura dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 1d8 de daño de frío y su velocidad se reduce en 3 m hasta el principio de tu siguiente turno. Mejora de truco. El daño aumenta en 1d8 cuando alcanzas los niveles 5 (2d8), 11 (3d8) y 17 (4d8)."}, {"n": "Rayo de luna", "lv": 2, "esc": "Evocación", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S, M (una hoja con forma de media luna) Duración: Concentración, hasta 1 minuto¶Un rayo de luz pálida y plateada brilla en un cilindro de 1,5 m de radio y 12 m de alto centrado en un pun- to dentro del alcance. Hasta que el conjuro termine, una luz tenue llena el cilindro y puedes emplear una acción de magia en turnos posteriores para mover el cilindro hasta 18 m. Cuando el cilindro aparezca, todas las criaturas que haya en él realizan una tirada de salvación de Constitución. Si la fallan, recibirán 2d10 de daño radiante, y si una criatura ha cambiado de forma (por ejemplo, como resultado del conjuro polimorfar), volverá a su forma real y no podrá cambiarla hasta que salga del cilindro. Si la superan, solo¶sufrirán la mitad de ese daño. Una criatura también deberá hacer esta tirada cuando el área del conjuro entre en su espacio o cuando la criatura entre en el área o acabe su turno en ella. Una criatura solo hace esta tirada una vez por turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Rayo debilitador", "lv": 2, "esc": "Nigromancia", "cl": ["brujo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Un haz de energía debilitadora surge de ti hacia una criatura dentro del alcance. El objetivo deberá hacer una tirada de salvación de Constitución. Si la supera, tendrá desventaja en la siguiente tirada de ataque que haga hasta el principio de tu siguiente turno. Si la falla, tendrá desventaja en las pruebas con d20 basadas en la Fuerza hasta que termine el conjuro. Durante ese tiempo, también restará 1d8 a todas las tiradas de daño que haga. El objetivo repe- tirá la tirada de salvación al final de cada uno de sus turnos y, si tiene éxito, se librará del conjuro."}, {"n": "Rayo nauseabundo", "lv": 1, "esc": "Nigromancia", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Disparas un rayo verduzco hacia una criatura den- tro del alcance. Haz un ataque de conjuro a distan- cia contra el objetivo. Si acierta, el objetivo sufrirá 2d8 de daño de veneno y tendrá el estado de enve- nenado hasta el final de tu siguiente turno. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d8 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Rayo solar", "lv": 6, "esc": "Evocación", "cl": ["clérigo", "druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una lupa) Duración: Concentración, hasta 1 minuto¶Lanzas un rayo solar en una línea de 1,5 m de ancho y 18 m de largo. Todas las criaturas situadas en esa línea harán una tirada de salvación de Consti- tución. Si la fallan, recibirán 6d8 de daño radiante y tendrán el estado de cegadas hasta el principio de tu siguiente turno. Si la superan, recibirán solo la mitad de daño.¶Hasta que el conjuro termine, puedes emplear una acción de magia para crear una nueva línea de luz radiante. Hasta que termine el conjuro, por encima de ti brillará una mota radiante que emite luz brillante en un radio de 9 m y luz tenue 9 m más allá. Esta luz es luz solar."}, {"n": "Recado", "lv": 3, "esc": "Adivinación", "cl": ["bardo", "clérigo", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Ilimitado Componentes: V, S, M (un alambre de cobre) Duración: Instantáneo¶Envías un mensaje corto de 25 palabras o menos a una criatura que conozcas o a una criatura que te haya descrito alguien que la conozca. El objetivo escucha el mensaje en su mente, te reconoce como emisor si sabe quién eres y puede responder de manera similar inmediatamente. El conjuro permite que los objetivos comprendan el significado del mensaje. Puedes enviar el mensaje a cualquier distancia e incluso a otros planos de existencia, pero si el ob- jetivo está en un plano diferente al tuyo, existe una probabilidad del 5 % de que el mensaje no llegue. Si el mensaje no llega, lo sabrás. Al recibir tu mensaje, una criatura puede impedir que te pongas en contacto con ella otra vez con este conjuro durante 8 horas. Si intentas enviarle otro mensaje durante ese tiempo, sabrás que te ha blo- queado y el conjuro fallará."}, {"n": "Recluir", "lv": 7, "esc": "Transmutación", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (polvo de piedras preciosas que valga al menos 5000 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado¶Con un toque, recluyes mágicamente un objeto o a una criatura voluntaria. Hasta que el conjuro termine, el objetivo tiene el estado de invisible y no puede ser objetivo de conjuros de adivinación, detectado con magia ni observado desde lejos me- diante magia. Si el objetivo es una criatura, entra en un estado de animación suspendida: tiene el estado de in- consciente, no envejece y no necesita aire, beber ni comer. Puedes establecer una condición para que el con- juro termine antes de tiempo, que puede ser cual- quier cosa que elijas, pero debe ocurrir o ser visible a 1,5 km o menos del objetivo. Por ejemplo, “cuando transcurran 1000 años” o “cuando se despierte¶la tarasca”. Este conjuro también termina si el obje- tivo recibe cualquier daño."}, {"n": "Reencarnar", "lv": 5, "esc": "Nigromancia", "cl": ["druida"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (aceites raros que valgan al menos 1000 po, que se consumen como parte del conjuro) Duración: Instantáneo¶Tocas a un humanoide muerto o una parte de sus restos. Siempre que la criatura no lleve muerta más de 10 días, el conjuro forma un nuevo c uerpo y llama al alma para que entre en él. Tira 1d10 y consulta la tabla a continuación para determinar la especie del cuerpo, o bien tu GM elige otra especie jugable. 1d10¶1d10¶Especie¶Vuelve a tirar¶Especie¶Goliat¶Dracónido¶Humano¶Elfo¶Mediano¶Enano¶Orco¶Gnomo¶Tiefling¶La criatura reencarnada hace cualquier elección que ofrezca la descripción de la especie y r ecuerda su vida anterior. Conserva las capacidades que tenía en su forma original, pero los atributos de su especie nueva sustituyen a los de la anterior."}, {"n": "Regenerar", "lv": 7, "esc": "Transmutación", "cl": ["bardo", "clérigo", "druida"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Toque Componentes: V, S, M (una rueda de plegarias) Duración: 1 hora¶Una criatura a la que toques recupera 4d8 + 15 puntos de golpe. Hasta que el conjuro termine, el objetivo recupera 1 punto de golpe al principio de cada uno de sus turnos y los miembros cercena- dos crecen de nuevo al cabo de 2 minutos."}, {"n": "Relámpago", "lv": 3, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (un poco de pelaje y una vara de cristal) Duración: Instantáneo¶Un relámpago que forma una línea de 30 m de largo y 1,5 m de ancho surge de ti en la dirección que elijas. Todas las criaturas situadas en esa línea deberán hacer una tirada de salvación de D  estreza;¶sufrirán 8d6 de daño de relámpago si la fallan o la mitad del daño si la superan. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 3 que tenga el espacio."}, {"n": "Relámpago en cadena", "lv": 6, "esc": "Evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 45 m Componentes: V, S, M (tres alfileres de plata) Duración: Instantáneo¶Lanzas un relámpago hacia un objetivo que puedas ver dentro del alcance. A continuación, de ese objetivo surgirán otros tres relámpagos dirigidos a otros tantos objetivos de tu elección, cada uno de los cuales deberá estar a 9 m o menos del primero. Un objetivo puede ser una criatura o un objeto y solo puede ser objetivo de uno de los relámpagos. Cada objetivo hace una tirada de salvación de Des- treza; sufrirá 10d8 de daño de relámpago si la falla o la mitad del daño si la supera. Con un espacio de conjuro de nivel superior. Surge un relámpago adicional del primer objetivo a otro objetivo por cada nivel por encima de 6 que tenga el espacio."}, {"n": "Reparar", "lv": 0, "esc": "transmutación", "cl": ["bardo", "clérigo", "druida", "hechicero", "mago"], "t": "hechicero, mago) Tiempo de lanzamiento: 1 minuto Alcance: Toque Componentes: V, S, M (dos imanes naturales) Duración: Instantáneo¶Este conjuro repara una sola grieta o desgarrón en un objeto que toques, como un eslabón roto en una cadena, las dos mitades de una llave partida, una capa rasgada o una fuga en una bota de vino. Mien- tras la grieta o el desgarrón no tenga más de 30 cm de tamaño en ninguna de sus dimensiones, lo arre- glarás sin dejar rastro del daño. Este conjuro puede reparar el componente físico de un objeto mágico, pero no puede restaurar su magia."}, {"n": "Reprensión infernal", "lv": 1, "esc": "Evocación", "cl": ["brujo"], "t": "Tiempo de lanzamiento: Reacción, que llevas a cabo en respuesta a recibir daño de una criatura que puedas ver a 18 m o menos de ti Alcance: 18 m Componentes: V, S Duración: Instantáneo¶La criatura que te ha dañado se ve rodeada momen- táneamente por unas llamas verdes y hará una tirada de salvación de Destreza; sufrirá 2d10 de daño de fuego si la falla o la mitad del daño si la supera.¶Con un espacio de conjuro de nivel superior. El daño aumenta en 1d10 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Resistencia", "lv": 0, "esc": "abjuración", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S Duración: Concentración, hasta 1 minuto¶Tocas a una criatura voluntaria y eliges un tipo de daño: ácido, contundente, cortante, frío, fuego, necrótico, perforante, radiante, relámpago, trueno o veneno. Cuando la criatura sufra daño del tipo elegido antes de que termine el conjuro, reduce el daño total recibido en 1d4. Una criatura solo puede beneficiarse de este conjuro una vez por turno.¶Tocas a una criatura y le pones fin a un estado que tenga: cegada, ensordecida, envenenada o paralizada."}, {"n": "Resurrección", "lv": 7, "esc": "Nigromancia", "cl": ["bardo", "clérigo"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (un diamante que valga al menos 1000 po y que se consume como parte del conjuro)"}, {"n": "Duración: Instantáneo", "lv": 9, "esc": "Nigromancia", "cl": ["clérigo", "druida"], "t": "Tiempo de lanzamiento: 1 hora Alcance: Toque Componentes: V, S, M (diamantes que valgan al menos 25 000 po, que se consumen como parte del conjuro) Duración: Instantáneo¶Tocas a una criatura y eliminas mágicamente uno de los siguientes efectos de ella:¶Tocas a una criatura que no lleve más de 200 años muerta y que falleciera por cualquier motivo menos de vieja. La criatura revive con todos sus puntos de golpe. Este conjuro cierra todas las heridas, neutraliza cualquier veneno, cura todas las enfermedades mágicas y levanta las maldiciones que afectaran a la criatura cuando murió. También sustituye los órganos y las extremidades que le falten o sufrieran daños. Si la criatura era un muerto viviente, la resu- citará con su forma normal. El conjuro puede proporcionar un nuevo cuerpo si el original ya no existe, en cuyo caso debes pro- nunciar el nombre de la criatura. A continuación, esta aparecerá en un espacio sin ocupar que elijas a 3 m o menos de ti."}, {"n": "Respirar bajo el agua", "lv": 3, "esc": "Transmutación", "cl": ["druida", "explorador", "hechicero", "mago"], "t": "hechicero, mago) Tiempo de lanzamiento: Acción o ritual Alcance: 9 m Componentes: V, S, M (un junco corto) Duración: 24 horas¶Este conjuro concede a hasta diez criaturas volun- tarias que elijas dentro del alcance la capacidad de respirar bajo el agua hasta que el conjuro termine. Las criaturas afectadas también conservan su modo de respiración normal.¶Restablecimiento mayor¶• 1 nivel de cansancio. • Los estados de hechizado o petrificado. • Una maldición, incluida la sintonización del obje- tivo con un objeto mágico maldito. • Cualquier reducción de una de las puntuaciones de característica del objetivo. • Cualquier reducción de los puntos de golpe máxi- mos del objetivo."}, {"n": "Restablecimiento menor", "lv": 2, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida", "explorador", "paladín"], "t": "explorador, paladín) Tiempo de lanzamiento: Acción adicional Alcance: Toque¶Componentes: V, S Duración: Instantáneo¶Resurrección verdadera"}, {"n": "Retirada expeditiva", "lv": 1, "esc": "Transmutación", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V, S Duración: Concentración, hasta 10 minutos¶Realizas la acción de correr y, hasta que el conjuro termine, puedes volver a hacerla como acción adi- cional."}, {"n": "Revivir", "lv": 3, "esc": "Nigromancia", "cl": ["clérigo", "druida", "explorador", "paladín"], "t": "paladín)¶Tiempo de lanzamiento: Acción Alcance: Toque Componentes: V, S, M (un diamante que valga al menos 300 po y que se consume como parte del conjuro) Duración: Instantáneo¶tución o tendrán el estado de cegadas hasta el final de tu siguiente turno."}, {"n": "Rociada prismática", "lv": 7, "esc": "Evocación", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S Duración: Instantáneo¶Ocho rayos de luz surgen de tu mano en un cono de 18 m. Todas las criaturas situadas en el cono hacen una tirada de salvación de Destreza. Por cada objetivo, tira 1d8 para determinar qué rayo de color le afecta y consulta la tabla “Rayos prismáticos”.¶Rayos prismáticos 1d8 Rayo¶Rojo. Si falla la tirada: 12d6 de daño de fuego. Si supera la tirada: la mitad de daño.¶Naranja. Si falla la tirada: 12d6 de daño de ácido. Si supera la tirada: la mitad de daño.¶Amarillo. Si falla la tirada: 12d6 de daño de relámpago. Si supera la tirada: la mitad de daño.¶Risa horrible¶Verde. Si falla la tirada: 12d6 de daño de veneno. Si supera la tirada: la mitad de daño.¶Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S, M (una tarta y una pluma) Duración: Concentración, hasta 1 minuto¶Azul. Si falla la tirada: 12d6 de daño de frío. Si supera la tirada: la mitad de daño.¶Añil. Si falla la tirada: el objetivo tendrá el estado de apresado y hará una tirada de salvación de Constitución al final de cada uno de sus turnos. Si la supera tres veces, el estado terminará. Si la falla tres veces, tendrá el estado de petrificado hasta que lo libere un efecto como el del conjuro restablecimiento mayor. Los éxitos y los fallos no tienen por qué ser consecutivos: lleva la cuenta de ambos hasta que el objetivo tenga tres de un mismo tipo.¶Violeta. Si falla la tirada: El objetivo tendrá el estado de cegado y hará una tirada de salvación de Sabiduría al principio de tu siguiente turno. Si la supera, el estado terminará. Si la falla, el estado terminará y la criatura se teletransportará a otro plano de existencia (a elección de tu GM).¶Especial. Dos rayos alcanzan al objetivo. Tira dos veces y repite los resultados de 8.¶Tocas a una criatura que haya muerto en el último minuto. La criatura revive con 1 punto de golpe. Este conjuro no puede revivir a una criatura que haya muerto de vieja ni devolverle las partes del"}, {"n": "Rociada de color", "lv": 1, "esc": "Ilusionismo", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: Lanzador Componentes: V, S, M (una pizca de arena de colores) Duración: Instantáneo¶Emites una ráfaga de luces brillantes y parpa deantes de múltiples colores. Todas las criaturas situadas en un cono de 4,5 m que se origina en ti deberán superar una tirada de salvación de Consti-"}, {"n": "Rociada venenosa", "lv": 0, "esc": "nigromancia", "cl": ["brujo", "druida", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Rocías a una criatura dentro del alcance con una niebla tóxica. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibe 1d12 de daño de veneno. Mejora de truco. El daño aumenta en 1d12 cuando alcanzas los niveles 5 (2d12), 11 (3d12) y 17 (4d12)."}, {"n": "Saber druídico", "lv": 0, "esc": "transmutación", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Instantáneo¶Susurras a los espíritus de la naturaleza y produces uno de los siguientes efectos dentro del alcance. Efecto sensorial. Creas un efecto sensorial inofensivo, como hojas cayendo, hadas espectrales bailando, una suave brisa, el sonido de un animal o un leve olor a mofeta. El efecto debe caber en un cubo de 1,5 m de lado. Florecer. Haces que, al instante, una flor florezca, una vaina de semillas se abra o el brote de una hoja germine. Jugar con fuego. Enciendes o apagas una vela, una antorcha o una hoguera. Sensor climático. Creas un efecto sensorial Diminuto e inofensivo que predice el clima que habrá en tu ubicación durante las siguientes 24 horas. El efecto se manifiesta como un orbe dorado para los cielos despejados, una nube para la lluvia, copos de nieve para la nieve, etc. Este efecto persiste durante 1 asalto."}, {"n": "Saeta guía", "lv": 1, "esc": "Evocación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V, S Duración: 1 asalto¶Lanzas un rayo de luz hacia una criatura dentro del alcance. Haz un ataque de conjuro a distancia contra el objetivo. Si acierta, el objetivo recibirá 4d6 de daño radiante y la siguiente tirada de ataque contra él antes del final de tu siguiente turno tendrá ventaja. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Salpicadura ácida", "lv": 0, "esc": "evocación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Instantáneo¶Creas una burbuja ácida en un punto dentro del alcance, donde explotará en una esfera de 1,5 m de radio. Todas las criaturas situadas en la e sfera deberán superar una tirada de salvación de Destreza o sufrirán 1d6 de daño de ácido. Mejora de truco. El daño aumenta en 1d6 cuando alcanzas los niveles 5 (2d6), 11 (3d6) y 17 (4d6)."}, {"n": "Salto", "lv": 1, "esc": "Transmutación", "cl": ["druida", "explorador", "hechicero", "mago"], "t": "hechicero, mago)¶Tiempo de lanzamiento: Acción adicional Alcance: Toque Componentes: V, S, M (la pata trasera de un saltamontes) Duración: 1 minuto¶Tocas a una criatura voluntaria. Una vez en cada uno de sus turnos hasta que el conjuro termine, la criatura puede saltar hasta 9 m usando 3 m de movimiento. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Sanctasanctórum privado", "lv": 4, "esc": "Abjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: 36 m Componentes: V, S, M (una lámina fina de plomo) Duración: 24 horas¶Haces que una zona dentro del alcance sea mágica- mente segura. Esta zona es un cubo que puede tener un tamaño desde tan solo 1,5 m de lado a hasta 30 m y permanecerá hasta que el conjuro termine. Cuando lanzas el conjuro, decides el tipo de seguridad que proporciona eligiendo cualesquiera de las siguientes propiedades: • El sonido no puede atravesar la barrera del perí- metro de la zona protegida. • La barrera de la zona protegida parece oscura y con niebla, impidiendo ver a través de ella (in- cluso a la visión en la oscuridad). • Dentro de la zona protegida no pueden aparecer sensores creados mediante conjuros de adivi- nación, ni estos pueden atravesar la barrera del perímetro. • Las criaturas en la zona no pueden ser el objetivo de conjuros de adivinación. • Nada puede teletransportarse ni al interior ni al exterior del área protegida. • El viaje interplanar está bloqueado dentro de la zona. Si este conjuro se lanza a diario en el mismo lugar durante 365 días, durará hasta que sea disipado.¶Con un espacio de conjuro de nivel superior. Puedes aumentar el tamaño del cubo en 30 m por cada nivel por encima de 4 que tenga el espacio."}, {"n": "Santuario", "lv": 1, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: 9 m Componentes: V, S, M (un trozo de vidrio de un espejo) Duración: 1 minuto¶Proteges a una criatura que esté dentro del alcance. Hasta que el conjuro termine, cualquier criatura que haga objetivo a la criatura protegida con un ataque o un conjuro que inflija daño deberá superar primero una tirada de salvación de Sabiduría; de lo contrario, elegirá un nuevo objetivo o perderá el ataque o conjuro. Este conjuro no protege a la criatura contra los efectos de área. El conjuro termina si la criatura protegida hace una tirada de ataque, lanza un conjuro o inflige daño."}, {"n": "Semiplano", "lv": 8, "esc": "Conjuración", "cl": ["brujo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: S Duración: 1 hora¶Creas una puerta de sombras Mediana en una superficie sólida plana que puedas ver dentro del alcance. Esta puerta puede abrirse y cerrarse y lleva a un semiplano que parece una habitación vacía de 9 m de lado en cada dimensión, hecha de madera o de piedra (a tu elección). Cuando el conjuro termina, la puerta se desva- necerá y todos los objetos dentro del semiplano permanecerán en él. Las criaturas que haya tam- bién se quedarán dentro salvo que prefieran que la puerta las expulse cuando se desvanece, lo que hará que aterricen con el estado de derribadas en los espacios sin ocupar más cercanos a donde estaba la puerta. Cada vez que lances este conjuro, puedes crear un nuevo semiplano o hacer que la puerta de sombras conecte con un semiplano que hayas creado previa- mente con el conjuro. Además, si conoces la natura- leza y el contenido de un semiplano creado cuando otra criatura lanzó este conjuro, en su lugar puedes hacer que la puerta de sombras conecte con dicho semiplano."}, {"n": "Señal de esperanza", "lv": 3, "esc": "Abjuración", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, S Duración: Concentración, hasta 1 minuto¶Elige cualquier cantidad de criaturas dentro del alcance. Hasta que el conjuro termine, todos los ob- jetivos tienen ventaja en sus tiradas de salvación de Sabiduría y sus tiradas de salvación contra muerte, y también recuperan la cantidad máxima posible de puntos de golpe en cualquier curación."}, {"n": "Shillelagh", "lv": 0, "esc": "transmutación", "cl": ["druida"], "t": "Tiempo de lanzamiento: Acción adicional Alcance: Lanzador Componentes: V, S, M (muérdago) Duración: 1 minuto¶Un bastón o un garrote que sostengas se ve impreg- nado del poder de la naturaleza. Hasta que termine el conjuro, puedes usar tu aptitud mágica en lugar de tu Fuerza para las tiradas de ataque y de daño de tus ataques cuerpo a cuerpo usando esa arma y el dado de daño pasa a ser un d8. Si el ataque inflige daño, puede ser de fuerza o del tipo de daño normal del arma (a tu elección). El conjuro termina antes de tiempo si lo vuelves a lanzar o si sueltas el arma. Mejora de truco. El dado de daño cambia cuando alcanzas los niveles 5 (d10), 11 (d12) y 17 (2d6)."}, {"n": "Silencio", "lv": 2, "esc": "Ilusionismo", "cl": ["bardo", "clérigo", "explorador"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 36 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Hasta que termine el conjuro, creas una esfera de 6 m de radio centrada en un punto de tu elección dentro del alcance. Ningún sonido podrá atravesarla ni originarse en su interior. Toda criatura u objeto tiene inmunidad al daño de trueno si se halla completamente dentro de la esfera, y las criaturas t ienen el estado de ensordecidas en su interior. Den- tro de ella es imposible lanzar conjuros que tengan un componente verbal."}, {"n": "Símbolo", "lv": 7, "esc": "Abjuración", "cl": ["bardo", "clérigo", "druida", "mago"], "t": "Tiempo de lanzamiento: 1 minuto Alcance: Toque Componentes: V, S, M (diamante en polvo que valga al menos 1000 po y que se consume como parte del conjuro) Duración: Hasta que sea disipado o se active¶Inscribes un glifo dañino bien en una superficie (como un trozo de un suelo o una pared) o bien en un objeto que se pueda cerrar (como un libro o un cofre). Este puede abarcar una zona de hasta 3 m de diámetro. Si eliges un objeto, este debe perma- necer en su sitio; si se mueve más de 3 m respecto¶al lugar donde lanzaste el conjuro, el glifo se romperá y el conjuro terminará sin activarse. El glifo es casi imperceptible y es necesario supe- rar una prueba de Sabiduría (Percepción) contra tu CD de salvación de conjuros para detectarlo. Cuando inscribas el glifo, decides qué condición lo activa y eliges qué efecto tiene el símbolo: aturdi- miento, discordia, dolor, muerte, miedo o sueño (se explican a continuación). Establecer el activador. Cuando lances el conjuro, decide qué activará el glifo. En el caso de los glifos inscritos en una superficie, las condiciones que suelen activarlos incluyen tocarlos o situarse sobre ellos, quitar otro objeto que los cubra o acercarse a cierta distancia de ellos. En el caso de los glifos inscritos en un objeto, suelen activarse al abrir el objeto o mirar el glifo. Puedes especificar aún más la condición, de modo que solo las criaturas de ciertos tipos puedan acti- varlo (por ejemplo, que solo afecte a las aberracio- nes). También puedes establecer excepciones sobre qué criaturas no activarán el glifo; por ejemplo, las que pronuncien una contraseña. Una vez activado, el glifo brilla y llena una esfera de 18 m de radio con luz tenue durante 10 minutos, tras lo cual el conjuro termina. Todas las criaturas que haya en la esfera cuando el glifo se active serán objetivo de su efecto, al igual que una criatura que entre en ella por primera vez en un turno o termine su turno allí. Una criatura solo puede ser objetivo una vez por turno. Aturdimiento. Cada objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de aturdido durante 1 minuto. Discordia. Cada objetivo hace una tirada de sal- vación de Sabiduría. Si la falla, el objetivo discutirá verbalmente con otras criaturas durante 1 minuto. Durante este tiempo, no podrá comunicarse de for- ma razonable y tendrá desventaja en las tiradas de ataque y las pruebas de característica. Dolor. Cada objetivo deberá superar una tirada de salvación de Constitución o tendrá el estado de incapacitado durante 1 minuto. Muerte. Cada objetivo hace una tirada de sal- vación de Constitución; sufrirá 10d10 de daño necrótico si la falla o la mitad del daño si la supera. Sueño. Cada objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de inconsciente durante 10 minutos. Una criatura se despierta si recibe daño o si alguien utiliza una acción para sacudirla. Terror. Cada objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de asustado durante 1 minuto. Mientras esté asustado, el objetivo deberá alejarse al menos 9 m del glifo en cada uno de sus turnos si puede."}, {"n": "Simulacro", "lv": 7, "esc": "Ilusionismo", "cl": ["mago"], "t": "Tiempo de lanzamiento: 12 horas Alcance: Toque Componentes: V, S, M (rubí en polvo que valga al menos 1500 po, que se consume como parte del conjuro) Duración: Hasta que sea disipado¶Creas un simulacro de una bestia o humanoide que permanezca a 3 m o menos de ti durante todo el tiempo de lanzamiento del conjuro. Para finalizar el lanzamiento, tocas a la criatura y una pila de hielo o nieve de su mismo tamaño, de modo que la pila se transformará en un simulacro y será una criatura. El simulacro tendrá el perfil de la criatura original en el momento del lanzamiento, excepto que es un autómata, tiene la mitad de puntos de golpe máxi- mos y no puede lanzar este conjuro. El simulacro es amistoso contigo y con las criatu- ras que designes, obedece tus órdenes y actúa en tu turno en combate. Además, no puede subir de nivel ni hacer descansos cortos o largos. Si el simulacro sufre daño, la única forma de restaurar sus puntos de golpe es repararlo cuando hagas un descanso largo. En ese momento, puedes gastar componentes con un valor de 100 po por cada punto de golpe recuperado. Para repararlo, el simulacro debe permanecer a 1,5 m o menos de ti. El simulacro dura hasta que sus puntos de golpe se reducen a 0, momento en el que vuelve a conver- tirse en nieve o hielo y se derrite. Si vuelves a lanzar este conjuro, cualquier simulacro que hayas creado antes con él se destruye al instante."}, {"n": "Sirviente invisible", "lv": 1, "esc": "Conjuración", "cl": ["bardo", "brujo", "mago"], "t": "Tiempo de lanzamiento: Acción o ritual Alcance: 18 m Componentes: V, S, M (un trozo de cuerda y uno de madera) Duración: 1 hora¶Este conjuro crea una fuerza invisible de tamaño Mediano, sin mente y sin forma, que realiza las tareas sencillas que le ordenes hasta que el conjuro termine. El sirviente surge en un espacio sin ocupar en el suelo dentro del alcance. Tiene una CA de 10, 1 punto de golpe, una Fuerza de 2 y no puede atacar. Si sus puntos de golpe se reducen a 0, el conjuro termina. Una vez en cada uno de tus turnos como acción adicional, puedes ordenar mentalmente al sirviente que se mueva hasta 4,5 m y que interactúe con un objeto. El sirviente puede realizar tareas s encillas que también podría llevar a cabo un humano, como traer y llevar cosas, limpiar, remendar, plegar ropa, encender un fuego y servir comida o bebida. En cuanto das la orden, el sirviente realiza la tarea¶lo mejor que puede hasta que la completa y luego espera tu siguiente orden. Si ordenas al sirviente que lleve a cabo una tarea que lo alejaría más de 18 m de ti, el conjuro termina."}, {"n": "Sordera/ceguera", "lv": 2, "esc": "Transmutación", "cl": ["bardo", "clérigo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 36 m Componentes: V Duración: 1 minuto¶Una criatura que puedas ver dentro del alcance deberá superar una tirada de salvación de Consti- tución o tendrá el estado de cegada o ensordecida (a tu elección) hasta que el conjuro termine. Al fi- nal de cada uno de sus turnos, el objetivo repite la tirada de salvación y, si tiene éxito, se librará del conjuro. Con un espacio de conjuro de nivel superior. Puedes hacer objetivo a una criatura adicional por cada nivel por encima de 2 que tenga el espacio."}, {"n": "Sugestión", "lv": 2, "esc": "Encantamiento", "cl": ["bardo", "brujo", "hechicero", "mago"], "t": "mago) Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V, M (una gota de miel) Duración: Concentración, hasta 8 horas¶Sugieres un curso de acción (de no más de 25 pa- labras) a una criatura que puedas ver dentro del alcance y que te pueda oír y entender. La sugeren- cia tiene que parecer factible y no ser claramente dañina para el objetivo o sus aliados. Por ejemplo, podrías decir: “Ve a por la llave de la cámara del te- soro de la secta y tráemela”, o quizá “deja de luchar, vete pacíficamente de la biblioteca y no vuelvas”. El objetivo deberá superar una tirada de salvación de Sabiduría o tendrá el estado de hechizado hasta que termine el conjuro o hasta que tus aliados o tú le hagáis daño. El objetivo hechizado llevará a cabo la sugerencia lo mejor que pueda. La actividad sugerida puede seguir hasta que termine el conjuro, pero si se puede completar en menos tiempo, el con- juro terminará sobre el objetivo cuando la complete."}, {"n": "Sugestión en masa", "lv": 6, "esc": "Encantamiento", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, M (una lengua de serpiente) Duración: 24 horas¶Sugieres un curso de acción (de no más de 25 pa- labras) a doce o menos criaturas que puedas ver dentro del alcance y que te puedan oír y entender.¶La sugerencia tiene que parecer factible y no ser claramente dañina para cualquiera de los objetivos o sus aliados. Por ejemplo, podrías decir: “Id hasta el pueblo por ese camino y ayudad a sus habitantes a recoger la cosecha hasta que atardezca”, o quizá “no es momento de luchar; soltad las armas, poneos a bailar y no paréis hasta dentro de una hora”. Todos los objetivos deberán superar una tirada de salvación de Sabiduría o tendrán el estado de hechizados hasta que termine el conjuro o hasta que tus aliados o tú les hagáis daño. Cada objetivo hechizado llevará a cabo la sugerencia lo mejor que pueda. La actividad sugerida puede seguir hasta que termine el conjuro, pero si se puede completar en menos tiempo, el conjuro terminará sobre un objetivo cuando la complete. Con un espacio de conjuro de nivel superior. La duración aumenta al usar espacios de nivel 7 (10 días), 8 (30 días) o 9 (366 días)."}, {"n": "Susurros discordantes", "lv": 1, "esc": "Encantamiento", "cl": ["bardo"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V Duración: Instantáneo¶Una criatura de tu elección que puedas ver d  entro del alcance oye una melodía discordante en su mente. El objetivo hace una tirada de salvación de Sabiduría. Si la falla, recibirá 3d6 de daño psíquico y deberá utilizar su reacción inmediatamente, si es posible, para alejarse de ti tanto como pueda por la ruta más segura. Si supera la tirada, solo sufrirá la mitad de ese daño. Con un espacio de conjuro de nivel superior. El daño aumenta en 1d6 por cada nivel por encima de 1 que tenga el espacio."}, {"n": "Taumaturgia", "lv": 0, "esc": "transmutación", "cl": ["clérigo"], "t": "Tiempo de lanzamiento: Acción Alcance: 9 m Componentes: V Duración: Hasta 1 minuto¶Manifiestas un pequeño milagro dentro del alcance y produces uno de los siguientes efectos mágicos. Si lanzas este conjuro varias veces, puedes man- tener activos a la vez hasta tres de sus efectos de 1 minuto. Jugar con fuego. Haces que las llamas parpadeen, brillen más, se atenúen o cambien de color durante 1 minuto. Mano invisible. Abres o cierras de golpe una puerta o ventana que no esté cerrada con llave. Ojos alterados. Cambias el aspecto de tus ojos durante 1 minuto.¶Sonido fantasmal. Creas un sonido instantáneo que procede de un punto de tu elección dentro del alcance. Por ejemplo, el retumbar de un trueno, el graznido de un cuervo o unos susurros de mal agüero. Temblores. Provocas que la tierra tiemble sin causar daños durante 1 minuto. Voz atronadora. Tu voz resuena hasta tres veces más alto de lo normal durante 1 minuto. Hasta que termine el conjuro, tienes ventaja en las pruebas de Carisma (Intimidación)."}, {"n": "Telaraña", "lv": 2, "esc": "Conjuración", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S, M (un poco de tela de araña) Duración: Concentración, hasta 1 hora¶Conjuras una masa de telarañas pegajosas en un punto dentro del alcance. Las telarañas ocupan un cubo de 6 m de lado en ese espacio hasta que el conjuro termine. Las telarañas son terreno difícil y su interior se considera ligeramente oscuro. Si las telarañas no están ancladas entre dos objetos sólidos (como muros o árboles) o extendi- das sobre un suelo, muro o techo, se vendrán abajo y el conjuro terminará al principio de tu siguiente turno. Las telarañas dispuestas sobre una superfi- cie plana tienen una profundidad de 1,5 m. La primera vez que una criatura entre en las tela- rañas o empiece su turno allí, deberá superar una tirada de salvación de Destreza o tendrá el estado de apresada mientras permanezca en ellas o hasta que se libere. Una criatura apresada puede utilizar una acción para hacer una prueba de Fuerza (Atletismo) contra tu CD de salvación de conjuros. Si la supera, dejará de estar apresada. Las telarañas son inflamables. Cualquier cubo de telarañas de 1,5 m de lado expuesto al fuego se que- ma por completo en 1 asalto y causa 2d4 de daño de fuego a cualquier criatura que comience su turno en el incendio.¶Telequinesis¶cada vez. Si cambias de objetivo, el anterior dejará de estar afectado por el conjuro. Criatura. Puedes intentar mover a una criatura Enorme o más pequeña. El objetivo deberá supe- rar una tirada de salvación de Fuerza o lo moverás hasta 9 m en cualquier dirección dentro del alcance del conjuro. Hasta el final de tu siguiente turno, la criatura tendrá el estado de apresada y, si la elevas en el aire, quedará suspendida. Caerá al final de tu siguiente turno a menos que vuelvas a usar esta opción y falle la tirada de salvación. Objeto. Puedes intentar mover un objeto Enorme o más pequeño. Si el objeto no lo lleva ni viste nadie, lo mueves automáticamente hasta 9 m en cualquier dirección dentro del alcance del conjuro. Si una criatura lleva o viste el objeto, deberá supe- rar una tirada de salvación de Fuerza o tirarás del objeto y lo moverás hasta 9 m en cualquier direc- ción dentro del alcance del conjuro. Puedes ejercer un control más preciso de los objetos con tu agarre telequinético, como manipular una herramienta sencilla."}, {"n": "Teletransporte", "lv": 7, "esc": "Conjuración", "cl": ["bardo", "hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 3 m Componentes: V Duración: Instantáneo¶Este conjuro os transporta a un destino que elijas a ti y a hasta ocho criaturas voluntarias que puedas ver o a un solo objeto que puedas ver dentro del alcance. Si el objetivo es un objeto, debe ser Grande o más pequeño y no puede llevarlo o vestirlo una criatura no voluntaria. Debes conocer el destino que elijas y también debe estar en el mismo plano de existencia que tú. Lo bien que conoces el destino es decisivo para conseguir llegar a él. Tu GM tira 1d100 y consulta la tabla “Resultado del teletransporte” y las explica- ciones que la siguen."}, {"n": "Resultado del teletransporte", "lv": 5, "esc": "Transmutación", "cl": ["hechicero", "mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 18 m Componentes: V, S Duración: Concentración, hasta 10 minutos¶Obtienes la capacidad de mover o manipular cria- turas u objetos con la mente. Cuando lanzas este conjuro y como acción de magia en tus siguientes hasta que termine el conjuro, puedes imponer tu voluntad sobre una criatura o un objeto que puedas ver dentro del alcance y provocar el efecto corres- pondiente de los indicados debajo. Puedes afectar al mismo objetivo cada asalto o elegir uno nuevo¶Familiaridad¶Lejos Área del En el Percance similar objetivo objetivo¶Círculo permanente¶—¶—¶—¶01–00¶Objeto vinculado¶—¶—¶—¶01–00¶Muy familiar¶01–05¶06–13¶14–24¶25–00¶Visto esporádicamente¶01–33¶34–43¶44–53¶54–00¶Visto una vez o descrito¶01–43¶44–53¶54–73¶74–00¶Destino falso¶01–50¶51–00¶—¶—¶Familiaridad. Los términos de la columna “Fami- liaridad” de la tabla significan lo siguiente:¶• “Círculo permanente” se refiere a un círculo de teletransportación permanente cuya secuencia de sellos conozcas. • “Objeto vinculado” quiere decir que posees un objeto tomado del destino deseado en los últimos seis meses, como un libro de la biblioteca de un mago. • “Muy familiar” es un sitio que has visitado a menudo, que has estudiado detenidamente o que puedas ver cuando lanzas el conjuro. • “Visto esporádicamente” es un lugar que has vis- to más de una vez, pero que no conoces muy bien. • “Visto una vez o descrito” es un lugar que solo has visto en una ocasión, quizá mediante la magia, o un sitio que conoces de segunda mano, quizá por un mapa. • “Destino falso” es un lugar que no existe. Es posible que trataras de escrudiñar el sancta- sanctórum de un enemigo, pero que, en su lugar, vieras una ilusión, o puede que intentes tele- transportarte a una ubicación que ya no existe. Percance. La magia impredecible del conjuro da como resultado un viaje complicado. Cada criatura que se teletransporta (o el objeto objetivo) recibe 3d10 de daño de fuerza y tu GM vuelve a tirar en la tabla para ver dónde acabáis (se pueden producir varios percances, que causarán daño cada una de las veces). Área similar. Tu grupo y tú (o el objeto objetivo) aparecéis en una zona diferente pero que se parece visual o temáticamente al área objetivo. Llegaréis al espacio similar más cercano. Por ejemplo, si te dirigías a tu laboratorio, podrías acabar en el labo- ratorio de otra persona en la misma ciudad. Lejos del objetivo. Tu grupo y tú (o el objeto objetivo) aparecéis a 2d12 × 1,5 km de distancia del destino en una dirección al azar. Tira 1d8 para determinar la dirección: con un 1, al este; con un 2, al sureste; con un 3, al sur; con un 4, al suroeste; con un 5, al oeste; con un 6, al noroeste; con un 7, al norte, y con un 8, al noreste. En el objetivo. Tu grupo y tú (o el objeto objetivo) aparecéis donde tú querías."}, {"n": "Tentáculos negros", "lv": 4, "esc": "Conjuración", "cl": ["mago"], "t": "Tiempo de lanzamiento: Acción Alcance: 27 m Componentes: V, S, M (un tentáculo) Duración: Concentración, hasta 1 minuto¶Unos tentáculos color ébano que se retuercen llenan un cuadrado en el suelo de 6 m de lado que puedas ver dentro del alcance. Hasta que termine el conju-¶ro, estos tentáculos convertirán la zona en terreno difícil. Todas las criaturas situadas en esa zona hacen una tirada de salvación de Fuerza. Si la fallan, sufrirán 3d6 de daño contundente y tendrán el estado de apresadas hasta que el conjuro termine. Una criatura también deberá hacer la tirada si entra en la zona o termina su turno en ella. Cada criatura solo hace esta tirada una vez por turno. Una criatura apresada puede emplear una acción para hacer una prueba de Fuerza (Atletismo) contra tu CD de salvación de conjuros y, si la supera, pondrá fin a su estado."}, {"n": "Terremoto", "lv": 8, "esc": "Transmutación", "cl": ["clérigo", "druida", "hechicero"], "t": "Tiempo de lanzamiento: Acción Alcance: 150 m Componentes: V, S, M (una piedra fracturada) Duración: Concentración, hasta 1 minuto¶Elige un punto del suelo que puedas ver dentro del alcance. Hasta que el conjuro termine, una intensa sacudida afecta al suelo en un círculo de 30 m de radio centrado en ese punto. El suelo de la zona se considera terreno difícil. Cuando lances este conjuro y al final de cada uno de tus turnos hasta que termine, todas las criaturas que haya en el suelo en la zona deberán hacer una tirada de salvación de Destreza. Si la fallan, tendrán el estado de derribadas y perderán la concentración. Además, podrás provocar los siguientes efectos. Grietas. Se abre un total de 1d6 fisuras en la zona del conjuro al final del turno en que lo lances. Tú eliges la ubicación de las grietas, que pueden estar debajo de estructuras. Cada una tiene una profundidad de 1d10 × 3 m y una anchura de 3 m y se extiende desde un borde del área del conjuro hasta otro borde. Una criatura que esté en el mismo espacio que una grieta deberá superar una tirada de salvación de Destreza o caerá en ella. Si la supera, la criatura se moverá a la vez que se abre el borde de la grieta y se mantendrá allí. Estructuras. El temblor causa 50 de daño contun- dente a cualquier estructura que esté en contacto con el suelo de la zona cuando lances el conjuro y al final de cada uno de tus turnos hasta que el conjuro termine. Si los puntos de golpe de una estructura se reducen a 0, se derrumbará. Una criatura que se encuentre a una distancia de una estructura que se derrumba igual a la mitad de su altura hace una tirada de salvación de Destreza. Si la falla, sufrirá 12d6 de daño contundente, tendrá el estado de derribada y quedará enterrada entre los escombros. Para escapar, como acción tendrá que superar una prueba de Fuerza (Atletismo) con CD 20. Si la supera, solo sufrirá la mitad de ese daño."}, {"n": "Terreno alucinatorio", "lv": 4, "esc": "Ilusionismo", "cl": ["bardo", "brujo", "druida", "mago"], "t": "Tiempo de lanzamiento: 10 minutos Alcance: 90 m Componentes: V, S, M (una seta) Duración: 24 horas¶Haces que un terreno natural en un cubo de 45 m de lado dentro del alcance tenga el aspecto, los sonidos y los olores de otro tipo de terreno natural. Por ejemplo, puedes hacer que un campo abierto o una carretera se parezcan a un pantano, una colina, una grieta u otro tipo de terreno difícil o infran- queable. Se puede hacer que un estanque parezca una pradera cubierta de hierba, que un precipicio se aparezca como una suave cuesta o que un barranco pedregoso y estrecho se presente como una carre- tera amplia
